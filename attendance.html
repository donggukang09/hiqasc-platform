<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근태 기록 | HIQASC</title>
<!-- 인증 가드: 플랫폼 공용 로그인 통과 여부 확인 (기존 패턴 유지) -->
<script>
  (function () {
    // 플랫폼 공용 로그인(개인 로그인 포함) 통과 여부 확인
    if (sessionStorage.getItem('hiqasc_authenticated') !== 'true') {
      location.href = 'index.html';
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2a2a2a;
    --card: #353535;
    --card-2: #3d3d3d;
    --border: #4a4a4a;
    --text: #e0e0e0;
    --text-dim: #9a9a9a;
    --accent: #4a90e2;
    --accent-dim: #3a72b5;
    --green: #4caf50;
    --green-dim: #3d9140;
    --red: #e26a6a;
    --red-dim: #b85454;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 48px;
  }
  .wrap { width: 100%; max-width: 460px; }

  /* 헤더 / 시계 */
  .clock-card {
    background: linear-gradient(160deg, #3a3a3a 0%, #2f2f2f 100%);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px 24px;
    text-align: center;
    margin-bottom: 18px;
    opacity: 0; transform: translateY(8px);
    animation: rise .5s ease forwards;
  }
  .date-line { font-size: 14px; color: var(--text-dim); font-weight: 500; letter-spacing: .3px; }
  .clock-time { font-size: 46px; font-weight: 800; letter-spacing: 1px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .clock-time .sec { font-size: 24px; color: var(--accent); font-weight: 700; }

  /* 카드 공통 */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    opacity: 0; transform: translateY(8px);
    animation: rise .5s ease forwards;
  }
  .card:nth-of-type(2) { animation-delay: .08s; }
  .card:nth-of-type(3) { animation-delay: .16s; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .card-label { font-size: 13px; color: var(--text-dim); font-weight: 600; margin-bottom: 12px; letter-spacing: .3px; }

  /* 본인 확인 */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  select, input[type="password"], input[type="text"] {
    width: 100%;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
    transition: border-color .15s;
  }
  select:focus, input:focus { border-color: var(--accent); }
  select option { background: #2f2f2f; }

  .verify-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 13px;
    cursor: pointer;
    margin-top: 4px;
    transition: background .15s;
  }
  .verify-btn:hover { background: var(--accent-dim); }
  .verify-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* 확인된 사용자 표시 */
  .who {
    display: none;
    align-items: center;
    gap: 12px;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .who .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px; flex-shrink: 0;
  }
  .who .name { font-size: 16px; font-weight: 700; }
  .who .meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .who .switch { margin-left: auto; font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; font-family: inherit; }

  /* 출퇴근 버튼 */
  .punch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .punch-btn {
    border: none;
    border-radius: 16px;
    padding: 24px 12px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -.2px;
    cursor: pointer;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    transition: transform .14s ease, box-shadow .2s ease, filter .15s ease, opacity .15s;
  }
  .punch-btn::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.14), transparent 60%);
    pointer-events: none;
  }
  .punch-btn .ico { font-size: 27px; line-height: 1; }
  .punch-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.32); }
  .punch-btn:active:not(:disabled) { transform: scale(.97); }
  .punch-in { background: linear-gradient(150deg, #54b85a, #409045); }
  .punch-in:hover:not(:disabled) { filter: brightness(1.06); }
  .punch-out { background: linear-gradient(150deg, #e87878, #c25656); }
  .punch-out:hover:not(:disabled) { filter: brightness(1.06); }
  .punch-btn:disabled { opacity: .32; cursor: not-allowed; box-shadow: none; }
  .punch-btn:disabled:active { transform: none; }

  /* 오늘 기록 */
  .today-row { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .today-row:last-child { border-bottom: none; }
  .today-row .k { color: var(--text-dim); }
  .today-row .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .v.empty { color: var(--text-dim); font-weight: 500; }

  .status-pill {
    display: inline-block; font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 20px;
  }
  .pill-none { background: #444; color: var(--text-dim); }
  .pill-in { background: rgba(76,175,80,.18); color: #7fd683; }
  .pill-out { background: rgba(226,106,106,.18); color: #f0a0a0; }

  /* 관리자 현황 */
  .admin-summary {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px;
  }
  .sum-box {
    background: var(--card-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 8px; text-align: center;
  }
  .sum-box .num { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sum-box .lbl { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .sum-box.s-in .num { color: #7fd683; }
  .sum-box.s-out .num { color: #f0a0a0; }
  .sum-box.s-none .num { color: var(--text-dim); }

  .admin-list { display: flex; flex-direction: column; }
  .emp-row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--border);
  }
  .emp-row:last-child { border-bottom: none; }
  .emp-row .ename { font-weight: 700; font-size: 14px; min-width: 70px; }
  .emp-row .etime { font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .emp-row .epill { margin-left: auto; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1f1f1f; border: 1px solid var(--border); color: var(--text);
    padding: 13px 22px; border-radius: 12px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { border-color: var(--green); }
  .toast.err { border-color: var(--red); }

  .hint { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 4px; line-height: 1.5; }

  .back-btn {
    display: inline-block;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    transition: color .15s, border-color .15s;
  }
  .back-btn:hover { color: var(--text); border-color: var(--accent); }

  /* 출퇴근 + 누적 가로 레이아웃 */
  .punch-row { display: flex; gap: 18px; align-items: stretch; }
  .punch-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .punch-col .punch-grid { flex: 1; }
  .accum-col { width: 150px; flex-shrink: 0; display: flex; flex-direction: column; }
  .accum-box {
    background: var(--card-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px; flex: 1;
    display: flex; flex-direction: column; justify-content: center;
  }
  .accum-box:last-child { margin-bottom: 0; }
  .accum-lbl { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .accum-val { font-size: 22px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

  /* 일별 근무 내역 */
  .history-list { display: flex; flex-direction: column; }
  .hist-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 2px; border-bottom: 1px solid var(--border);
  }
  .hist-row:last-child { border-bottom: none; }
  .hist-date { width: 78px; flex-shrink: 0; font-size: 13px; font-weight: 700; }
  .hist-date .dow { font-size: 11px; color: var(--text-dim); margin-left: 4px; font-weight: 500; }
  .hist-date.sat { color: #6fa8e0; }
  .hist-date.sun { color: #e08a8a; }
  .hist-time { flex: 1; font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .hist-dur { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .hist-row.leave .hist-time { color: #c9a96a; }
  .hist-tag {
    font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 12px; flex-shrink: 0;
    background: rgba(201,169,106,.18); color: #d8bd86;
  }
  .hist-row.holiday { opacity: .55; }
  .hist-row.holiday .hist-time { color: var(--text-dim); }

  @media (max-width: 520px) {
    .punch-row { flex-direction: column; }
    .accum-col { width: 100%; flex-direction: row; }
    .accum-box { margin-bottom: 0; }
  }

  /* 로딩 / 완료 오버레이 */
  .overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(20,20,20,.72);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .28s ease;
  }
  .overlay.show { opacity: 1; pointer-events: all; }
  .overlay-box {
    display: flex; flex-direction: column; align-items: center;
    gap: 18px; padding: 38px 44px;
    background: linear-gradient(160deg, #383838, #2d2d2d);
    border: 1px solid var(--border); border-radius: 22px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
    transform: translateY(10px) scale(.98);
    transition: transform .28s cubic-bezier(.2,.8,.2,1);
    min-width: 240px;
  }
  .overlay.show .overlay-box { transform: translateY(0) scale(1); }

  /* 3-dot 펄스 스피너 */
  .ov-spinner { display: flex; gap: 9px; height: 16px; align-items: center; }
  .ov-spinner span {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--accent);
    animation: ov-bounce 1.2s infinite ease-in-out both;
  }
  .ov-spinner span:nth-child(1){ animation-delay: -.24s; }
  .ov-spinner span:nth-child(2){ animation-delay: -.12s; }
  @keyframes ov-bounce {
    0%, 80%, 100% { transform: scale(.4); opacity: .4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* 완료 체크 */
  .ov-check { width: 56px; height: 56px; display: none; }
  .ov-check.show { display: block; }
  .ov-check-c {
    fill: none; stroke: var(--green); stroke-width: 2.5;
    stroke-dasharray: 151; stroke-dashoffset: 151;
    animation: ov-circle .5s ease forwards;
  }
  .ov-check-p {
    fill: none; stroke: var(--green); stroke-width: 3.2;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 40; stroke-dashoffset: 40;
    animation: ov-tick .35s .42s ease forwards;
  }
  @keyframes ov-circle { to { stroke-dashoffset: 0; } }
  @keyframes ov-tick { to { stroke-dashoffset: 0; } }

  .ov-msg { font-size: 18px; font-weight: 800; color: var(--text); text-align: center; letter-spacing: -.2px; }
  .ov-sub { font-size: 13px; color: var(--text-dim); text-align: center; margin-top: -8px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 메인으로 -->
  <a class="back-btn" href="index.html">← 메인으로</a>

  <!-- 실시간 시계 -->
  <div class="clock-card">
    <div class="date-line" id="dateLine">—</div>
    <div class="clock-time" id="clockTime">--:--<span class="sec">--</span></div>
  </div>

  <!-- 본인 확인 -->
  <div class="card" id="verifyCard">
    <div class="card-label">본인 확인</div>

    <div id="verifyForm">
      <div class="field">
        <label>이름</label>
        <select id="nameSelect"><option value="">불러오는 중…</option></select>
      </div>
      <div class="field">
        <label>PIN</label>
        <input type="password" id="pinInput" inputmode="numeric" placeholder="개인 PIN 입력" autocomplete="off">
      </div>
      <button class="verify-btn" id="verifyBtn" onclick="verify()">확인</button>
    </div>

    <div class="who" id="whoBox">
      <div class="avatar" id="avatar">—</div>
      <div>
        <div class="name" id="whoName">—</div>
        <div class="meta" id="whoMeta">—</div>
      </div>
      <button class="switch" onclick="resetUser()">변경</button>
    </div>
  </div>

  <!-- 출퇴근 + 누적 -->
  <div class="card" id="punchCard">
    <div class="punch-row">
      <div class="punch-col">
        <div class="card-label">출퇴근</div>
        <div class="punch-grid">
          <button class="punch-btn punch-in" id="btnIn" onclick="punch('clockIn')" disabled>
            <span class="ico">→</span>출근
          </button>
          <button class="punch-btn punch-out" id="btnOut" onclick="punch('clockOut')" disabled>
            <span class="ico">←</span>퇴근
          </button>
        </div>
        <div class="hint" id="punchHint">본인 확인 후 이용할 수 있습니다.</div>
      </div>
      <div class="accum-col">
        <div class="card-label">누적 근무</div>
        <div class="accum-box">
          <div class="accum-lbl">이번 주</div>
          <div class="accum-val" id="weekTotal">—</div>
        </div>
        <div class="accum-box">
          <div class="accum-lbl">이번 달</div>
          <div class="accum-val" id="monthTotal">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 오늘 기록 -->
  <div class="card" id="todayCard">
    <div class="card-label">오늘 기록</div>
    <div class="today-row">
      <span class="k">상태</span>
      <span class="v"><span class="status-pill pill-none" id="statusPill">미출근</span></span>
    </div>
    <div class="today-row">
      <span class="k">출근</span>
      <span class="v empty" id="inTime">—</span>
    </div>
    <div class="today-row">
      <span class="k">퇴근</span>
      <span class="v empty" id="outTime">—</span>
    </div>
  </div>

  <!-- 일별 근무 내역 -->
  <div class="card" id="historyCard">
    <div class="card-label">일별 근무 내역 <span id="historyMonth" style="color:var(--text-dim);font-weight:500;"></span></div>
    <div id="historyList" class="history-list">불러오는 중…</div>
  </div>

  <!-- 관리자: 오늘 전 직원 현황 -->
  <div class="card" id="adminCard" style="display:none;">
    <div class="card-label">오늘 전 직원 현황 <span id="adminDate" style="color:var(--text-dim);font-weight:500;"></span></div>
    <div class="admin-summary" id="adminSummary"></div>
    <div id="adminList" class="admin-list">불러오는 중…</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- 로딩 / 완료 오버레이 -->
<div class="overlay" id="overlay">
  <div class="overlay-box">
    <div class="ov-spinner" id="ovSpinner">
      <span></span><span></span><span></span>
    </div>
    <svg class="ov-check" id="ovCheck" viewBox="0 0 52 52">
      <circle class="ov-check-c" cx="26" cy="26" r="23"/>
      <path class="ov-check-p" d="M15 27 l7 7 l15 -16"/>
    </svg>
    <div class="ov-msg" id="ovMsg">불러오는 중</div>
    <div class="ov-sub" id="ovSub"></div>
  </div>
</div>

<script>
/* ====================================================================
   설정 — 아래 값만 실제 환경에 맞게 채워주세요.
   ==================================================================== */
const CONFIG = {
  // [1] 근태 기록/조회용 Apps Script 배포 URL (새 프로젝트로 별도 배포)
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbznn7_yaNAWFOeVxFt9o4IbFlKnNM-0nTyedjLAsNgaQNEmfwtaDW1rJBNEwuLxYpwUig/exec',

  // [2] 테크니션정보 시트 (이름/사번/PIN 읽기용, gviz)
  TECH_SHEET_ID: '1cmMEbIkmEL629RT04hpUUgXddnSVLGo1YwRzBwfyzCY',
  TECH_TAB: '테크니션정보',
  // 테크니션정보 시트의 헤더(첫 행) 이름과 정확히 일치시켜 주세요.
  COL_NAME: '이름',
  COL_ID:   '사번',
  COL_PIN:  'PIN',   // ← 이 컬럼은 시트에 새로 추가해야 합니다.

  // [3] 근태기록 탭 (관리자 현황 조회용, gviz) — 연차 시트와 동일
  ATT_TAB: '근태기록',
};
/* ==================================================================== */

let TECHS = [];          // [{name, id, pin}]
let currentUser = null;  // {name, id}
let punchPending = null; // 'clockIn' | 'clockOut' (기록 처리 중 표시)
let loadTimeout = null;  // 로딩 안전장치 타이머

/* ---------- 로딩 / 완료 오버레이 ---------- */
function showLoading(msg, sub){
  document.getElementById('ovSpinner').style.display = 'flex';
  document.getElementById('ovCheck').classList.remove('show');
  document.getElementById('ovMsg').textContent = msg || '불러오는 중입니다';
  document.getElementById('ovSub').textContent = sub || '잠시만 기다려 주세요';
  document.getElementById('overlay').classList.add('show');
  clearTimeout(loadTimeout);
  loadTimeout = setTimeout(hideLoading, 9000);   // 응답 지연 시 강제 해제
}
function hideLoading(){
  clearTimeout(loadTimeout);
  document.getElementById('overlay').classList.remove('show');
}
function showSuccess(msg, sub){
  clearTimeout(loadTimeout);
  document.getElementById('ovSpinner').style.display = 'none';
  const c = document.getElementById('ovCheck');
  c.classList.remove('show'); void c.offsetWidth; c.classList.add('show');  // 애니메이션 리셋
  document.getElementById('ovMsg').textContent = msg;
  document.getElementById('ovSub').textContent = sub || '';
  document.getElementById('overlay').classList.add('show');
  setTimeout(hideLoading, 2000);
}

/* ---------- 시계 ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function tick(){
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('dateLine').textContent =
    `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
  document.getElementById('clockTime').innerHTML =
    `${pad(d.getHours())}:${pad(d.getMinutes())}<span class="sec">${pad(d.getSeconds())}</span>`;
}
setInterval(tick, 1000); tick();

/* ---------- 토스트 ---------- */
let toastTimer;
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type||'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className = 'toast'; }, 2600);
}

/* ---------- 테크니션정보 로드 (gviz) ---------- */
function loadTechs(){
  const cb = 'gviz_' + Date.now();
  window[cb] = function(resp){
    try {
      const table = resp.table;
      let cols = table.cols.map(c => (c.label||'').trim());
      let rows = table.rows;
      // 첫 행(헤더) 고정이 안 돼 데이터로 흡수된 경우 자동 보정
      if (cols.indexOf(CONFIG.COL_NAME) < 0 && rows.length > 0){
        const head = rows[0].c.map(c => c ? String(c.v).trim() : '');
        if (head.indexOf(CONFIG.COL_NAME) >= 0){
          cols = head;
          rows = rows.slice(1);
        }
      }
      const ci = {
        name: cols.indexOf(CONFIG.COL_NAME),
        id:   cols.indexOf(CONFIG.COL_ID),
        pin:  cols.indexOf(CONFIG.COL_PIN),
      };
      // 사번(id)은 없어도 됨 — 이름과 PIN만 필수
      if (ci.name < 0 || ci.pin < 0){
        toast('시트 헤더(이름/PIN) 확인 필요', 'err');
        console.warn('컬럼 라벨:', cols);
        return;
      }
      TECHS = rows.map(r => ({
        name: r.c[ci.name] ? String(r.c[ci.name].v).trim() : '',
        id:   (ci.id >= 0 && r.c[ci.id]) ? String(r.c[ci.id].v).trim() : '',
        pin:  r.c[ci.pin]  ? String(r.c[ci.pin].v).trim()  : '',
      })).filter(t => t.name);

      const sel = document.getElementById('nameSelect');
      sel.innerHTML = '<option value="">선택하세요</option>' +
        TECHS.map((t,i)=>`<option value="${i}">${t.name}</option>`).join('');
    } catch(e){
      console.error(e);
      toast('명단을 불러오지 못했습니다', 'err');
    }
  };
  const q = encodeURIComponent('select *');
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.TECH_SHEET_ID}/gviz/tq`
    + `?sheet=${encodeURIComponent(CONFIG.TECH_TAB)}&headers=1`
    + `&tqx=out:json;responseHandler:${cb}&tq=${q}`;
  const s = document.createElement('script');
  s.src = url; s.onerror = ()=>toast('명단 로드 실패', 'err');
  document.body.appendChild(s);
}

/* ---------- 본인 확인 ---------- */
function verify(){
  const idx = document.getElementById('nameSelect').value;
  const pin = document.getElementById('pinInput').value.trim();
  if (idx === ''){ toast('이름을 선택하세요', 'err'); return; }
  if (!pin){ toast('PIN을 입력하세요', 'err'); return; }
  const t = TECHS[Number(idx)];
  if (String(t.pin) !== pin){ toast('PIN이 일치하지 않습니다', 'err'); return; }
  setUser({ name: t.name, id: t.id });
}

function setUser(u){
  currentUser = u;
  document.getElementById('verifyForm').style.display = 'none';
  const box = document.getElementById('whoBox');
  box.style.display = 'flex';
  document.getElementById('avatar').textContent = u.name.slice(-2);
  document.getElementById('whoName').textContent = u.name;
  document.getElementById('whoMeta').textContent = '사번 ' + (u.id || '—');
  document.getElementById('pinInput').value = '';
  showLoading('근태 정보를 불러오고 있어요', '잠시만 기다려 주세요');
  fetchStatus();
  loadMyHistory();   // 누적 + 일별 내역
}

function resetUser(){
  currentUser = null;
  document.getElementById('verifyForm').style.display = 'block';
  document.getElementById('whoBox').style.display = 'none';
  document.getElementById('btnIn').disabled = true;
  document.getElementById('btnOut').disabled = true;
  resetTodayUI();
}

/* ---------- 오늘 상태 조회 (Apps Script doGet / JSONP) ---------- */
function fetchStatus(){
  if (!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE'){
    document.getElementById('punchHint').textContent =
      'Apps Script URL 미설정 — 기록은 동작하지 않습니다.';
    // URL이 없어도 버튼은 눌러볼 수 있게 활성화(테스트용)
    document.getElementById('btnIn').disabled = false;
    document.getElementById('btnOut').disabled = false;
    hideLoading();
    return;
  }
  const cb = 'st_' + Date.now();
  window[cb] = function(res){ applyStatus(res); };
  const url = `${CONFIG.APPS_SCRIPT_URL}?action=status`
    + `&id=${encodeURIComponent(currentUser.id || '')}`
    + `&name=${encodeURIComponent(currentUser.name)}&callback=${cb}`;
  const s = document.createElement('script');
  s.src = url; s.onerror = ()=>toast('상태 조회 실패', 'err');
  document.body.appendChild(s);
}

function applyStatus(res){
  // res = { in: "09:02", out: "" } 형태 가정
  const inT = res && res.in ? res.in : '';
  const outT = res && res.out ? res.out : '';
  const pill = document.getElementById('statusPill');
  const inEl = document.getElementById('inTime');
  const outEl = document.getElementById('outTime');
  const btnIn = document.getElementById('btnIn');
  const btnOut = document.getElementById('btnOut');

  if (!inT){
    pill.className = 'status-pill pill-none'; pill.textContent = '미출근';
    inEl.textContent = '—'; inEl.className = 'v empty';
    outEl.textContent = '—'; outEl.className = 'v empty';
    btnIn.disabled = false; btnOut.disabled = true;
  } else if (inT && !outT){
    pill.className = 'status-pill pill-in'; pill.textContent = '근무 중';
    inEl.textContent = inT; inEl.className = 'v';
    outEl.textContent = '—'; outEl.className = 'v empty';
    btnIn.disabled = true; btnOut.disabled = false;
  } else {
    pill.className = 'status-pill pill-out'; pill.textContent = '퇴근 완료';
    inEl.textContent = inT; inEl.className = 'v';
    outEl.textContent = outT; outEl.className = 'v';
    btnIn.disabled = true; btnOut.disabled = true;
  }
  document.getElementById('punchHint').textContent = '';

  // 로딩 해제 + (출퇴근 직후라면) 인사 표시
  if (punchPending){
    const nm = currentUser ? currentUser.name : '';
    if (punchPending === 'clockIn'){
      showSuccess(`${nm}님, 좋은 하루 되세요!`, '출근이 기록되었습니다');
    } else {
      showSuccess(`${nm}님, 오늘도 수고하셨습니다!`, '퇴근이 기록되었습니다');
    }
    punchPending = null;
  } else {
    hideLoading();
  }
}

function resetTodayUI(){
  document.getElementById('statusPill').className = 'status-pill pill-none';
  document.getElementById('statusPill').textContent = '미출근';
  document.getElementById('inTime').textContent = '—';
  document.getElementById('inTime').className = 'v empty';
  document.getElementById('outTime').textContent = '—';
  document.getElementById('outTime').className = 'v empty';
}

/* ---------- 출/퇴근 기록 (Apps Script doPost / no-cors) ---------- */
function punch(action){
  if (!currentUser){ toast('먼저 본인 확인을 해주세요', 'err'); return; }
  if (punchPending){ return; }   // 처리 중 중복 클릭 무시
  const now = new Date();
  const time = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const nm = currentUser.name;

  // 즉시 버튼 잠금 (중복 클릭 방지)
  document.getElementById('btnIn').disabled = true;
  document.getElementById('btnOut').disabled = true;

  if (!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE'){
    if (action === 'clockIn') showSuccess(`${nm}님, 좋은 하루 되세요!`, `(테스트) 출근 ${time}`);
    else showSuccess(`${nm}님, 오늘도 수고하셨습니다!`, `(테스트) 퇴근 ${time}`);
    return;
  }

  punchPending = action;
  showLoading(action==='clockIn' ? '출근을 기록하고 있어요' : '퇴근을 기록하고 있어요', '잠시만 기다려 주세요');

  fetch(CONFIG.APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: action,
      id: currentUser.id,
      name: currentUser.name,
      time: time,
    }),
  }).then(()=>{
    // no-cors라 응답을 못 읽으므로 잠시 뒤 상태 재조회 → applyStatus에서 인사 표시
    setTimeout(()=>{ fetchStatus(); loadMyHistory(); }, 1200);
  }).catch(()=>{
    punchPending = null;
    hideLoading();
    toast('기록 전송에 실패했어요. 다시 시도해 주세요', 'err');
  });
}

/* ---------- 본인: 누적 + 일별 근무 내역 ---------- */
// "HH:mm" → 분
function toMin(t){
  if (!t) return null;
  const m = String(t).match(/(\d{1,2}):(\d{2})/);
  if (!m) return null;
  return (+m[1])*60 + (+m[2]);
}
function fmtDur(min){
  if (min == null || min <= 0) return '—';
  return Math.floor(min/60) + '시간 ' + (min%60) + '분';
}

function loadMyHistory(){
  if (!currentUser) return;
  const now = new Date();
  const y = now.getFullYear(), mo = now.getMonth();   // 이번 달
  document.getElementById('historyMonth').textContent = `(${y}년 ${mo+1}월)`;

  // 이번 주 월요일 (월~일 기준)
  const day = now.getDay();                 // 0=일
  const offsetToMon = (day === 0) ? 6 : day - 1;
  const monday = new Date(y, now.getMonth(), now.getDate() - offsetToMon);
  const mondayStr = `${monday.getFullYear()}-${pad(monday.getMonth()+1)}-${pad(monday.getDate())}`;

  gvizLoad(CONFIG.ATT_TAB, function(resp){
    try {
      const rows = (resp.table && resp.table.rows) ? resp.table.rows : [];
      const me = String(currentUser.name).trim();
      const recs = [];   // {date, in, out, min}
      rows.forEach(r => {
        const c = r.c || [];
        const name = c[2] ? String(c[2].v).trim() : '';
        if (name !== me) return;
        const date = normDate(c[0]);
        if (!date) return;
        const inT = cellText(c[3]);
        const outT = cellText(c[4]);
        const im = toMin(inT), om = toMin(outT);
        let min = (im!=null && om!=null) ? (om - im) : null;
        if (min != null && min < 0) min += 1440;
        recs.push({ date, in: inT, out: outT, min });
      });

      // 누적 계산
      let weekMin = 0, monthMin = 0;
      recs.forEach(rec => {
        if (rec.min == null) return;
        const ym = rec.date.slice(0,7);
        if (ym === `${y}-${pad(mo+1)}`) monthMin += rec.min;
        if (rec.date >= mondayStr && rec.date <= todayStr()) weekMin += rec.min;
      });
      document.getElementById('weekTotal').textContent = weekMin>0 ? fmtDur(weekMin) : '0시간';
      document.getElementById('monthTotal').textContent = monthMin>0 ? fmtDur(monthMin) : '0시간';

      renderHistory(recs, y, mo);
    } catch(e){
      console.error(e);
      document.getElementById('historyList').textContent = '내역을 불러오지 못했습니다.';
    }
  });
}

const DOW = ['일','월','화','수','목','금','토'];
function renderHistory(recs, y, mo){
  // 이번 달 기록만, 날짜 내림차순
  const map = {};
  recs.forEach(r => { if (r.date.slice(0,7) === `${y}-${pad(mo+1)}`) map[r.date] = r; });

  // 연차 데이터 (있으면 합침) — LEAVE_MAP: { 'yyyy-MM-dd': '연차' | '오전반차' ... }
  const leave = (typeof LEAVE_MAP !== 'undefined') ? LEAVE_MAP : {};

  // 1일 ~ 오늘까지 표시 (미래 제외)
  const today = new Date();
  const lastDay = (y === today.getFullYear() && mo === today.getMonth()) ? today.getDate()
                  : new Date(y, mo+1, 0).getDate();
  const rowsHtml = [];
  for (let d = lastDay; d >= 1; d--){
    const dateStr = `${y}-${pad(mo+1)}-${pad(d)}`;
    const dt = new Date(y, mo, d);
    const dow = dt.getDay();
    const dowCls = dow===0 ? 'sun' : (dow===6 ? 'sat' : '');
    const rec = map[dateStr];
    const lv = leave[dateStr];

    let timeHtml, durHtml, rowCls = '';
    if (lv){
      rowCls = 'leave';
      timeHtml = `<span class="hist-time">${lv}</span>`;
      durHtml = `<span class="hist-tag">연차</span>`;
    } else if (rec && rec.in){
      timeHtml = `<span class="hist-time">${rec.in} ~ ${rec.out || '근무중'}</span>`;
      durHtml = `<span class="hist-dur">${rec.min!=null ? fmtDur(rec.min) : '—'}</span>`;
    } else {
      // 주말은 흐리게, 평일 미기록은 '-'
      rowCls = (dow===0 || dow===6) ? 'holiday' : '';
      timeHtml = `<span class="hist-time">-</span>`;
      durHtml = `<span class="hist-dur">—</span>`;
    }
    rowsHtml.push(`<div class="hist-row ${rowCls}">
      <span class="hist-date ${dowCls}">${pad(mo+1)}.${pad(d)}<span class="dow">${DOW[dow]}</span></span>
      ${timeHtml}${durHtml}
    </div>`);
  }
  document.getElementById('historyList').innerHTML = rowsHtml.join('') || '기록이 없습니다.';
}

/* ---------- 관리자: 오늘 전 직원 현황 ---------- */
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// gviz 날짜 셀을 yyyy-MM-dd로 정규화 (Date(y,m,d) / 텍스트 모두 대응)
function normDate(cell){
  if (!cell) return '';
  const v = cell.v;
  if (typeof v === 'string'){
    const m = v.match(/Date\((\d+),(\d+),(\d+)/);
    if (m) return `${m[1]}-${pad(+m[2]+1)}-${pad(+m[3])}`;
    return v.trim();
  }
  return cell.f ? String(cell.f).trim() : '';
}
function cellText(cell){ return cell ? String(cell.f || cell.v || '').trim() : ''; }

function gvizLoad(tab, handler){
  const cb = 'gv_' + Math.random().toString(36).slice(2);
  window[cb] = handler;
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.TECH_SHEET_ID}/gviz/tq`
    + `?sheet=${encodeURIComponent(tab)}&headers=1`
    + `&tqx=out:json;responseHandler:${cb}`;
  const s = document.createElement('script');
  s.src = url; s.onerror = ()=>toast('데이터 로드 실패', 'err');
  document.body.appendChild(s);
}

let ADMIN_NAMES = null;   // 직원 이름 목록 (1회 로드 후 캐시)

function loadAdminDashboard(){
  document.getElementById('adminDate').textContent = '(' + todayStr() + ')';
  // 1) 직원 명단 (최초 1회) → 2) 오늘 근태 → 3) 병합 렌더
  if (ADMIN_NAMES){ loadTodayAtt(); return; }
  gvizLoad(CONFIG.TECH_TAB, function(resp){
    try {
      const table = resp.table;
      let cols = table.cols.map(c => (c.label||'').trim());
      let rows = table.rows;
      if (cols.indexOf(CONFIG.COL_NAME) < 0 && rows.length > 0){
        const head = rows[0].c.map(c => c ? String(c.v).trim() : '');
        if (head.indexOf(CONFIG.COL_NAME) >= 0){ cols = head; rows = rows.slice(1); }
      }
      const ni = cols.indexOf(CONFIG.COL_NAME);
      if (ni < 0){ toast('명단 헤더(이름) 확인 필요', 'err'); return; }
      ADMIN_NAMES = rows.map(r => r.c[ni] ? String(r.c[ni].v).trim() : '').filter(Boolean);
      loadTodayAtt();
    } catch(e){ console.error(e); toast('명단 로드 실패', 'err'); }
  });
}

function loadTodayAtt(){
  const today = todayStr();
  gvizLoad(CONFIG.ATT_TAB, function(resp){
    try {
      const rows = (resp.table && resp.table.rows) ? resp.table.rows : [];
      const map = {};   // 이름 -> {in, out}
      rows.forEach(r => {
        const c = r.c || [];
        if (normDate(c[0]) !== today) return;
        const name = c[2] ? String(c[2].v).trim() : '';
        if (!name) return;
        map[name] = { in: cellText(c[3]), out: cellText(c[4]) };
      });
      renderAdmin(map);
    } catch(e){ console.error(e); document.getElementById('adminList').textContent = '근태 데이터를 불러오지 못했습니다.'; }
  });
}

function renderAdmin(attMap){
  const names = ADMIN_NAMES || [];
  let nIn = 0, nOut = 0, nNone = 0;
  const rowsHtml = names.map(name => {
    const a = attMap[name];
    let pill, cls, timeTxt;
    if (!a || !a.in){
      pill = '미출근'; cls = 'pill-none'; timeTxt = '—'; nNone++;
    } else if (a.in && !a.out){
      pill = '근무 중'; cls = 'pill-in'; timeTxt = a.in + ' ~'; nIn++;
    } else {
      pill = '퇴근'; cls = 'pill-out'; timeTxt = a.in + ' ~ ' + a.out; nOut++;
    }
    return `<div class="emp-row">
      <span class="ename">${name}</span>
      <span class="etime">${timeTxt}</span>
      <span class="status-pill ${cls} epill">${pill}</span>
    </div>`;
  }).join('');

  document.getElementById('adminSummary').innerHTML = `
    <div class="sum-box s-in"><div class="num">${nIn}</div><div class="lbl">근무 중</div></div>
    <div class="sum-box s-out"><div class="num">${nOut}</div><div class="lbl">퇴근</div></div>
    <div class="sum-box s-none"><div class="num">${nNone}</div><div class="lbl">미출근</div></div>`;
  document.getElementById('adminList').innerHTML = rowsHtml || '명단이 비어 있습니다.';
  hideLoading();
}

/* ---------- 초기화 ---------- */
(function init(){
  // 관리자 로그인 → 출퇴근 대신 전 직원 현황 화면
  if (sessionStorage.getItem('hiqasc_isAdmin') === 'true'){
    document.getElementById('verifyCard').style.display = 'none';
    document.getElementById('punchCard').style.display = 'none';
    document.getElementById('todayCard').style.display = 'none';
    document.getElementById('historyCard').style.display = 'none';
    document.getElementById('adminCard').style.display = 'block';
    showLoading('전 직원 현황을 불러오고 있어요', '잠시만 기다려 주세요');

    setInterval(loadAdminDashboard, 60000);   // 60초마다 갱신(자동, 오버레이 없음)
    return;
  }
  // 직원: 로그인 정보로 자동 진입 (이름만 있으면 본인확인 생략)

    return;
  }
  loadTechs();  // 로그인 정보가 없을 때만 수동 본인확인
})();
