<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작업 지시서 | HIQ ASC</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#2a2a2a;--card:#353535;--card2:#3d3d3d;--accent:#4a90e2;--ah:#3a7fd1;--text:#f0f0f0;--muted:#aaa;--dim:#666;--border:rgba(255,255,255,0.08);--borderh:rgba(255,255,255,0.15);--danger:#e53935;--success:#4caf50;--warning:#ff9800;--r:10px;--rs:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.page-header{background:var(--card);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;gap:1rem;height:56px;position:sticky;top:0;z-index:100}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:13px}
.back-btn:hover{color:var(--text)}
.back-btn svg{width:16px;height:16px}
.header-title{font-size:15px;font-weight:600}
.tab-bar{display:flex;gap:2px;padding:0 1.5rem;background:var(--card);border-bottom:1px solid var(--border)}
.tab-btn{padding:12px 18px;font-size:13px;font-weight:500;color:var(--muted);background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.container{max-width:900px;margin:0 auto;padding:1.5rem}
.view{display:none}.view.active{display:block}

/* BOARD */
.board-toolbar{display:flex;gap:10px;margin-bottom:1.25rem;align-items:center}
.search-wrap{position:relative;flex:1}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}
.search-wrap input{width:100%;padding:9px 12px 9px 34px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:13px;font-family:inherit}
.search-wrap input:focus{outline:none;border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--dim)}
.fsel{padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer}
.fsel:focus{outline:none;border-color:var(--accent)}
.new-btn{display:flex;align-items:center;gap:6px;padding:9px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.new-btn:hover{background:var(--ah)}
.new-btn svg{width:15px;height:15px}
.order-grid{display:flex;flex-direction:column;gap:8px}
.order-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:border-color .15s,background .15s;display:flex;justify-content:space-between;align-items:center;gap:16px}
.order-card:hover{border-color:var(--borderh);background:var(--card2)}
.oc-left{flex:1;min-width:0}
.oc-docno{font-size:11px;color:var(--dim);letter-spacing:.3px;margin-bottom:3px}
.oc-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-meta{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;align-items:center}
.oc-meta svg{width:13px;height:13px;vertical-align:-1px;margin-right:3px}
.oc-right{display:flex;gap:6px;flex-shrink:0;align-items:center}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:4px;font-size:11px;font-weight:600}
.bAS{background:rgba(74,144,226,.15);color:#6fb3f7}
.bAD{background:rgba(76,175,80,.15);color:#81c784}
.bSU{background:rgba(255,152,0,.15);color:#ffb74d}
.bcat{background:rgba(150,150,150,.15);color:#bbb}
.pdf-btn{display:flex;align-items:center;gap:4px;padding:5px 10px;background:transparent;border:1px solid var(--border);border-radius:var(--rs);color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit}
.pdf-btn:hover{border-color:var(--accent);color:var(--accent)}
.pdf-btn svg{width:13px;height:13px}
.empty-state{text-align:center;padding:4rem 1rem;color:var(--dim)}
.empty-state svg{width:40px;height:40px;margin-bottom:12px;opacity:.4;display:block;margin-inline:auto}

/* FORM */
.form-page{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:1rem}
.fp-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.fp-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.fp-badge{font-size:11px;color:var(--muted);font-weight:400}
.fp-body{padding:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{padding:9px 11px;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:13px;font-family:inherit;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field input::placeholder,.field textarea::placeholder{color:var(--dim)}
.field textarea{resize:vertical;min-height:72px;line-height:1.6}
.field select option{background:#2a2a2a}
.docno-box{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);min-height:38px}
.docno-val{font-weight:600;color:var(--accent);font-size:13px;letter-spacing:.3px}
.docno-pend{color:var(--dim);font-size:12px}
.docno-ref{background:transparent;border:none;color:var(--dim);cursor:pointer;padding:2px;display:none;align-items:center;margin-left:auto}
.docno-ref:hover{color:var(--accent)}
.docno-ref svg{width:14px;height:14px}
.sec-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;margin-top:16px}
.dyn-list{display:flex;flex-direction:column;gap:6px}
.list-row{display:flex;gap:6px;align-items:center}
.list-row input{flex:1}
.btn-del{width:30px;height:30px;flex-shrink:0;background:transparent;border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;color:var(--dim);display:flex;align-items:center;justify-content:center}
.btn-del:hover{border-color:var(--danger);color:var(--danger)}
.btn-del svg{width:12px;height:12px}
.btn-add-row{width:100%;margin-top:6px;padding:7px;border:1px dashed var(--border);border-radius:var(--rs);background:transparent;cursor:pointer;font-size:12px;color:var(--dim);font-family:inherit}
.btn-add-row:hover{border-color:var(--accent);color:var(--accent)}

/* TABLE INPUT */
.tbl-input{width:100%;border-collapse:collapse;font-size:13px}
.tbl-input th{background:var(--card2);font-size:11px;font-weight:500;color:var(--muted);text-align:left;padding:7px 10px;border:1px solid var(--border)}
.tbl-input td{border:1px solid var(--border);padding:4px}
.tbl-input td input{background:transparent;border:none;padding:5px 8px;color:var(--text);font-family:inherit;font-size:13px;width:100%}
.tbl-input td input:focus{outline:none}
.tbl-input td.del-cell{width:36px;text-align:center}
.btn-add-row-tbl{margin-top:6px;padding:6px 12px;border:1px dashed var(--border);border-radius:var(--rs);background:transparent;cursor:pointer;font-size:12px;color:var(--dim);font-family:inherit}
.btn-add-row-tbl:hover{border-color:var(--accent);color:var(--accent)}

/* IMAGE UPLOAD */
.img-drop-zone{border:1.5px dashed var(--border);border-radius:var(--rs);padding:1.25rem;text-align:center;cursor:pointer;position:relative;transition:all .15s}
.img-drop-zone:hover,.img-drop-zone.drag-over{border-color:var(--accent);background:rgba(74,144,226,.05)}
.img-drop-zone svg{width:26px;height:26px;color:var(--dim);margin-bottom:6px}
.img-drop-zone p{font-size:13px;color:var(--muted);margin-bottom:2px}
.img-drop-zone span{font-size:11px;color:var(--dim)}
.img-drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.img-item{position:relative;aspect-ratio:4/3;border-radius:var(--rs);overflow:hidden;border:1px solid var(--border)}
.img-item img{width:100%;height:100%;object-fit:cover}
.img-item .img-del{position:absolute;top:4px;right:4px;width:22px;height:22px;background:rgba(0,0,0,.7);border:none;border-radius:50%;color:#fff;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.img-item .img-del:hover{background:var(--danger)}
.img-caption-wrap{padding:4px;background:rgba(0,0,0,.5);position:absolute;bottom:0;left:0;right:0}
.img-caption-wrap input{background:transparent;border:none;color:#fff;font-size:11px;width:100%;padding:2px 4px;font-family:inherit}
.img-caption-wrap input::placeholder{color:rgba(255,255,255,.5)}

/* GUIDE PAGES */
.guide-page-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:1rem}
.gp-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.gp-title-input{background:transparent;border:none;color:var(--text);font-size:13px;font-weight:600;font-family:inherit;flex:1}
.gp-title-input:focus{outline:none}
.gp-body{padding:16px 20px}
.btn-add-guide{width:100%;padding:12px;border:1px dashed var(--border);border-radius:var(--r);background:transparent;cursor:pointer;font-size:13px;color:var(--dim);font-family:inherit;margin-bottom:1rem}
.btn-add-guide:hover{border-color:var(--accent);color:var(--accent)}

/* ACTIONS */
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:1.5rem}
.btn-ghost{padding:9px 20px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:var(--rs);font-size:13px;cursor:pointer;font-family:inherit}
.btn-ghost:hover{color:var(--text);border-color:var(--borderh)}
.btn-primary{padding:9px 24px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-primary:hover{background:var(--ah)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{padding:8px 16px;background:transparent;color:var(--danger);border:1px solid rgba(229,57,53,.3);border-radius:var(--rs);font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
.btn-danger:hover{background:rgba(229,57,53,.1)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#333;color:#fff;padding:10px 20px;border-radius:var(--rs);font-size:13px;font-weight:500;z-index:999;transition:transform .3s;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:#1b5e20}
.toast.error{background:#b71c1c}
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200}
.loading-overlay.show{display:flex}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<header class="page-header">
  <a href="index.html" class="back-btn">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>홈
  </a>
  <span class="header-title">작업 지시서</span>
</header>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-board" onclick="switchTab('board')">목록</button>
  <button class="tab-btn" id="tab-form" onclick="switchTab('form')">새 지시서 작성</button>
</div>

<div class="container">
  <!-- BOARD -->
  <div class="view active" id="view-board">
    <div class="board-toolbar">
      <div class="search-wrap">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search-input" placeholder="문서번호, 제목, 작성자 검색..." oninput="renderBoard()">
      </div>
      <select class="fsel" id="filter-team" onchange="renderBoard()">
        <option value="">전체 팀</option>
        <option value="AS팀">AS팀</option>
        <option value="ADMIN">ADMIN</option>
        <option value="SUPPORT">SUPPORT</option>
      </select>
      <button class="new-btn" onclick="switchTab('form')">
        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>새 지시서
      </button>
    </div>
    <div class="order-grid" id="order-grid">
      <div class="empty-state">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0121 9.414V19a2 2 0 01-2 2z"/></svg>
        <p>불러오는 중...</p>
      </div>
    </div>
  </div>

  <!-- FORM -->
  <div class="view" id="view-form">
    <!-- PAGE 1: 기본 정보 -->
    <div class="form-page">
      <div class="fp-header">
        <div class="fp-title">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16" height="16"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0121 9.414V19a2 2 0 01-2 2z"/></svg>
          1페이지 — 작업 지시서
          <span class="fp-badge">문서 정보 · 개요 · 부품 · 절차 · 주의사항</span>
        </div>
      </div>
      <div class="fp-body">
        <!-- 문서 정보 -->
        <div class="row3">
          <div class="field">
            <label>작성 팀</label>
            <select id="f-team" onchange="onTeamChange()">
              <option value="">팀 선택</option>
              <option value="AS팀">AS팀</option>
              <option value="ADMIN">ADMIN</option>
              <option value="SUPPORT">SUPPORT</option>
            </select>
          </div>
          <div class="field">
            <label>분류</label>
            <select id="f-cat">
              <option value="수리">수리</option>
              <option value="부품 대체">부품 대체</option>
              <option value="품질 관리">품질 관리</option>
              <option value="물류">물류</option>
              <option value="기타">기타</option>
            </select>
          </div>
          <div class="field">
            <label>작성자</label>
            <input type="text" id="f-author" placeholder="이름">
          </div>
        </div>
        <div class="row2" style="margin-bottom:12px">
          <div class="field">
            <label>문서번호 (자동생성)</label>
            <div class="docno-box">
              <span id="docno-val" class="docno-pend">팀을 먼저 선택하세요</span>
              <button class="docno-ref" id="docno-ref" onclick="refreshDocno()">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label>제목</label>
            <input type="text" id="f-title" placeholder="작업 지시서 제목">
          </div>
        </div>

        <!-- 개요 -->
        <div class="sec-label">개요</div>
        <div class="field"><textarea id="f-summary" placeholder="작업의 목적 및 배경"></textarea></div>

        <!-- 공구/자재 -->
        <div class="sec-label">필요 공구 및 자재</div>
        <div class="dyn-list" id="tools-list">
          <div class="list-row"><input type="text" placeholder="예) 케이블 스트리퍼"><button class="btn-del" onclick="removeRow(this)"><svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
        </div>
        <button class="btn-add-row" onclick="addRow('tools-list','공구 또는 자재')">+ 항목 추가</button>

        <!-- 부품 -->
        <div class="sec-label">교체 부품</div>
        <table class="tbl-input" id="parts-tbl">
          <thead><tr><th style="width:130px">부품번호</th><th>부품명</th><th style="width:70px">수량</th><th style="width:90px">비고</th><th class="del-cell"></th></tr></thead>
          <tbody>
            <tr>
              <td><input type="text" placeholder="117750"></td>
              <td><input type="text" placeholder="부품 명칭"></td>
              <td><input type="text" placeholder="1"></td>
              <td><input type="text" placeholder="비고"></td>
              <td class="del-cell"><button class="btn-del" onclick="removePart(this)"><svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" width="12" height="12"><path d="M18 6L6 18M6 6l12 12"/></svg></button></td>
            </tr>
          </tbody>
        </table>
        <button class="btn-add-row-tbl" onclick="addPart()">+ 부품 추가</button>

        <!-- 절차 -->
        <div class="sec-label">작업 절차</div>
        <div class="dyn-list" id="steps-list">
          <div class="list-row"><input type="text" placeholder="1단계 작업 내용"><button class="btn-del" onclick="removeRow(this)"><svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
        </div>
        <button class="btn-add-row" onclick="addRow('steps-list','단계 내용')">+ 단계 추가</button>

        <!-- 주의사항 -->
        <div class="sec-label">주의사항</div>
        <div class="dyn-list" id="notes-list">
          <div class="list-row"><input type="text" placeholder="작업 시 유의사항"><button class="btn-del" onclick="removeRow(this)"><svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
        </div>
        <button class="btn-add-row" onclick="addRow('notes-list','주의사항')">+ 항목 추가</button>

        <!-- 서명 -->
        <div class="sec-label">서명</div>
        <div class="row3">
          <div class="field"><label>작성</label><input type="text" id="sig-write" placeholder="이름"></div>
          <div class="field"><label>검토</label><input type="text" id="sig-review" placeholder="이름"></div>
          <div class="field"><label>승인</label><input type="text" id="sig-approve" placeholder="이름"></div>
        </div>
      </div>
    </div>

    <!-- GUIDE PAGES -->
    <div id="guide-pages"></div>
    <button class="btn-add-guide" onclick="addGuidePage()">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16" height="16" style="vertical-align:-2px;margin-right:6px"><path d="M12 5v14M5 12h14"/></svg>가이드 페이지 추가
    </button>

    <div class="form-actions">
      <button class="btn-ghost" onclick="clearForm()">초기화</button>
      <button class="btn-primary" id="save-btn" onclick="generateAndSave()">PDF 생성 및 저장</button>
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'YOUR_APPS_SCRIPT_URL_HERE';
let allOrders = [];
let guidePageCount = 0;
// guideImages[pageId] = [{dataUrl, caption}, ...]
let guideImages = {};

window.addEventListener('DOMContentLoaded', () => { loadOrders(); setupGlobalDrop(); });

// ── TABS ──
function switchTab(t) {
  ['board','form'].forEach(n => {
    document.getElementById('tab-'+n)?.classList.toggle('active', n===t);
    document.getElementById('view-'+n).classList.toggle('active', n===t);
  });
  if(t==='board') renderBoard();
}

// ── LOAD ──
async function loadOrders() {
  if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL==='YOUR_APPS_SCRIPT_URL_HERE'){renderBoard();return;}
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=getAll&_=${Date.now()}`);
    allOrders = await res.json();
  } catch(e){}
  renderBoard();
}

// ── BOARD ──
function renderBoard() {
  const q=(document.getElementById('search-input').value||'').toLowerCase();

function openPdf(url){window.open(url,'_blank');}

async function deleteOrder(id){
  if(!confirm('삭제하시겠습니까?'))return;
  showLoading(true);
  try{
    await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'delete',id})});
    showToast('삭제되었습니다');
    await loadOrders();
  }catch(e){showToast('삭제 실패','error');}
  showLoading(false);
}

function getTodayStr(){const d=new Date();return`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;}

async function onTeamChange(){
  const team=document.getElementById('f-team').value;
  const el=document.getElementById('docno-val');
  const ref=document.getElementById('docno-ref');
  if(!team){el.textContent='팀을 먼저 선택하세요';el.className='docno-pend';ref.style.display='none';return;}
  el.textContent='생성 중...';el.className='docno-pend';ref.style.display='none';
  await fetchDocno(team);
  ref.style.display='flex';
}
async function refreshDocno(){const t=document.getElementById('f-team').value;if(t){document.getElementById('docno-val').textContent='생성 중...';await fetchDocno(t);}}
async function fetchDocno(team){
  const el=document.getElementById('docno-val');
  if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL==='YOUR_APPS_SCRIPT_URL_HERE'){
    const c={AS팀:'SV',ADMIN:'AD',SUPPORT:'SU'}[team]||'SV';
    el.textContent=`HIQ-${c}-${getTodayStr()}-001`;el.className='docno-val';return;
  }
  try{
    const res=await fetch(`${APPS_SCRIPT_URL}?action=getNextDocno&team=${encodeURIComponent(team)}&date=${getTodayStr()}&_=${Date.now()}`);
    const d=await res.json();el.textContent=d.docno||'오류';el.className='docno-val';
  }catch(e){el.textContent='조회 실패';el.className='docno-pend';}
}

        <p>이미지 드래그 또는 클릭</p><span>PNG, JPG 지원 · 여러 장 가능</span>

  document.getElementById('guide-pages').appendChild(el);

function removeGuidePage(id){
  delete guideImages[id];
  document.getElementById(id)?.remove();
}

function setupDropZone(id){
  const dz=document.getElementById(`dz-${id}`);
  if(!dz)return;
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');handleGuideFiles(id,e.dataTransfer.files);});
}

function setupGlobalDrop(){
  document.addEventListener('dragover',e=>e.preventDefault());
}

function handleGuideFiles(id,files){
  Array.from(files).forEach(file=>{
    if(!file.type.startsWith('image/'))return;
    const reader=new FileReader();
    reader.onload=ev=>addGuideImage(id,ev.target.result,file.name);
    reader.readAsDataURL(file);
  });
}

function addGuideImage(id,dataUrl,filename){
  const idx=guideImages[id].length;
  guideImages[id].push({dataUrl,caption:''});
  const grid=document.getElementById(`ig-${id}`);
  const item=document.createElement('div');item.className='img-item';
  item.innerHTML=`<img src="${dataUrl}" alt=""><button class="img-del" onclick="removeGuideImage('${id}',${idx},this)">✕</button><div class="img-caption-wrap"><input type="text" placeholder="캡션 (선택)" oninput="guideImages['${id}'][${idx}].caption=this.value"></div>`;
  grid.appendChild(item);
}

function removeGuideImage(id,idx,btn){
  guideImages[id].splice(idx,1);
  btn.closest('.img-item').remove();
  // re-index remaining
  const grid=document.getElementById(`ig-${id}`);
  Array.from(grid.children).forEach((item,i)=>{
    const cap=item.querySelector('input');
    if(cap)cap.setAttribute('oninput',`guideImages['${id}'][${i}].caption=this.value`);
    const del=item.querySelector('.img-del');
    if(del)del.setAttribute('onclick',`removeGuideImage('${id}',${i},this)`);
  });
}

async function generateAndSave(){
  const team=document.getElementById('f-team').value;
  const title=document.getElementById('f-title').value.trim();
  const author=document.getElementById('f-author').value.trim();
  const docno=document.getElementById('docno-val').textContent;
  if(!team){showToast('팀을 선택하세요','error');return;}
  if(!title){showToast('제목을 입력하세요','error');return;}
  if(!author){showToast('작성자를 입력하세요','error');return;}
  if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL==='YOUR_APPS_SCRIPT_URL_HERE'){showToast('Apps Script URL을 설정해 주세요','error');return;}

  document.getElementById('save-btn').disabled=true;
  showLoading(true);
  try {
    const pdfBase64=await buildPdf();
    const payload={
      action:'savePdf',pdfBase64,docno,title,
      team,cat:document.getElementById('f-cat').value,author
    };
    await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});
    showToast('저장되었습니다','success');
    clearForm();
    setTimeout(async()=>{await loadOrders();switchTab('board');},1500);
  } catch(e){showToast('저장 실패: '+e.message,'error');}
  document.getElementById('save-btn').disabled=false;
  showLoading(false);
}

async function buildPdf(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210,H=297,ML=20,MR=20,MT=20;
  const CW=W-ML-MR;

  const docno=document.getElementById('docno-val').textContent;
  const title=document.getElementById('f-title').value.trim();
  const team=document.getElementById('f-team').value;
  const cat=document.getElementById('f-cat').value;
  const author=document.getElementById('f-author').value.trim();
  const summary=document.getElementById('f-summary').value.trim();
  const tools=getListVals('tools-list');
  const steps=getListVals('steps-list');
  const notes=getListVals('notes-list');
  const parts=getParts();
  const sigWrite=document.getElementById('sig-write').value.trim();
  const sigReview=document.getElementById('sig-review').value.trim();
  const sigApprove=document.getElementById('sig-approve').value.trim();
  const today=new Date();
  const dateStr=`${today.getFullYear()}. ${String(today.getMonth()+1).padStart(2,'0')}. ${String(today.getDate()).padStart(2,'0')}`;

  const guidePageIds=Array.from(document.querySelectorAll('[id^="gp-"]')).map(el=>el.id);
  const totalPages=1+guidePageIds.length;
  let currentPage=1;

  // ── 폰트 설정 (내장 폰트 사용, 한글은 유니코드 텍스트로)
  // jsPDF 기본 폰트는 한글 미지원 → 한글 텍스트를 이미지로 렌더링하는 대신
  // canvas를 이용해 한글을 포함한 전체 페이지를 이미지로 변환하는 방식 사용

  // HTML → Canvas → PDF 방식으로 변환
  const pages=await renderPagesToCanvas(docno,title,team,cat,author,summary,tools,steps,notes,parts,sigWrite,sigReview,sigApprove,dateStr,guidePageIds,totalPages);

  for(let i=0;i<pages.length;i++){
    if(i>0)doc.addPage('a4','portrait');
    doc.addImage(pages[i],'PNG',0,0,210,297);
  }

  return doc.output('datauristring').split(',')[1];
}

async function renderPagesToCanvas(docno,title,team,cat,author,summary,tools,steps,notes,parts,sigWrite,sigReview,sigApprove,dateStr,guidePageIds,totalPages){
  const pages=[];

  // PAGE 1
  const c1=await renderPage1(docno,title,team,cat,author,summary,tools,steps,notes,parts,sigWrite,sigReview,sigApprove,dateStr,1,totalPages);
  pages.push(c1);

  // GUIDE PAGES
  for(let gi=0;gi<guidePageIds.length;gi++){
    const id=guidePageIds[gi];
    const el=document.getElementById(id);
    const gpTitle=el.querySelector('.gp-title-input').value||'작업 가이드';
    const gpDesc=el.querySelector('textarea').value||'';
    const imgs=guideImages[id]||[];
    const c=await renderGuidePage(docno,gpTitle,gpDesc,imgs,gi+2,totalPages);
    pages.push(c);
  }
  return pages;
}

const PDF_SCALE=3;
function makeCanvas(){
  const c=document.createElement('canvas');
  c.width=794*PDF_SCALE;c.height=1123*PDF_SCALE;
  const ctx=c.getContext('2d');
  ctx.scale(PDF_SCALE,PDF_SCALE);
  return {canvas:c,ctx};
}

// 텍스트 줄바꿈 헬퍼
function wrapText(ctx,text,x,y,maxW,lineH){
  const words=text.split('');let line='';let cy=y;
  // 문자 단위 줄바꿈 (한글)
  let currentLine='';
  for(let ch of text){
    const test=currentLine+ch;
    if(ctx.measureText(test).width>maxW&&currentLine){
      ctx.fillText(currentLine,x,cy);cy+=lineH;currentLine=ch;
    } else {currentLine=test;}
  }
  if(currentLine)ctx.fillText(currentLine,x,cy);
  return cy+lineH;
}

function drawSection(ctx,num,label,x,y,w){
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(x+10,y+8,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
  ctx.fillText(num,x+10,y+13);ctx.textAlign='left';
  ctx.fillStyle='#555';ctx.font='600 11px sans-serif';
  ctx.fillText(label.toUpperCase(),x+26,y+13);
  ctx.strokeStyle='#e0e0e0';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(x,y+22);ctx.lineTo(x+w,y+22);ctx.stroke();
  return y+30;
}

async function renderPage1(docno,title,team,cat,author,summary,tools,steps,notes,parts,sigWrite,sigReview,sigApprove,dateStr,pg,total){
  const {canvas,ctx}=makeCanvas();
  const W=794,ML=56,MR=56,CW=W-ML-MR;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,1123);

  let y=MT=56;

  // HEADER TOP LINE
  ctx.strokeStyle='#111';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(ML,y);ctx.lineTo(W-MR,y);ctx.stroke();
  y+=14;

  // Logo + Meta box
  ctx.fillStyle='#888';ctx.font='500 11px sans-serif';ctx.letterSpacing='1px';
  ctx.fillText('NESPRESSO B2C',ML,y+12);ctx.letterSpacing='0px';
  ctx.fillStyle='#111';ctx.font='500 22px sans-serif';
  ctx.fillText('작업 지시서',ML,y+36);

  // Meta box
  const bx=W-MR-210,by=y,bw=210,bh=80;
  ctx.strokeStyle='#ccc';ctx.lineWidth=0.5;ctx.strokeRect(bx,by,bw,bh);
  const metaRows=[['문서번호',docno],['작성일',dateStr],['작성팀 / 작성자',`${team} · ${author}`],['분류',cat]];
  metaRows.forEach((r,i)=>{
    const ry=by+i*20+14;
    if(i>0){ctx.strokeStyle='#eee';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(bx+8,ry-8);ctx.lineTo(bx+bw-8,ry-8);ctx.stroke();}
    ctx.fillStyle='#999';ctx.font='11px sans-serif';ctx.fillText(r[0],bx+10,ry);
    ctx.fillStyle='#111';ctx.font='500 11px sans-serif';
    const val=r[1]||'';
    ctx.fillText(val.length>22?val.substring(0,22)+'...':val,bx+bw-10-ctx.measureText(val.length>22?val.substring(0,22)+'...':val).width,ry);
  });
  y+=56;

  // Title center
  ctx.fillStyle='#999';ctx.font='11px sans-serif';ctx.textAlign='center';
  ctx.fillText('Technical Work Order',W/2,y+14);
  ctx.fillStyle='#111';ctx.font='500 18px sans-serif';
  ctx.fillText(title,W/2,y+34);
  ctx.textAlign='left';
  y+=50;

  // BOTTOM HEADER LINE
  ctx.strokeStyle='#111';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(ML,y);ctx.lineTo(W-MR,y);ctx.stroke();
  y+=20;

  // 1. 개요
  y=drawSection(ctx,'1','개요',ML,y,CW);
  ctx.fillStyle='#222';ctx.font='13px sans-serif';
  const summaryLines=summary||'(내용 없음)';
  y=wrapText(ctx,summaryLines,ML+28,y,CW-28,20)+4;

  // 2. 공구/자재
  y=drawSection(ctx,'2','필요 공구 및 자재',ML,y,CW);
  const toolStr=tools.length?tools.join('  ·  '):'없음';
  ctx.fillStyle='#222';ctx.font='13px sans-serif';
  y=wrapText(ctx,toolStr,ML+28,y,CW-28,20)+4;

  // 3. 부품
  y=drawSection(ctx,'3','교체 부품',ML,y,CW);
  if(parts.length){
    const tx=ML+28,tw=CW-28;
    const cols=[{w:0.18,label:'부품번호'},{w:0.42,label:'부품명'},{w:0.15,label:'수량'},{w:0.25,label:'비고'}];
    // header
    ctx.fillStyle='#f5f5f5';ctx.fillRect(tx,y,tw,22);
    ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(tx,y,tw,22);
    let cx2=tx;
    cols.forEach(c=>{
      const cw=tw*c.w;
      ctx.strokeStyle='#ddd';ctx.beginPath();ctx.moveTo(cx2+cw,y);ctx.lineTo(cx2+cw,y+22);ctx.stroke();
      ctx.fillStyle='#666';ctx.font='500 11px sans-serif';ctx.fillText(c.label,cx2+6,y+15);
      cx2+=cw;
    });
    y+=22;
    parts.forEach(p=>{
      ctx.strokeStyle='#eee';ctx.lineWidth=0.5;ctx.strokeRect(tx,y,tw,22);
      let cx3=tx;
      const vals=[p.code,p.name,p.qty,p.note];
      cols.forEach((c,ci)=>{
        const cw=tw*c.w;
        ctx.strokeStyle='#eee';ctx.beginPath();ctx.moveTo(cx3+cw,y);ctx.lineTo(cx3+cw,y+22);ctx.stroke();
        ctx.fillStyle='#222';ctx.font=ci===0?'500 12px monospace':'13px sans-serif';
        const v=vals[ci]||'';ctx.fillText(v.length>18?v.substring(0,18)+'...':v,cx3+6,y+15);
        cx3+=cw;
      });
      y+=22;
    });
    y+=4;
  } else {ctx.fillStyle='#999';ctx.font='13px sans-serif';ctx.fillText('없음',ML+28,y);y+=20;}

  // 4. 절차
  y=drawSection(ctx,'4','작업 절차',ML,y,CW);
  steps.forEach((s,i)=>{
    ctx.fillStyle='#fff';ctx.strokeStyle='#999';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.arc(ML+38,y+8,11,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#666';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText(String(i+1),ML+38,y+12);ctx.textAlign='left';
    ctx.fillStyle='#222';ctx.font='13px sans-serif';
    y=wrapText(ctx,s,ML+56,y,CW-56,20);
  });
  if(!steps.length){ctx.fillStyle='#999';ctx.font='13px sans-serif';ctx.fillText('없음',ML+28,y);y+=20;}
  y+=4;

  // 5. 주의사항
  y=drawSection(ctx,'5','주의사항',ML,y,CW);
  if(notes.length){
    ctx.fillStyle='#fff8e6';ctx.strokeStyle='#f0a000';ctx.lineWidth=3;
    const nbox_x=ML+28,nbox_w=CW-28,nbox_y=y;
    let ny=y+12;
    notes.forEach(n=>{ctx.fillStyle='#664400';ctx.font='13px sans-serif';ny=wrapText(ctx,n,nbox_x+10,ny,nbox_w-20,20);ny+=4;});
    ctx.fillRect(nbox_x,nbox_y,nbox_w,ny-nbox_y+8);
    ctx.beginPath();ctx.moveTo(nbox_x,nbox_y);ctx.lineTo(nbox_x,ny+8);ctx.stroke();
    // redraw text on top
    let ny2=nbox_y+12;
    notes.forEach(n=>{ctx.fillStyle='#664400';ctx.font='13px sans-serif';ny2=wrapText(ctx,n,nbox_x+10,ny2,nbox_w-20,20);ny2+=4;});
    y=ny+16;
  } else {ctx.fillStyle='#999';ctx.font='13px sans-serif';ctx.fillText('없음',ML+28,y);y+=20;}

  // SIGNATURE
  const sh=70,sy=1123-100;
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;ctx.strokeRect(ML,sy,CW,sh);
  const sc=CW/3;
  ['작성','검토','승인'].forEach((label,i)=>{
    const sx=ML+i*sc;
    if(i>0){ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx,sy+sh);ctx.stroke();}
    ctx.fillStyle='#999';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText(label,sx+sc/2,sy+18);
    const name=i===0?sigWrite:i===1?sigReview:sigApprove;
    if(name){ctx.strokeStyle='#bbb';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(sx+sc*0.2,sy+sh-16);ctx.lineTo(sx+sc*0.8,sy+sh-16);ctx.stroke();ctx.fillStyle='#222';ctx.font='500 12px sans-serif';ctx.fillText(name,sx+sc/2,sy+sh-6);}
    ctx.textAlign='left';
  });

  // FOOTER
  ctx.fillStyle='#aaa';ctx.font='11px sans-serif';ctx.textAlign='left';
  ctx.fillText('HIQASC — NESPRESSO Authorized Service Center',ML,1123-18);
  ctx.textAlign='right';
  ctx.fillText(`${docno}  ·  ${pg} / ${total}`,W-MR,1123-18);
  ctx.textAlign='left';

  return canvas.toDataURL('image/png');
}

async function renderGuidePage(docno,gpTitle,gpDesc,imgs,pg,total){
  const {canvas,ctx}=makeCanvas();
  const W=794,ML=56,MR=56,CW=W-ML-MR;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,1123);

  // HEADER
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(ML,50);ctx.lineTo(W-MR,50);ctx.stroke();
  ctx.fillStyle='#111';ctx.font='500 13px sans-serif';ctx.fillText(`작업 가이드 — ${gpTitle}`,ML,38);
  ctx.fillStyle='#aaa';ctx.font='11px sans-serif';ctx.textAlign='right';
  ctx.fillText(docno,W-MR,38);ctx.textAlign='left';

  let y=68;

  // 설명
  if(gpDesc){
    ctx.fillStyle='#333';ctx.font='13px sans-serif';
    y=wrapText(ctx,gpDesc,ML,y,CW,20)+8;
  }

  // 이미지들
  if(imgs.length){
    const imgW=imgs.length===1?CW:(CW-12)/2;
    const imgH=imgW*0.65;
    for(let i=0;i<imgs.length;i++){
      const col=i%2,row=Math.floor(i/2);
      const ix=ML+col*(imgW+12);
      const iy=y+row*(imgH+36);
      await new Promise(resolve=>{
        const img=new Image();
        img.onload=()=>{
          ctx.drawImage(img,ix,iy,imgW,imgH);
          ctx.strokeStyle='#e0e0e0';ctx.lineWidth=0.5;ctx.strokeRect(ix,iy,imgW,imgH);
          if(imgs[i].caption){
            ctx.fillStyle='#666';ctx.font='11px sans-serif';
            ctx.fillText(imgs[i].caption,ix,iy+imgH+14);
          }
          resolve();
        };
        img.onerror=resolve;
        img.src=imgs[i].dataUrl;
      });
    }
  }

  // FOOTER
  ctx.fillStyle='#aaa';ctx.font='11px sans-serif';ctx.textAlign='left';
  ctx.fillText('HIQASC — NESPRESSO Authorized Service Center',ML,1123-18);
  ctx.textAlign='right';
  ctx.fillText(`${docno}  ·  ${pg} / ${total}`,W-MR,1123-18);
  ctx.textAlign='left';

  return canvas.toDataURL('image/png');
}

// ── UTILS ──
function showLoading(v){document.getElementById('loading').classList.toggle('show',v);}
let toastTimer;
function showToast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast show'+(type?' '+type:'');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800);
}
</script>
