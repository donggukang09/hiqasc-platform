<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데일리 브리핑 관리 - HIQASC</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Manrope',sans-serif;background:#0c0c14;color:#e4e4ef;min-height:100vh;}
.bg-grad{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 30% 0%,rgba(74,144,226,0.06) 0%,transparent 50%);pointer-events:none;z-index:0;}

.header{position:relative;z-index:10;background:rgba(16,16,25,0.8);backdrop-filter:blur(20px);border-bottom:1px solid #232333;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;}
.header h1{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:700;color:#f59e0b;letter-spacing:3px;}
.header .date-text{color:#7a7a95;font-size:13px;margin-left:16px;}
.header-left{display:flex;align-items:center;}
.hdr-btn{background:rgba(255,255,255,0.04);color:#7a7a95;border:1px solid #232333;padding:7px 14px;border-radius:8px;font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.25s;text-decoration:none;}
.hdr-btn:hover{background:rgba(255,255,255,0.08);color:#e4e4ef;}

#prepPhase{position:relative;z-index:10;max-width:620px;margin:50px auto;padding:0 20px;}
.prep-card{background:#16161f;border:1px solid #232333;border-radius:16px;padding:36px;position:relative;overflow:hidden;}
.prep-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#f59e0b,#ef4444,#f59e0b);}
.prep-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;color:#f59e0b;margin-bottom:4px;}
.prep-sub{font-size:12px;color:#7a7a95;margin-bottom:24px;}
.prep-label{font-size:12px;font-weight:700;color:#7a7a95;margin-bottom:6px;display:block;}
.prep-input,.prep-textarea{width:100%;background:#0c0c14;border:1px solid #232333;border-radius:10px;padding:12px 14px;font-family:'Manrope',sans-serif;font-size:14px;color:#e4e4ef;outline:none;transition:border-color 0.3s;}
.prep-input:focus,.prep-textarea:focus{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,0.15);}
.prep-input::placeholder,.prep-textarea::placeholder{color:#3a3a50;}
.prep-textarea{min-height:70px;resize:vertical;}
.prep-section{margin-bottom:16px;}
.prep-section-title{font-size:11px;font-weight:700;color:#a78bfa;letter-spacing:1px;margin-bottom:10px;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
.prep-section-title::before,.prep-section-title::after{content:'';flex:1;height:1px;background:#232333;}
.prep-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;}
.btn-execute{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;padding:12px 32px;background:linear-gradient(135deg,#f59e0b,#e08900);color:#fff;border:none;border-radius:10px;cursor:pointer;transition:transform 0.2s,box-shadow 0.3s;}
.btn-execute:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(245,158,11,0.3);}
.btn-execute:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none;}
.prep-hint{text-align:center;margin-top:20px;font-size:11px;color:#7a7a95;opacity:0.5;}

.status-msg{text-align:center;margin-top:16px;font-size:13px;font-weight:600;min-height:20px;}
.status-msg.ok{color:#34d399;}
.status-msg.err{color:#f87171;}
.status-msg.sending{color:#f59e0b;}

.admin-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.25);color:#f59e0b;font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;letter-spacing:0.5px;}
</style>
</head>
<body>
<div class="bg-grad"></div>

<div class="header">
    <div class="header-left">
        <h1>BRIEFING ADMIN</h1>
        <span class="date-text" id="headerDate"></span>
        <span style="margin-left:12px;" class="admin-badge">🔒 관리자 전용</span>
    </div>
    <div>
        <a class="hdr-btn" href="index.html">← 홈</a>
    </div>
</div>

<div id="prepPhase">
    <div class="prep-card">
        <div class="prep-title">DAILY BRIEFING</div>
        <div class="prep-sub">브리핑 데이터를 입력하고 발송하세요. 입고량 · 근태는 자동 수집됩니다.</div>

        <div class="prep-section">
            <div class="prep-section-title">수량 입력</div>
            <div>
                <label class="prep-label">전일 잔여 수량 (대)</label>
                <input type="number" class="prep-input" id="inputRemain" placeholder="어제 미수리 잔여 대수" min="0">
            </div>
        </div>

        <div class="prep-section">
            <div class="prep-section-title">공지사항</div>
            <div style="margin-bottom:12px;">
                <label class="prep-label">📅 업무 종료 후 일정</label>
                <textarea class="prep-textarea" id="inputSchedule" placeholder="예: 17:30 전체 회의 / 18:00 회식"></textarea>
            </div>
            <div>
                <label class="prep-label">📌 전달사항</label>
                <textarea class="prep-textarea" id="inputNotice" placeholder="중요 공지사항을 입력하세요"></textarea>
            </div>
        </div>

        <div class="prep-actions">
            <button class="btn-execute" id="btnLaunch" onclick="launchBriefing()">🚀 LAUNCH</button>
        </div>
        <div class="status-msg" id="statusMsg"></div>
    </div>
    <div class="prep-hint">LAUNCH 클릭 시 → 브리핑 시트 저장 + 전 직원 알림 발송</div>
</div>

<script>
// ===== CONFIG =====
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2g4tmE7OfTkLmOHhyjZpc7zXktU5Y3mew8ajxESArRDC8XmTMtquZ3NBOyd-eH8oTGw/exec';

var now = new Date();
var dayNames = ['일','월','화','수','목','금','토'];
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
var todayStr = fmtDate(now);

document.getElementById('headerDate').textContent =
    now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+
    String(now.getDate()).padStart(2,'0')+' ('+dayNames[now.getDay()]+')';

function launchBriefing() {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
        document.getElementById('statusMsg').textContent = '⚠️ Apps Script URL을 설정하세요';
        document.getElementById('statusMsg').className = 'status-msg err';
        return;
    }

    var btn = document.getElementById('btnLaunch');
    btn.disabled = true;
    btn.textContent = '발송 중...';

    var statusEl = document.getElementById('statusMsg');
    statusEl.textContent = '📡 브리핑 데이터 저장 + 알림 발송 중...';
    statusEl.className = 'status-msg sending';

    var payload = {
        date: todayStr,
        remain: parseInt(document.getElementById('inputRemain').value) || 0,
        schedule: document.getElementById('inputSchedule').value || '',
        notice: document.getElementById('inputNotice').value || ''
    };

    fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(function() {
        statusEl.textContent = '✅ 브리핑 발송 완료! 전 직원에게 알림이 전송됩니다.';
        statusEl.className = 'status-msg ok';
        btn.textContent = '✅ 발송 완료';
        // 매니저 본인도 확인 처리
        localStorage.setItem('hiq_briefing_seen', todayStr);
    })
    .catch(function(err) {
        statusEl.textContent = '❌ 발송 실패: ' + err.message;
        statusEl.className = 'status-msg err';
        btn.disabled = false;
        btn.textContent = '🚀 LAUNCH';
    });
}
</script>
</body>
</html>
