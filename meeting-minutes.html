<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회의록 시스템 | HIQASC</title>
<script>
  if (sessionStorage.getItem('hiqasc_authenticated') !== 'true') {
    document.documentElement.style.display = 'none';
    window.location.href = 'index.html';
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', sans-serif; }
  body { background: #2a2a2a; color: #e0e0e0; min-height: 100vh; padding: 20px; }
  .container { max-width: 1400px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; margin-bottom: 20px; border-bottom: 1px solid #4a4a4a; gap: 16px; }
  .header h1 { font-size: 26px; font-weight: 800; }
  .header .subtitle { color: #999; font-size: 13px; margin-top: 4px; }
  .header-actions { display: flex; gap: 10px; }
  .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.15s; font-family: 'Manrope', sans-serif; white-space: nowrap; }
  .btn-primary { background: #4a90e2; color: white; }
  .btn-primary:hover { background: #357abd; }
  .btn-secondary { background: #4a4a4a; color: #e0e0e0; }
  .btn-secondary:hover { background: #5a5a5a; }
  .btn-danger { background: #d9534f; color: white; }
  .btn-danger:hover { background: #c9302c; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  .search-input { flex: 1; min-width: 200px; padding: 10px 14px; background: #353535; border: 1px solid #4a4a4a; border-radius: 6px; color: #e0e0e0; font-size: 14px; font-family: 'Manrope', sans-serif; }
  .search-input::placeholder { color: #888; }
  .search-input:focus { outline: none; border-color: #4a90e2; }
  .meeting-card { background: #353535; border: 1px solid #4a4a4a; border-radius: 8px; padding: 18px 22px; margin-bottom: 12px; cursor: pointer; transition: all 0.15s; }
  .meeting-card:hover { background: #3d3d3d; border-color: #4a90e2; transform: translateY(-1px); }
  .meeting-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 8px; }
  .meeting-title { font-size: 17px; font-weight: 700; color: #e0e0e0; }
  .meeting-date { color: #4a90e2; font-size: 13px; white-space: nowrap; font-weight: 600; }
  .meeting-meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: #aaa; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: flex-start; justify-content: center; z-index: 1000; padding: 40px 20px; overflow-y: auto; }
  .modal-overlay.active { display: flex; }
  .modal { background: #353535; border: 1px solid #4a4a4a; border-radius: 12px; width: 100%; max-width: 880px; padding: 28px; }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; padding-bottom: 14px; border-bottom: 1px solid #4a4a4a; gap: 16px; }
  .modal-title { font-size: 20px; font-weight: 700; }
  .close-btn { background: none; border: none; color: #999; font-size: 28px; cursor: pointer; line-height: 1; padding: 0 4px; }
  .close-btn:hover { color: #e0e0e0; }
  .form-group { margin-bottom: 16px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: #bbb; margin-bottom: 6px; }
  .form-input, .form-textarea { width: 100%; padding: 10px 12px; background: #2a2a2a; border: 1px solid #4a4a4a; border-radius: 6px; color: #e0e0e0; font-size: 14px; font-family: 'Manrope', sans-serif; }
  .form-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
  .form-input:focus, .form-textarea:focus { outline: none; border-color: #4a90e2; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; padding-top: 14px; border-top: 1px solid #4a4a4a; }
  .empty-state { text-align: center; padding: 60px 20px; color: #888; }
  .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: #aaa; font-weight: 700; }
  .loading { text-align: center; padding: 40px; color: #888; }
  .detail-section { margin-bottom: 18px; }
  .detail-section h4 { font-size: 12px; font-weight: 700; color: #4a90e2; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.6px; }
  .detail-section .detail-content { background: #2a2a2a; padding: 14px 16px; border-radius: 6px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; min-height: 20px; color: #e0e0e0; border: 1px solid #404040; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #4a90e2; color: white; padding: 12px 24px; border-radius: 6px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,0.4); z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.error { background: #d9534f; }

  /* 메인 2단 레이아웃 */
  .main-grid { display: grid; grid-template-columns: 1fr 360px; gap: 20px; align-items: start; }
  .calendar-side { position: sticky; top: 20px; }

  /* 팀 뱃지 */
  .team-badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; color: white; letter-spacing: 0.4px; }
  .team-ADMIN { background: #f0a830; }
  .team-AS { background: #4a90e2; }
  .team-SUPPORT { background: #5cb85c; }
  .team-B2B { background: #9c5cb5; }

  /* 팀 필터 */
  .team-filter { display: flex; gap: 6px; flex-wrap: wrap; }
  .team-filter button { padding: 6px 12px; background: #353535; border: 1px solid #4a4a4a; border-radius: 4px; color: #aaa; cursor: pointer; font-size: 12px; font-weight: 600; font-family: 'Manrope', sans-serif; }
  .team-filter button.active { color: white; border-color: transparent; }
  .team-filter button.active[data-team="ALL"] { background: #4a90e2; }
  .team-filter button.active[data-team="ADMIN"] { background: #f0a830; }
  .team-filter button.active[data-team="AS"] { background: #4a90e2; }
  .team-filter button.active[data-team="SUPPORT"] { background: #5cb85c; }
  .team-filter button.active[data-team="B2B"] { background: #9c5cb5; }

  /* 캘린더 (사이드용 - 작게) */
  .calendar-wrapper { background: #353535; border: 1px solid #4a4a4a; border-radius: 8px; padding: 16px; }
  .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .calendar-title { font-size: 16px; font-weight: 700; }
  .calendar-nav { display: flex; gap: 4px; align-items: center; }
  .calendar-nav button { padding: 4px 10px; background: #4a4a4a; border: none; border-radius: 4px; color: #e0e0e0; cursor: pointer; font-weight: 600; font-size: 12px; font-family: 'Manrope', sans-serif; }
  .calendar-nav button:hover { background: #5a5a5a; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .calendar-dow { text-align: center; padding: 6px 0; font-size: 10px; font-weight: 700; color: #888; }
  .calendar-dow.sun { color: #e57373; }
  .calendar-dow.sat { color: #64b5f6; }
  .calendar-day { background: #2a2a2a; border: 1px solid #404040; border-radius: 4px; min-height: 54px; padding: 4px; cursor: pointer; transition: all 0.12s; display: flex; flex-direction: column; gap: 3px; align-items: center; }
  .calendar-day:hover { border-color: #4a90e2; background: #303030; }
  .calendar-day.empty { background: transparent; border: none; cursor: default; }
  .calendar-day.empty:hover { background: transparent; }
  .calendar-day.today { border-color: #4a90e2; box-shadow: inset 0 0 0 1px #4a90e2; }
  .calendar-day-num { font-size: 12px; font-weight: 700; color: #ccc; }
  .calendar-day.today .calendar-day-num { color: #4a90e2; }
  .calendar-day-num.sun { color: #e57373; }
  .calendar-day-num.sat { color: #64b5f6; }
  .calendar-day-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 100%; }
  .calendar-dot { width: 6px; height: 6px; border-radius: 50%; }
  .calendar-dot.ADMIN { background: #f0a830; }
  .calendar-dot.AS { background: #4a90e2; }
  .calendar-dot.SUPPORT { background: #5cb85c; }
  .calendar-dot.B2B { background: #9c5cb5; }
  .calendar-more { font-size: 9px; color: #888; }

  /* 캘린더 범례 */
  .cal-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #4a4a4a; font-size: 11px; }
  .cal-legend-item { display: flex; align-items: center; gap: 5px; color: #aaa; }
  .cal-legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  .day-meetings-list .meeting-card { margin-bottom: 10px; }

  .form-select { width: 100%; padding: 10px 12px; background: #2a2a2a; border: 1px solid #4a4a4a; border-radius: 6px; color: #e0e0e0; font-size: 14px; font-family: 'Manrope', sans-serif; cursor: pointer; }
  .form-select:focus { outline: none; border-color: #4a90e2; }

  @media (max-width: 1024px) {
    .main-grid { grid-template-columns: 1fr; }
    .calendar-side { position: static; }
  }
  @media (max-width: 768px) {
    .form-row { grid-template-columns: 1fr; }
    .meeting-card-header { flex-direction: column; gap: 4px; }
    .header { flex-direction: column; align-items: flex-start; }
    .header-actions { width: 100%; }
    .header-actions .btn { flex: 1; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>📝 회의록 시스템</h1>
      <div class="subtitle">회의 내용을 기록하고 공유합니다</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="openCreateModal()">＋ 새 회의록</button>
      <button class="btn btn-secondary" onclick="location.href='index.html'">← 홈으로</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" class="search-input" placeholder="제목 · 참석자 · 내용 · 작성자 검색..." oninput="filterMeetings()">
    <button class="btn btn-secondary" onclick="loadMeetings()">🔄 새로고침</button>
  </div>

  <div class="toolbar">
    <div class="team-filter" id="teamFilter">
      <button data-team="ALL" class="active" onclick="setTeamFilter('ALL')">전체</button>
      <button data-team="ADMIN" onclick="setTeamFilter('ADMIN')">ADMIN</button>
      <button data-team="AS" onclick="setTeamFilter('AS')">AS TEAM</button>
      <button data-team="SUPPORT" onclick="setTeamFilter('SUPPORT')">SUPPORT TEAM</button>
      <button data-team="B2B" onclick="setTeamFilter('B2B')">B2B TEAM</button>
    </div>
  </div>

  <div class="main-grid">
    <div id="meetingList">
      <div class="loading">불러오는 중...</div>
    </div>

    <div class="calendar-side">
      <div class="calendar-wrapper">
        <div class="calendar-header">
          <div class="calendar-title" id="calendarTitle"></div>
          <div class="calendar-nav">
            <button onclick="navMonth(-1)">◀</button>
            <button onclick="goToday()">오늘</button>
            <button onclick="navMonth(1)">▶</button>
          </div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <div class="cal-legend">
          <div class="cal-legend-item"><span class="cal-legend-dot" style="background:#f0a830"></span>ADMIN</div>
          <div class="cal-legend-item"><span class="cal-legend-dot" style="background:#4a90e2"></span>AS</div>
          <div class="cal-legend-item"><span class="cal-legend-dot" style="background:#5cb85c"></span>SUPPORT</div>
          <div class="cal-legend-item"><span class="cal-legend-dot" style="background:#9c5cb5"></span>B2B</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 작성/수정 모달 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">새 회의록 작성</div>
      <button class="close-btn" onclick="closeModal('editModal')">×</button>
    </div>
    <form id="meetingForm" onsubmit="return false;">
      <input type="hidden" id="meetingId">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">팀 *</label>
          <select id="meetingTeam" class="form-select" required>
            <option value="ADMIN">ADMIN</option>
            <option value="AS">AS TEAM</option>
            <option value="SUPPORT">SUPPORT TEAM</option>
            <option value="B2B">B2B TEAM</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">회의 일시 *</label>
          <input type="datetime-local" id="meetingDate" class="form-input" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">작성자 *</label>
          <input type="text" id="meetingAuthor" class="form-input" placeholder="이름 입력" required>
        </div>
        <div class="form-group">
          <label class="form-label">장소</label>
          <input type="text" id="meetingLocation" class="form-input" placeholder="예: 본사 회의실 A">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">회의 제목 *</label>
        <input type="text" id="meetingTitle" class="form-input" placeholder="예: 9월 정기 운영 회의" required>
      </div>
      <div class="form-group">
        <label class="form-label">참석자</label>
        <input type="text" id="meetingAttendees" class="form-input" placeholder="이름들을 쉼표로 구분">
      </div>
      <div class="form-group">
        <label class="form-label">안건</label>
        <textarea id="meetingAgenda" class="form-textarea" placeholder="다룰 안건들을 입력하세요"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">회의 내용 *</label>
        <textarea id="meetingContent" class="form-textarea" style="min-height: 200px;" placeholder="논의 내용을 자세히 기록하세요" required></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">결정 사항</label>
        <textarea id="meetingDecisions" class="form-textarea" placeholder="회의를 통해 결정된 사항들"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">액션 아이템</label>
        <textarea id="meetingActions" class="form-textarea" placeholder="누가 · 무엇을 · 언제까지"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal('editModal')">취소</button>
        <button type="button" class="btn btn-primary" id="saveBtn" onclick="saveMeeting()">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 상세 모달 -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <div style="flex:1;">
        <div class="modal-title" id="detailTitle"></div>
        <div style="color: #999; font-size: 13px; margin-top: 6px;" id="detailMeta"></div>
      </div>
      <button class="close-btn" onclick="closeModal('detailModal')">×</button>
    </div>
    <div id="detailBody"></div>
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="deleteMeeting()">삭제</button>
      <button class="btn btn-secondary" onclick="closeModal('detailModal')">닫기</button>
      <button class="btn btn-primary" onclick="editMeeting()">수정</button>
    </div>
  </div>
</div>

<!-- 날짜별 회의 목록 모달 (여러 건일 때) -->
<div class="modal-overlay" id="dayListModal">
  <div class="modal" style="max-width: 600px;">
    <div class="modal-header">
      <div class="modal-title" id="dayListTitle"></div>
      <button class="close-btn" onclick="closeModal('dayListModal')">×</button>
    </div>
    <div class="day-meetings-list" id="dayListBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ⚠️ 회의록 전용 Apps Script URL (별도 프로젝트로 배포 후 입력)
  const APPS_SCRIPT_URL = 'YOUR_APPS_SCRIPT_URL_HERE';

  const TEAM_LABEL = {
    'ADMIN': 'ADMIN',
    'AS': 'AS TEAM',
    'SUPPORT': 'SUPPORT TEAM',
    'B2B': 'B2B TEAM'
  };

  let allMeetings = [];
  let currentDetailMeeting = null;
  let currentTeamFilter = 'ALL';
  let calCursor = new Date();
  calCursor.setDate(1);

  window.addEventListener('DOMContentLoaded', () => {
    renderCalendar();
    loadMeetings();
  });

  // 목록 불러오기 (JSONP)
  function loadMeetings() {
    const listEl = document.getElementById('meetingList');
    listEl.innerHTML = '<div class="loading">불러오는 중...</div>';

    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
      listEl.innerHTML = '<div class="empty-state"><h3>Apps Script URL이 설정되지 않았습니다</h3><p>코드 상단의 APPS_SCRIPT_URL을 입력해주세요.</p></div>';
      return;
    }

    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    const script = document.createElement('script');

    window[cbName] = function(data) {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      if (data && data.success) {
        allMeetings = data.meetings || [];
        filterMeetings();
      } else {
        listEl.innerHTML = '<div class="empty-state"><h3>불러오기 실패</h3><p>' + escapeHtml((data && data.error) || '') + '</p></div>';
      }
    };

    script.src = APPS_SCRIPT_URL + '?action=list&callback=' + cbName + '&t=' + Date.now();
    script.onerror = function() {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      listEl.innerHTML = '<div class="empty-state"><h3>네트워크 오류</h3><p>Apps Script URL을 확인해주세요.</p></div>';
    };
    document.body.appendChild(script);
  }

  function renderMeetings(meetings) {
    const listEl = document.getElementById('meetingList');
    if (!meetings.length) {
      listEl.innerHTML = '<div class="empty-state"><h3>등록된 회의록이 없습니다</h3><p>＋ 새 회의록 버튼을 눌러 작성해보세요</p></div>';
      return;
    }
    listEl.innerHTML = meetings.map(m => {
      const team = m.team || 'ADMIN';
      return `
      <div class="meeting-card" onclick="openDetail('${escapeAttr(m.id)}')">
        <div class="meeting-card-header">
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <span class="team-badge team-${team}">${escapeHtml(TEAM_LABEL[team] || team)}</span>
            <div class="meeting-title">${escapeHtml(m.title)}</div>
          </div>
          <div class="meeting-date">${formatDate(m.date)}</div>
        </div>
        <div class="meeting-meta">
          ${m.location ? `<span>📍 ${escapeHtml(m.location)}</span>` : ''}
          ${m.attendees ? `<span>👥 ${escapeHtml(m.attendees)}</span>` : ''}
          ${m.author ? `<span>✍ ${escapeHtml(m.author)}</span>` : ''}
        </div>
      </div>
    `;}).join('');
  }

  function setTeamFilter(team) {
    currentTeamFilter = team;
    document.querySelectorAll('#teamFilter button').forEach(b => {
      b.classList.toggle('active', b.dataset.team === team);
    });
    filterMeetings();
  }

  function filterMeetings() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    let filtered = allMeetings;
    if (currentTeamFilter !== 'ALL') {
      filtered = filtered.filter(m => (m.team || 'ADMIN') === currentTeamFilter);
    }
    if (q) {
      filtered = filtered.filter(m =>
        (m.title || '').toLowerCase().includes(q) ||
        (m.attendees || '').toLowerCase().includes(q) ||
        (m.content || '').toLowerCase().includes(q) ||
        (m.author || '').toLowerCase().includes(q) ||
        (m.agenda || '').toLowerCase().includes(q) ||
        (m.decisions || '').toLowerCase().includes(q)
      );
    }
    renderMeetings(filtered);
    renderCalendar();
  }

  function openCreateModal() {
    document.getElementById('modalTitle').textContent = '새 회의록 작성';
    document.getElementById('meetingId').value = '';
    document.getElementById('meetingForm').reset();
    document.getElementById('meetingTeam').value = currentTeamFilter !== 'ALL' ? currentTeamFilter : 'ADMIN';
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('meetingDate').value = now.toISOString().slice(0, 16);
    document.getElementById('editModal').classList.add('active');
  }

  function openDetail(id) {
    const m = allMeetings.find(x => x.id === id);
    if (!m) return;
    currentDetailMeeting = m;
    const team = m.team || 'ADMIN';
    document.getElementById('detailTitle').innerHTML = `<span class="team-badge team-${team}" style="margin-right:10px; vertical-align:middle;">${escapeHtml(TEAM_LABEL[team] || team)}</span>${escapeHtml(m.title)}`;
    const metaParts = [formatDate(m.date)];
    if (m.location) metaParts.push('📍 ' + m.location);
    if (m.author) metaParts.push('✍ ' + m.author);
    document.getElementById('detailMeta').textContent = metaParts.join('  ·  ');

    document.getElementById('detailBody').innerHTML = `
      ${m.attendees ? `<div class="detail-section"><h4>참석자</h4><div class="detail-content">${escapeHtml(m.attendees)}</div></div>` : ''}
      ${m.agenda ? `<div class="detail-section"><h4>안건</h4><div class="detail-content">${escapeHtml(m.agenda)}</div></div>` : ''}
      <div class="detail-section"><h4>회의 내용</h4><div class="detail-content">${escapeHtml(m.content || '')}</div></div>
      ${m.decisions ? `<div class="detail-section"><h4>결정 사항</h4><div class="detail-content">${escapeHtml(m.decisions)}</div></div>` : ''}
      ${m.actions ? `<div class="detail-section"><h4>액션 아이템</h4><div class="detail-content">${escapeHtml(m.actions)}</div></div>` : ''}
    `;
    document.getElementById('detailModal').classList.add('active');
  }

  function editMeeting() {
    if (!currentDetailMeeting) return;
    const m = currentDetailMeeting;
    closeModal('detailModal');
    document.getElementById('modalTitle').textContent = '회의록 수정';
    document.getElementById('meetingId').value = m.id;
    document.getElementById('meetingTeam').value = m.team || 'ADMIN';
    document.getElementById('meetingDate').value = (m.date || '').slice(0, 16);
    document.getElementById('meetingAuthor').value = m.author || '';
    document.getElementById('meetingTitle').value = m.title || '';
    document.getElementById('meetingLocation').value = m.location || '';
    document.getElementById('meetingAttendees').value = m.attendees || '';
    document.getElementById('meetingAgenda').value = m.agenda || '';
    document.getElementById('meetingContent').value = m.content || '';
    document.getElementById('meetingDecisions').value = m.decisions || '';
    document.getElementById('meetingActions').value = m.actions || '';
    document.getElementById('editModal').classList.add('active');
  }

  function saveMeeting() {
    const id = document.getElementById('meetingId').value;
    const data = {
      action: id ? 'update' : 'create',
      id: id || 'M' + Date.now(),
      team: document.getElementById('meetingTeam').value,
      date: document.getElementById('meetingDate').value,
      author: document.getElementById('meetingAuthor').value.trim(),
      title: document.getElementById('meetingTitle').value.trim(),
      location: document.getElementById('meetingLocation').value.trim(),
      attendees: document.getElementById('meetingAttendees').value.trim(),
      agenda: document.getElementById('meetingAgenda').value.trim(),
      content: document.getElementById('meetingContent').value.trim(),
      decisions: document.getElementById('meetingDecisions').value.trim(),
      actions: document.getElementById('meetingActions').value.trim()
    };

    if (!data.date || !data.author || !data.title || !data.content || !data.team) {
      showToast('필수 항목(*)을 모두 입력해주세요', true);
      return;
    }
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
      showToast('Apps Script URL이 설정되지 않았습니다', true);
      return;
    }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = '저장 중...';

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(data)
    }).then(() => {
      showToast(id ? '회의록이 수정되었습니다' : '회의록이 저장되었습니다');
      closeModal('editModal');
      setTimeout(loadMeetings, 1000);
    }).catch(() => {
      showToast('저장에 실패했습니다', true);
    }).finally(() => {
      btn.disabled = false;
      btn.textContent = '저장';
    });
  }

  function deleteMeeting() {
    if (!currentDetailMeeting) return;
    if (!confirm('정말 이 회의록을 삭제하시겠습니까?\n삭제된 회의록은 복구할 수 없습니다.')) return;

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', id: currentDetailMeeting.id })
    }).then(() => {
      showToast('회의록이 삭제되었습니다');
      closeModal('detailModal');
      setTimeout(loadMeetings, 1000);
    }).catch(() => {
      showToast('삭제에 실패했습니다', true);
    });
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('active');
  }

  function showToast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => { t.className = 'toast'; }, 2500);
  }

  // ===== 캘린더 =====
  function navMonth(delta) {
    calCursor.setMonth(calCursor.getMonth() + delta);
    renderCalendar();
  }

  function goToday() {
    calCursor = new Date();
    calCursor.setDate(1);
    renderCalendar();
  }

  function renderCalendar() {
    const titleEl = document.getElementById('calendarTitle');
    const gridEl = document.getElementById('calendarGrid');
    if (!titleEl || !gridEl) return;

    const year = calCursor.getFullYear();
    const month = calCursor.getMonth();
    titleEl.textContent = `${year}.${pad(month + 1)}`;

    // 검색 + 팀 필터 반영
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    let source = allMeetings;
    if (currentTeamFilter !== 'ALL') {
      source = source.filter(m => (m.team || 'ADMIN') === currentTeamFilter);
    }
    if (q) {
      source = source.filter(m =>
        (m.title || '').toLowerCase().includes(q) ||
        (m.attendees || '').toLowerCase().includes(q) ||
        (m.content || '').toLowerCase().includes(q) ||
        (m.author || '').toLowerCase().includes(q) ||
        (m.agenda || '').toLowerCase().includes(q) ||
        (m.decisions || '').toLowerCase().includes(q)
      );
    }

    // 날짜별 그룹핑
    const byDate = {};
    source.forEach(m => {
      if (!m.date) return;
      const key = String(m.date).slice(0, 10);
      if (!byDate[key]) byDate[key] = [];
      byDate[key].push(m);
    });
    Object.keys(byDate).forEach(k => byDate[k].sort((a, b) => (a.date || '').localeCompare(b.date || '')));

    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startDow = firstDay.getDay();
    const totalDays = lastDay.getDate();
    const today = new Date();
    const todayKey = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;

    const dows = ['일', '월', '화', '수', '목', '금', '토'];
    let html = dows.map((d, i) => {
      const cls = i === 0 ? ' sun' : (i === 6 ? ' sat' : '');
      return `<div class="calendar-dow${cls}">${d}</div>`;
    }).join('');

    for (let i = 0; i < startDow; i++) html += '<div class="calendar-day empty"></div>';

    for (let d = 1; d <= totalDays; d++) {
      const key = `${year}-${pad(month + 1)}-${pad(d)}`;
      const dayMeetings = byDate[key] || [];
      const dow = (startDow + d - 1) % 7;
      const numCls = dow === 0 ? ' sun' : (dow === 6 ? ' sat' : '');
      const isToday = key === todayKey;

      const maxDots = 5;
      const dotsHtml = dayMeetings.slice(0, maxDots).map(m => {
        const t = m.team || 'ADMIN';
        return `<span class="calendar-dot ${t}" title="${escapeAttr((TEAM_LABEL[t]||t) + ' · ' + m.title)}"></span>`;
      }).join('');
      const moreHtml = dayMeetings.length > maxDots ? `<div class="calendar-more">+${dayMeetings.length - maxDots}</div>` : '';

      html += `<div class="calendar-day${isToday ? ' today' : ''}" onclick="onDayClick('${key}')">
        <div class="calendar-day-num${numCls}">${d}</div>
        <div class="calendar-day-dots">${dotsHtml}</div>
        ${moreHtml}
      </div>`;
    }

    gridEl.innerHTML = html;
  }

  function onDayClick(dateKey) {
    const dayMeetings = allMeetings.filter(m => {
      if (currentTeamFilter !== 'ALL' && (m.team || 'ADMIN') !== currentTeamFilter) return false;
      return String(m.date || '').slice(0, 10) === dateKey;
    });
    if (dayMeetings.length === 0) {
      openCreateModal();
      document.getElementById('meetingDate').value = dateKey + 'T09:00';
      return;
    }
    if (dayMeetings.length === 1) {
      openDetail(dayMeetings[0].id);
      return;
    }
    dayMeetings.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    document.getElementById('dayListTitle').textContent = formatDateOnly(dateKey) + ' 회의록 (' + dayMeetings.length + '건)';
    document.getElementById('dayListBody').innerHTML = dayMeetings.map(m => {
      const team = m.team || 'ADMIN';
      return `
      <div class="meeting-card" onclick="closeModal('dayListModal'); openDetail('${escapeAttr(m.id)}')">
        <div class="meeting-card-header">
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <span class="team-badge team-${team}">${escapeHtml(TEAM_LABEL[team] || team)}</span>
            <div class="meeting-title">${escapeHtml(m.title)}</div>
          </div>
          <div class="meeting-date">${(m.date || '').slice(11, 16)}</div>
        </div>
        <div class="meeting-meta">
          ${m.location ? `<span>📍 ${escapeHtml(m.location)}</span>` : ''}
          ${m.author ? `<span>✍ ${escapeHtml(m.author)}</span>` : ''}
        </div>
      </div>
    `;}).join('');
    document.getElementById('dayListModal').classList.add('active');
  }

  function pad(n) { return String(n).padStart(2, '0'); }
  function formatDateOnly(d) {
    const date = new Date(d);
    if (isNaN(date)) return d;
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) {
    return String(s == null ? '' : s).replace(/'/g, "\\'");
  }

  function formatDate(d) {
    if (!d) return '';
    const date = new Date(d);
    if (isNaN(date)) return d;
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const h = String(date.getHours()).padStart(2, '0');
    const mi = String(date.getMinutes()).padStart(2, '0');
    return `${y}-${m}-${day} ${h}:${mi}`;
  }


</script>
