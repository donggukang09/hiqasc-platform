     HIQASC 업무 가이드 — 기본 폼 (v1.0)
     ─────────────────────────────────────────────────────────────────
     [새 가이드 만드는 법]
     1) 이 파일을 복사 → guide-XXXX.html 로 저장
     2) 아래 <script id="guide-data"> 안의 GUIDE / STEPS 값만 수정
     3) 캡쳐는 각 스텝 shots 배열에 {src, caption} 으로 추가
        (src 는 "img/파일.png" 경로 또는 data:image/...;base64 둘 다 가능)
     디자인/렌더링 코드는 건드릴 필요 없음.
     ===================================================================== -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>머신 반송 건 처리 가이드 | HIQASC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f8f9fb;
    --ink:#1c2128; --ink-soft:#5a6472; --ink-faint:#8a93a2;
    --line:#e6e9ee; --line-strong:#d6dbe3;
    --accent:#4a90e2; --accent-deep:#2f6fc0; --accent-soft:#eaf2fc;
    --tip:#2f9e6f; --tip-soft:#e7f6ef;
    --warn:#d9822b; --warn-soft:#fcf2e6;
    --note:#6b7280; --note-soft:#eef0f3;
    --radius:16px;
    --shadow:0 1px 2px rgba(20,30,45,.04), 0 8px 24px rgba(20,30,45,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.65; -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(circle at 1px 1px, rgba(20,30,45,.025) 1px, transparent 0);
    background-size:22px 22px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  .layout{display:grid;grid-template-columns:240px 1fr;gap:48px;align-items:start;padding:40px 0 80px}
  @media (max-width:900px){.layout{grid-template-columns:1fr;gap:24px}}

  .topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;backdrop-filter:saturate(140%) blur(6px)}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800}
  .brand small{color:var(--ink-faint);font-weight:600;font-size:12px}
  .topbar .back{color:var(--ink-soft);text-decoration:none;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;transition:.15s}
  .topbar .back:hover{background:var(--surface-2);color:var(--ink)}

  .hero{padding:54px 0 30px}
  .crumb{font-size:12.5px;color:var(--ink-faint);font-weight:600;margin-bottom:18px}
  .crumb b{color:var(--accent-deep)}
  .badge{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent-deep);font-size:12px;font-weight:700;padding:6px 12px;border-radius:100px;margin-bottom:16px}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
  h1.title{font-size:clamp(28px,4.4vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.15;max-width:820px}
  .subtitle{margin-top:14px;font-size:16px;color:var(--ink-soft);max-width:720px}
  .meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:24px;font-size:13px;color:var(--ink-faint);font-weight:600}
  .meta span{display:inline-flex;align-items:center;gap:7px} .meta svg{opacity:.7}

  .flow{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 26px 28px;box-shadow:var(--shadow);margin-top:14px}
  .flow-h{display:flex;align-items:center;gap:9px;margin-bottom:20px}
  .flow-h h2{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .flow-h .pill{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-faint);background:var(--surface-2);border:1px solid var(--line);padding:4px 11px;border-radius:100px}
  .flow-track{display:flex;flex-wrap:wrap;align-items:stretch;gap:0}
  .flow-node{flex:1 1 0;min-width:120px;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;padding:6px 6px 4px;border-radius:12px;transition:.15s}
  .flow-node:hover{background:var(--surface-2)}
  .flow-node .dot{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-deep));box-shadow:0 4px 12px rgba(74,144,226,.28)}
  .flow-node span{font-size:12.5px;font-weight:700;color:var(--ink-soft);line-height:1.35;max-width:130px}
  .flow-arrow{align-self:flex-start;margin-top:21px;color:var(--line-strong);flex:0 0 auto;padding:0 2px}
  @media (max-width:560px){.flow-track{flex-direction:column;gap:4px}.flow-node{flex-direction:row;justify-content:flex-start;text-align:left;width:100%}.flow-node span{max-width:none}.flow-arrow{transform:rotate(90deg);margin:2px 0 2px 20px}}

  .toc{position:sticky;top:84px}
  .toc h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:14px;padding-left:14px}
  .toc ol{list-style:none;counter-reset:t}
  .toc a{counter-increment:t;display:flex;gap:11px;align-items:baseline;text-decoration:none;color:var(--ink-soft);font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:9px;border-left:2px solid transparent;transition:.15s}
  .toc a::before{content:counter(t,decimal-leading-zero);color:var(--ink-faint);font-weight:700;font-size:11px;font-variant-numeric:tabular-nums}
  .toc a:hover{color:var(--ink);background:var(--surface-2)}
  .toc a.active{color:var(--accent-deep);background:var(--accent-soft);border-left-color:var(--accent)}
  .toc a.active::before{color:var(--accent)}
  @media (max-width:900px){.toc{display:none}}

  .steps{position:relative}
  .steps::before{content:"";position:absolute;left:21px;top:14px;bottom:40px;width:2px;background:linear-gradient(var(--line-strong),var(--line) 80%, transparent)}
  .step{position:relative;padding-left:62px;margin-bottom:34px;scroll-margin-top:80px}
  .step-num{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:13px;background:var(--surface);border:2px solid var(--accent);color:var(--accent-deep);display:grid;place-items:center;font-weight:800;font-size:17px;z-index:1;box-shadow:0 2px 8px rgba(74,144,226,.18)}
  .step-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .step-head{padding:22px 26px 16px}
  .step-head .k{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.02em}
  .step-head h3{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
  .step-head p{margin-top:10px;color:var(--ink-soft);font-size:15px}

  .acts{list-style:none;counter-reset:a;padding:0 26px 6px;margin-top:-2px}
  .acts li{counter-increment:a;display:flex;gap:13px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink)}
  .acts li::before{content:counter(a);flex:0 0 auto;width:23px;height:23px;border-radius:7px;background:var(--accent-soft);color:var(--accent-deep);font-weight:800;font-size:12px;display:grid;place-items:center;transform:translateY(2px)}
  .acts code{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--accent-deep);font-weight:700}

  .shots{padding:8px 26px 6px;display:flex;flex-direction:column;gap:18px}
  .shot figcaption{font-size:12.5px;color:var(--ink-faint);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .shot figcaption::before{content:"";width:14px;height:2px;background:var(--accent);border-radius:2px}
  .shot .frame{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
  .shot img{display:block;width:100%;height:auto}
  .shot-ph{border:2px dashed var(--line-strong);border-radius:12px;background:var(--surface-2);min-height:170px;display:grid;place-items:center;text-align:center;color:var(--ink-faint)}
  .shot-ph .ico{width:46px;height:46px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 12px}
  .shot-ph b{display:block;font-size:13.5px;color:var(--ink-soft);font-weight:700}
  .shot-ph small{font-size:12px;display:block;margin-top:4px}

  .callouts{padding:16px 26px 24px;display:flex;flex-direction:column;gap:10px}
  .callout{display:flex;gap:12px;padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.6;border:1px solid var(--line)}
  .callout .ci{flex:0 0 auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
  .callout b{display:block;font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;margin-bottom:2px}
  .c-tip{background:var(--tip-soft);border-color:#cde9d8}.c-tip .ci{background:var(--tip)}.c-tip b{color:var(--tip)}
  .c-warn{background:var(--warn-soft);border-color:#f3dcbf}.c-warn .ci{background:var(--warn)}.c-warn b{color:var(--warn)}
  .c-note{background:var(--note-soft);border-color:var(--line)}.c-note .ci{background:var(--note)}.c-note b{color:var(--note)}
  .callout .ctext{color:var(--ink);flex:1}

  .foot{border-top:1px solid var(--line);padding:30px 0 60px;margin-top:20px;color:var(--ink-faint);font-size:13px}
  .foot .wrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
  .foot .help{display:flex;gap:8px;align-items:center;font-weight:600}
  .btn-top{text-decoration:none;color:var(--accent-deep);font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;transition:.15s}
  .btn-top:hover{background:var(--accent-soft);border-color:var(--accent)}

  .step,.flow{opacity:0;transform:translateY(14px);animation:rise .55s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  @media print{
    body{background:#fff;background-image:none}
    .topbar,.toc,.foot,.flow .pill,.btn-top{display:none!important}
    .layout{grid-template-columns:1fr;padding:0}
    .step,.flow,.step-card{box-shadow:none;break-inside:avoid;opacity:1!important;transform:none!important}
    .steps::before{display:none}
  }
  .acts a,.callout a,.step-head a{color:var(--accent-deep);font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .acts a:hover,.callout a:hover,.step-head a:hover{color:var(--accent)}
  .shot .frame{max-width:420px}
</style>
</head>

</section>

<div class="wrap">
  <div class="layout">

</div>

<footer class="foot">
  <div class="wrap">

      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12" y2="17"/></svg>

  </div>
</footer>

<!-- ===== Render (수정 불필요) ===== -->
<script>
(function(){
  const $=(s,el=document)=>el.querySelector(s);
  $("#g-cat").textContent=GUIDE.category;
  $("#g-badge").textContent=GUIDE.badge;
  $("#g-title").textContent=GUIDE.title;
  $("#g-sub").textContent=GUIDE.subtitle;
  document.title=GUIDE.title+" | HIQASC";

  const ic=p=>`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  $("#g-meta").innerHTML=
    `<span>${ic('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>')}수정일 ${GUIDE.updated}</span>`+
    `<span>${ic('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>')}작성 ${GUIDE.author}</span>`+
    `<span>${ic('<path d="M12 2v20M2 12h20"/>')}${GUIDE.version}</span>`+
    `<span>${ic('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')}총 ${STEPS.length}단계</span>`;

  $("#flow-count").textContent=`전체 ${STEPS.length}단계`;
  const arrow=`<svg class="flow-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
  $("#flow-track").innerHTML=STEPS.map((s,i)=>`<a class="flow-node" href="#step-${i+1}"><div class="dot">${i+1}</div><span>${s.short}</span></a>`).join(arrow);
  $("#toc").innerHTML=STEPS.map((s,i)=>`<li><a href="#step-${i+1}" data-i="${i+1}">${s.title}</a></li>`).join("");

  const cm={tip:{c:"c-tip",l:"팁",s:"+"},warn:{c:"c-warn",l:"주의",s:"!"},note:{c:"c-note",l:"참고",s:"i"}};
  const phIco='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a93a2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>';

  $("#steps").innerHTML=STEPS.map((s,i)=>{
    const n=i+1;
    const head=`<div class="step-head"><div class="k">STEP ${n} / ${STEPS.length}</div><h3>${s.title}</h3>${s.intro?`<p>${s.intro}</p>`:""}</div>`;
    const acts=(s.actions&&s.actions.length)?`<ol class="acts">${s.actions.map(a=>`<li><span>${a}</span></li>`).join("")}</ol>`:"";
    const shots=(s.shots&&s.shots.length)?`<div class="shots">${s.shots.map(sh=>{
      const body=sh.src
        ?`<div class="frame"><img src="${sh.src}" alt="${s.title} 화면"></div>`
        :`<div class="shot-ph"><div><div class="ico">${phIco}</div><b>캡쳐 추가 예정</b><small>shots[].src 에 이미지 경로 입력</small></div></div>`;
      return `<figure class="shot">${sh.caption?`<figcaption>${sh.caption}</figcaption>`:""}${body}</figure>`;
    }).join("")}</div>`:"";
    const notes=(s.notes&&s.notes.length)?`<div class="callouts">${s.notes.map(c=>{const m=cm[c.type]||cm.note;return `<div class="callout ${m.c}"><div class="ci">${m.s}</div><div class="ctext"><b>${m.l}</b>${c.text}</div></div>`;}).join("")}</div>`:"";
    return `<section class="step" id="step-${n}" style="animation-delay:${i*60}ms"><div class="step-num">${n}</div><div class="step-card">${head}${acts}${shots}${notes}</div></section>`;
  }).join("");

  const links=[...document.querySelectorAll('.toc a')];
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const id=e.target.id.split('-')[1];links.forEach(a=>a.classList.toggle('active',a.dataset.i===id));}}),{rootMargin:"-30% 0px -60% 0px"});
  document.querySelectorAll('.step').forEach(s=>io.observe(s));
})();
</script>
