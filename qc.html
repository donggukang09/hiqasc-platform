<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIQASC QC 품질검사</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#1a1a2e;--card:#16213e;--card2:#1a2540;
  --accent:#4a90e2;--accent2:#64b5f6;
  --pass:#00c853;--fail:#ff5252;--warn:#ffab40;
  --text:#e8eaf6;--text2:#90a4ae;
  --border:rgba(74,144,226,0.2);
}

body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ===== HEADER ===== */
.header{
  background:linear-gradient(135deg,var(--card) 0%,#0f3460 100%);
  padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;
}
.header h1{font-size:18px;font-weight:700;letter-spacing:-0.5px;}
.header h1 span{color:var(--accent2);}
.header-right{display:flex;align-items:center;gap:10px;}
.tech-badge{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;background:rgba(74,144,226,0.12);
  border:1px solid var(--border);border-radius:20px;
  font-size:13px;font-weight:600;color:var(--accent2);
}
.btn-sm{
  padding:6px 14px;background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);border-radius:8px;
  color:var(--text2);font-family:inherit;font-size:12px;cursor:pointer;
  transition:all 0.2s;
}
.btn-sm:hover{background:rgba(255,255,255,0.12);}
.back-btn{
  padding:6px 14px;background:rgba(74,144,226,0.15);
  border:1px solid var(--border);border-radius:8px;
  color:var(--accent2);font-family:inherit;font-size:12px;cursor:pointer;
}

/* ===== PAGES ===== */
.page{display:none;}
.page.active{display:block;}

/* ===== LOGIN PAGE ===== */
.login-wrap{
  display:flex;align-items:center;justify-content:center;
  min-height:calc(100vh - 52px);padding:20px;
}
.login-card{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:40px 32px;width:100%;max-width:400px;text-align:center;
}
.login-card h2{font-size:22px;margin-bottom:6px;}
.login-card p{color:var(--text2);font-size:14px;margin-bottom:28px;}
.login-card .icon{font-size:48px;margin-bottom:16px;}
.tech-grid{display:grid;gap:10px;}
.tech-btn{
  padding:14px;background:var(--card2);border:2px solid var(--border);
  border-radius:12px;color:var(--text);font-family:inherit;font-size:16px;
  font-weight:600;cursor:pointer;transition:all 0.2s;
}
.tech-btn:hover{border-color:var(--accent);background:rgba(74,144,226,0.08);}

/* ===== MAIN PAGE (Serial Input) ===== */
.main-container{max-width:800px;margin:0 auto;padding:24px 16px;}

.serial-section{margin-bottom:20px;}
.serial-section .card-title{
  font-size:13px;font-weight:600;color:var(--accent2);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;
}

.serial-slots{display:grid;gap:12px;}
.serial-slot{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;display:flex;align-items:center;gap:12px;
}
.slot-num{
  width:28px;height:28px;min-width:28px;
  background:var(--accent);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;
}
.slot-input{
  flex:1;padding:10px 14px;background:var(--card2);
  border:1px solid rgba(255,255,255,0.06);border-radius:8px;
  color:var(--text);font-family:'Manrope',monospace;font-size:15px;
  font-weight:600;letter-spacing:1px;outline:none;
  transition:border-color 0.2s;
}
.slot-input:focus{border-color:var(--accent);}
.slot-input::placeholder{color:var(--text2);font-size:13px;letter-spacing:0;font-weight:400;}
.slot-model{
  font-size:12px;color:var(--accent2);font-weight:600;min-width:100px;text-align:right;
}
.slot-model.error{color:var(--fail);}
.slot-clear{
  background:none;border:none;color:var(--text2);font-size:16px;
  cursor:pointer;padding:4px;display:none;
}

.btn-primary{
  width:100%;padding:16px;
  background:linear-gradient(135deg,var(--accent) 0%,#357abd 100%);
  border:none;border-radius:12px;color:#fff;font-family:inherit;
  font-size:16px;font-weight:700;cursor:pointer;transition:all 0.2s;
  margin-top:16px;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(74,144,226,0.35);}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}

/* ===== QC PAGE (4-box) ===== */
.qc-container{max-width:1400px;margin:0 auto;padding:16px 12px;padding-bottom:100px;}
.qc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

@media(max-width:900px){
  .qc-grid{grid-template-columns:1fr;}
}

.qc-box{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;display:flex;flex-direction:column;
}
.qc-box-header{
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.qc-box-num{
  width:26px;height:26px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;
}
.qc-box-num.c1{background:#4a90e2;}.qc-box-num.c2{background:#7c4dff;}
.qc-box-num.c3{background:#ff6d00;}.qc-box-num.c4{background:#00bfa5;}

.qc-box-info{display:flex;align-items:center;gap:8px;}
.qc-box-model{font-size:14px;font-weight:700;}
.qc-box-serial{font-size:11px;color:var(--text2);font-weight:500;}
.qc-box-color{font-size:11px;color:var(--text2);}

.qc-box-round{
  padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;
}
.round-1{background:rgba(74,144,226,0.15);color:var(--accent2);}
.round-2{background:rgba(255,171,64,0.15);color:var(--warn);}
.round-3{background:rgba(255,82,82,0.15);color:var(--fail);}

.qc-box-body{padding:12px 14px;flex:1;overflow-y:auto;max-height:360px;}

/* Checklist in box */
.mini-checklist{list-style:none;}
.mini-chk{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:8px;margin-bottom:4px;
  cursor:pointer;user-select:none;transition:all 0.15s;
  border:1px solid transparent;
}
.mini-chk:hover{background:rgba(255,255,255,0.03);}
.mini-chk.checked{background:rgba(0,200,83,0.06);border-color:rgba(0,200,83,0.2);}
.mini-chk-box{
  width:20px;height:20px;min-width:20px;border:2px solid var(--text2);
  border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:12px;transition:all 0.15s;
}
.mini-chk.checked .mini-chk-box{background:var(--pass);border-color:var(--pass);color:#fff;}
.mini-chk-label{font-size:13px;font-weight:500;}
.mini-progress{font-size:11px;color:var(--text2);text-align:right;margin-bottom:6px;}

/* Note in box */
.mini-note{
  width:100%;padding:8px 10px;background:var(--card2);
  border:1px solid rgba(255,255,255,0.06);border-radius:8px;
  color:var(--text);font-family:inherit;font-size:12px;
  outline:none;resize:none;min-height:40px;margin-top:6px;
}
.mini-note::placeholder{color:var(--text2);}
.mini-note:focus{border-color:var(--accent);}

/* PASS/FAIL in box */
.qc-box-footer{
  padding:10px 14px;border-top:1px solid var(--border);
  display:flex;gap:8px;
}
.pf-btn{
  flex:1;padding:14px 8px;border:2px solid;border-radius:10px;
  font-family:inherit;font-size:18px;font-weight:800;letter-spacing:1px;
  cursor:pointer;transition:all 0.2s;
}
.pf-pass{
  background:rgba(0,200,83,0.06);border-color:rgba(0,200,83,0.3);color:var(--pass);
}
.pf-pass:hover{background:rgba(0,200,83,0.15);}
.pf-pass.selected{background:rgba(0,200,83,0.2);border-color:var(--pass);box-shadow:0 0 16px rgba(0,200,83,0.2);}

.pf-fail{
  background:rgba(255,82,82,0.06);border-color:rgba(255,82,82,0.3);color:var(--fail);
}
.pf-fail:hover{background:rgba(255,82,82,0.15);}
.pf-fail.selected{background:rgba(255,82,82,0.2);border-color:var(--fail);box-shadow:0 0 16px rgba(255,82,82,0.2);}

/* Submit All */
.submit-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,var(--bg) 30%);
  padding:20px 12px 24px;z-index:50;
}
.submit-bar-inner{max-width:1400px;margin:0 auto;}
.btn-submit-all{
  width:100%;padding:18px;
  background:linear-gradient(135deg,#00c853 0%,#009624 100%);
  border:none;border-radius:14px;color:#fff;font-family:inherit;
  font-size:18px;font-weight:800;letter-spacing:1px;cursor:pointer;
  transition:all 0.2s;
}
.btn-submit-all:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,200,83,0.35);}
.btn-submit-all:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
.submit-status{
  text-align:center;font-size:13px;color:var(--text2);margin-top:8px;
}

/* ===== Loading & Toast ===== */
.loading-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);
  z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:16px;
}
.loading-overlay.show{display:flex;}
.spinner{
  width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);
  border-top-color:var(--accent2);border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text2);font-size:14px;}

.toast{
  position:fixed;bottom:100px;left:50%;
  transform:translateX(-50%) translateY(100px);
  padding:14px 28px;border-radius:12px;font-size:14px;font-weight:600;
  z-index:1000;transition:transform 0.35s ease;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.success{background:var(--pass);color:#fff;}
.toast.error{background:var(--fail);color:#fff;}

.footer{text-align:center;padding:24px;font-size:11px;color:var(--text2);opacity:0.5;}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.fade-up{animation:fadeUp 0.3s ease;}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">로딩 중...</div>
</div>
<div class="toast" id="toast"></div>

<!-- ==================== PAGE: LOGIN ==================== -->
<div class="page active" id="pageLogin">
  <div class="header">
    <h1>⚙️ <span>QC</span> 품질검사</h1>
    <button class="back-btn" onclick="goHome()">🏠 메인으로</button>
  </div>
  <div class="login-wrap">
    <div class="login-card fade-up">
      <div class="icon">👤</div>
      <h2>담당자 선택</h2>
      <p>QC 검사를 시작하려면 담당자를 선택하세요</p>
      <div class="tech-grid" id="techGrid"></div>
    </div>
  </div>
</div>

<!-- ==================== PAGE: MAIN (Serial Input) ==================== -->
<div class="page" id="pageMain">
  <div class="header">
    <h1>⚙️ <span>QC</span> 품질검사</h1>
    <div class="header-right">
      <div class="tech-badge">👤 <span id="techNameMain"></span></div>
      <button class="btn-sm" onclick="changeTech()">담당자 변경</button>
      <button class="back-btn" onclick="goHome()">🏠</button>
    </div>
  </div>
  <div class="main-container fade-up">
    <div class="serial-section">
      <div class="card-title">📋 시리얼 번호 입력 (4대)</div>
      <div class="serial-slots" id="serialSlots"></div>
    </div>
    <button class="btn-primary" id="btnStartQC" disabled onclick="startQC()">QC 검사 시작 →</button>
  </div>
</div>

<!-- ==================== PAGE: QC (4-box) ==================== -->
<div class="page" id="pageQC">
  <div class="header">
    <h1>⚙️ <span>QC</span> 검사 진행</h1>
    <div class="header-right">
      <div class="tech-badge">👤 <span id="techNameQC"></span></div>
      <button class="btn-sm" onclick="backToMain()">← 시리얼 입력</button>
    </div>
  </div>
  <div class="qc-container">
    <div class="qc-grid" id="qcGrid"></div>
  </div>
  <div class="submit-bar">
    <div class="submit-bar-inner">
      <button class="btn-submit-all" id="btnSubmitAll" disabled onclick="submitAll()">📦 전체 저장</button>
      <div class="submit-status" id="submitStatus"></div>
    </div>
  </div>
</div>

<div class="footer">DONGGU KANG — HIQASC QC System</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzLVq20w-QyrFqMKpWqsqq3evnTGVAoJR2HwsXVhq6-9MZfOZ-3tEpy-eZnSpYDJlu4/exec';
const SLOT_COUNT = 4;
const BOX_COLORS = ['c1','c2','c3','c4'];

let models = [];
let colors = [];
let technicians = [];
let currentTech = '';

let slots = [];
let qcStates = [];

// ========== INIT ==========
async function init() {
  showLoading('데이터 로딩 중...');
  await Promise.all([loadModels(), loadColors(), loadTechnicians()]);
  hideLoading();
  renderSerialSlots();
}

// ========== UTILITY ==========
function showLoading(msg) {
  document.getElementById('loadingText').textContent = msg || '처리 중...';
  document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => t.classList.remove('show'), 2500);
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0 });
}

// ========== JSONP / POST ==========
function jsonp(params) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    const timeout = setTimeout(() => { cleanup(); reject(new Error('Timeout')); }, 15000);
    function cleanup() { clearTimeout(timeout); delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); }
    window[cbName] = function(data) { cleanup(); resolve(data); };
    const qs = new URLSearchParams({ ...params, callback: cbName }).toString();
    const script = document.createElement('script');
    script.src = APPS_SCRIPT_URL + '?' + qs;
    script.onerror = () => { cleanup(); reject(new Error('Network error')); };
    document.body.appendChild(script);
  });
}

function postData(payload) {
  return fetch(APPS_SCRIPT_URL, {
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
}

// ========== DATA LOADERS ==========
async function loadModels() {
  try { const r = await jsonp({action:'getModels'}); if(r.success) models = r.data; }
  catch(e) { console.error('모델 로딩 실패:', e); }
}
async function loadColors() {
  try { const r = await jsonp({action:'getColors'}); if(r.success) colors = r.data; }
  catch(e) { console.error('색상 로딩 실패:', e); }
}
async function loadTechnicians() {
  try {
    const r = await jsonp({action:'getTechnicians'});
    if(r.success) {
      technicians = r.data;
      const grid = document.getElementById('techGrid');
      if(technicians.length === 0) {
        grid.innerHTML = '<p style="color:var(--text2);font-size:14px;">테크니션 탭에 담당자를 추가하세요.</p>';
        return;
      }
      grid.innerHTML = technicians.map(t =>
        `<button class="tech-btn" onclick="selectTech('${t}')">${t}</button>`
      ).join('');
    }
  } catch(e) { console.error('테크니션 로딩 실패:', e); }
}

// ========== TECHNICIAN ==========
function selectTech(name) {
  currentTech = name;
  document.getElementById('techNameMain').textContent = name;
  document.getElementById('techNameQC').textContent = name;
  showPage('pageMain');
  setTimeout(() => document.getElementById('slotInput0')?.focus(), 100);
}

function changeTech() { showPage('pageLogin'); }

// ========== SERIAL PARSING ==========
function parseSerial(serial) {
  serial = serial.trim();
  if(serial.length < 12) return null;

  const yy = serial.substring(0,2);
  const ddd = serial.substring(2,5);
  const year = 2000 + parseInt(yy);
  const dayOfYear = parseInt(ddd);
  const date = new Date(year, 0);
  date.setDate(dayOfYear);
  const dateStr = `${year}년 ${date.getMonth()+1}월 ${date.getDate()}일`;

  const modelCode = serial.substring(5,8);
  const colorCode = serial.substring(serial.length - 4, serial.length - 2);

  const modelMatch = models.find(m => m.code.trim().toUpperCase() === modelCode.toUpperCase());
  const colorMatch = colors.find(c =>
    c.modelCode.trim().toUpperCase() === modelCode.toUpperCase() &&
    c.colorCode.trim().toUpperCase() === colorCode.toUpperCase()
  );

  return {
    modelCode,
    modelName: modelMatch ? modelMatch.name.trim() : null,
    colorCode,
    colorName: colorMatch ? colorMatch.colorName.trim() : '알 수 없음',
    fullColorName: colorMatch ? colorMatch.fullName.trim() : '',
    dateStr
  };
}

// ========== SERIAL SLOTS ==========
function renderSerialSlots() {
  const wrap = document.getElementById('serialSlots');
  wrap.innerHTML = '';
  for(let i = 0; i < SLOT_COUNT; i++) {
    wrap.innerHTML += `
      <div class="serial-slot" id="slot${i}">
        <div class="slot-num">${i+1}</div>
        <input type="text" class="slot-input" id="slotInput${i}"
          placeholder="시리얼 번호 입력" autocomplete="off"
          oninput="onSlotInput(${i})"
          onkeydown="onSlotKeydown(event,${i})">
        <div class="slot-model" id="slotModel${i}"></div>
        <button class="slot-clear" id="slotClear${i}" onclick="clearSlot(${i})">✕</button>
      </div>
    `;
  }
}

function onSlotInput(idx) {
  const input = document.getElementById('slotInput' + idx);
  const val = input.value.trim();
  const modelEl = document.getElementById('slotModel' + idx);
  const clearEl = document.getElementById('slotClear' + idx);

  clearEl.style.display = val ? 'block' : 'none';

  if(val.length >= 12) {
    const info = parseSerial(val);
    if(info && info.modelName) {
      modelEl.textContent = info.modelName + ' · ' + info.colorName;
      modelEl.classList.remove('error');
    } else if(info) {
      modelEl.textContent = '미등록 모델';
      modelEl.classList.add('error');
    } else {
      modelEl.textContent = '';
    }
  } else {
    modelEl.textContent = '';
  }
  checkStartReady();
}

function onSlotKeydown(e, idx) {
  if(e.key === 'Enter' && idx < SLOT_COUNT - 1) {
    document.getElementById('slotInput' + (idx + 1)).focus();
  }
}

function clearSlot(idx) {
  document.getElementById('slotInput' + idx).value = '';
  document.getElementById('slotModel' + idx).textContent = '';
  document.getElementById('slotClear' + idx).style.display = 'none';
  checkStartReady();
  document.getElementById('slotInput' + idx).focus();
}

function checkStartReady() {
  let validCount = 0;
  for(let i = 0; i < SLOT_COUNT; i++) {
    const val = document.getElementById('slotInput' + i).value.trim();
    if(val.length >= 12) {
      const info = parseSerial(val);
      if(info && info.modelName) validCount++;
    }
  }
  document.getElementById('btnStartQC').disabled = (validCount === 0);
  document.getElementById('btnStartQC').textContent =
    validCount > 0 ? `QC 검사 시작 (${validCount}대) →` : 'QC 검사 시작 →';
}

// ========== START QC ==========
async function startQC() {
  showLoading('QC 데이터 준비 중...');

  slots = [];
  qcStates = [];

  for(let i = 0; i < SLOT_COUNT; i++) {
    const val = document.getElementById('slotInput' + i).value.trim();
    if(val.length < 12) continue;
    const info = parseSerial(val);
    if(!info || !info.modelName) continue;

    let hist = [];
    let round = 1;
    try {
      const r = await jsonp({action:'getHistory', serial: val});
      if(r.success) {
        hist = r.data;
        if(hist.length > 0) {
          const lastResult = hist[hist.length-1].result;
          if(hist.length >= 3 && lastResult !== 'PASS') {
            continue; // 3회 초과 FAIL - 스킵
          }
          round = hist.length + 1;
        }
      }
    } catch(e) {}

    slots.push({
      serial: val,
      modelCode: info.modelCode,
      modelName: info.modelName,
      colorCode: info.colorCode,
      colorName: info.colorName,
      fullColorName: info.fullColorName,
      manufDate: info.dateStr,
      round: round,
      history: hist
    });
  }

  if(slots.length === 0) {
    hideLoading();
    showToast('검사 가능한 머신이 없습니다.', 'error');
    return;
  }

  // 체크리스트 로드
  const modelNames = [...new Set(slots.map(s => s.modelName))];
  const checklistMap = {};
  for(const mn of modelNames) {
    try {
      const r = await jsonp({action:'getChecklist', model: mn});
      if(r.success) checklistMap[mn] = r.data.sort((a,b) => a.order - b.order);
      else checklistMap[mn] = [];
    } catch(e) { checklistMap[mn] = []; }
  }

  qcStates = slots.map(s => ({
    checklist: (checklistMap[s.modelName] || []).map(item => ({ item: item.item, checked: false })),
    result: null,
    note: ''
  }));

  hideLoading();
  renderQCBoxes();
  showPage('pageQC');
}

// ========== RENDER QC BOXES ==========
function renderQCBoxes() {
  const grid = document.getElementById('qcGrid');
  grid.innerHTML = slots.map((s, idx) => {
    const roundClass = s.round >= 3 ? 'round-3' : s.round === 2 ? 'round-2' : 'round-1';
    const roundLabel = s.round >= 3 ? `${s.round}차 (최종)` : `${s.round}차`;
    const cl = qcStates[idx].checklist;

    return `
      <div class="qc-box fade-up" style="animation-delay:${idx*0.08}s" id="qcBox${idx}">
        <div class="qc-box-header">
          <div class="qc-box-info">
            <div class="qc-box-num ${BOX_COLORS[idx]}">${idx+1}</div>
            <div>
              <div class="qc-box-model">${s.modelName}</div>
              <div class="qc-box-serial">${s.serial}</div>
              <div class="qc-box-color">${s.colorName}${s.fullColorName ? ' · ' + s.fullColorName : ''}</div>
            </div>
          </div>
          <span class="qc-box-round ${roundClass}">${roundLabel}</span>
        </div>

        <div class="qc-box-body">
          <div class="mini-progress" id="prog${idx}">0 / ${cl.length}</div>
          <ul class="mini-checklist" id="cl${idx}">
            ${cl.length > 0 ? cl.map((c, ci) => `
              <li class="mini-chk" onclick="toggleQCCheck(${idx},${ci})" id="mc${idx}_${ci}">
                <div class="mini-chk-box"></div>
                <span class="mini-chk-label">${c.item}</span>
              </li>
            `).join('') : '<li style="padding:10px;text-align:center;color:var(--text2);font-size:12px;">체크리스트 없음</li>'}
          </ul>
          <textarea class="mini-note" placeholder="비고 (선택)" oninput="qcStates[${idx}].note=this.value"></textarea>
        </div>

        <div class="qc-box-footer">
          <button class="pf-btn pf-pass" onclick="setResult(${idx},'PASS')" id="passBtn${idx}">PASS</button>
          <button class="pf-btn pf-fail" onclick="setResult(${idx},'FAIL')" id="failBtn${idx}">FAIL</button>
        </div>
      </div>
    `;
  }).join('');

  updateSubmitStatus();
}

function toggleQCCheck(boxIdx, itemIdx) {
  const st = qcStates[boxIdx];
  st.checklist[itemIdx].checked = !st.checklist[itemIdx].checked;
  const el = document.getElementById(`mc${boxIdx}_${itemIdx}`);
  const box = el.querySelector('.mini-chk-box');
  if(st.checklist[itemIdx].checked) {
    el.classList.add('checked');
    box.textContent = '✓';
  } else {
    el.classList.remove('checked');
    box.textContent = '';
  }
  const checkedCount = st.checklist.filter(c => c.checked).length;
  document.getElementById(`prog${boxIdx}`).textContent = `${checkedCount} / ${st.checklist.length}`;
}

function setResult(boxIdx, result) {
  qcStates[boxIdx].result = result;
  document.getElementById('passBtn' + boxIdx).classList.toggle('selected', result === 'PASS');
  document.getElementById('failBtn' + boxIdx).classList.toggle('selected', result === 'FAIL');
  updateSubmitStatus();
}

function updateSubmitStatus() {
  const decided = qcStates.filter(s => s.result !== null).length;
  const total = qcStates.length;
  const statusEl = document.getElementById('submitStatus');
  const btnEl = document.getElementById('btnSubmitAll');

  if(decided === total) {
    statusEl.textContent = `✅ ${total}대 모두 판정 완료`;
    btnEl.disabled = false;
  } else {
    statusEl.textContent = `${decided} / ${total} 판정 완료 — 모두 선택해주세요`;
    btnEl.disabled = true;
  }
}

// ========== SUBMIT ALL ==========
async function submitAll() {
  showLoading('저장 중...');
  try {
    for(let i = 0; i < slots.length; i++) {
      const s = slots[i];
      const st = qcStates[i];
      await postData({
        action: 'saveQC',
        serial: s.serial,
        modelCode: s.modelCode,
        modelName: s.modelName,
        colorCode: s.colorCode,
        colorName: s.colorName,
        round: s.round,
        checklist: st.checklist,
        result: st.result,
        note: st.note,
        technician: currentTech
      });
    }
    hideLoading();
    const passCount = qcStates.filter(s => s.result === 'PASS').length;
    const failCount = qcStates.filter(s => s.result === 'FAIL').length;
    showToast(`저장 완료! PASS ${passCount} / FAIL ${failCount}`);

    setTimeout(() => {
      resetSerialInputs();
      showPage('pageMain');
      setTimeout(() => document.getElementById('slotInput0')?.focus(), 100);
    }, 1200);
  } catch(e) {
    hideLoading();
    showToast('저장 실패: ' + e.message, 'error');
  }
}

function resetSerialInputs() {
  for(let i = 0; i < SLOT_COUNT; i++) {
    document.getElementById('slotInput' + i).value = '';
    document.getElementById('slotModel' + i).textContent = '';
    document.getElementById('slotClear' + i).style.display = 'none';
  }
  document.getElementById('btnStartQC').disabled = true;
  document.getElementById('btnStartQC').textContent = 'QC 검사 시작 →';
  slots = [];
  qcStates = [];
}

function backToMain() {
  if(qcStates.some(s => s.result !== null)) {
    if(!confirm('진행 중인 검사 데이터가 사라집니다. 돌아가시겠습니까?')) return;
  }
  showPage('pageMain');
}

function goHome() {
  if(window.opener || document.referrer) window.history.back();
  else window.location.href = 'index.html';
}

init();
</script>
