<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIQASC 위키 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: #2a2a2a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 헤더 */
        .header {
            background: #1e1e1e;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #5dade2 0%, #3498db 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(93, 173, 226, 0.4);
        }

        .header h1 {
            font-size: 2em;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .header p {
            color: #808080;
            font-size: 1em;
        }

        /* 검색창 */
        .search-box {
            background: #1e1e1e;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .search-input-wrapper {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 18px 60px 18px 50px;
            background: #2a2a2a;
            border: 2px solid #3a3a3a;
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #808080;
        }

        .clear-btn {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: none;
        }

        .clear-btn:hover {
            background: #c0392b;
        }

        .clear-btn.visible {
            display: block;
        }

        /* 결과 영역 */
        .results-header {
            background: #1e1e1e;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 20px 30px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-count {
            font-size: 1.1em;
            color: #4a90e2;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #808080;
            display: none;
        }

        .loading.visible {
            display: block;
        }

        .spinner {
            border: 3px solid #3a3a3a;
            border-top: 3px solid #4a90e2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #808080;
            display: none;
        }

        .no-results.visible {
            display: block;
        }

        .no-results-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .error-box {
            background: #e74c3c;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        /* 위키 항목 카드 */
        .wiki-item {
            background: #1e1e1e;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .wiki-item:hover {
            border-color: #4a90e2;
            box-shadow: 0 4px 16px rgba(74, 144, 226, 0.2);
            transform: translateY(-2px);
        }

        .wiki-field {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .wiki-field:last-child {
            margin-bottom: 0;
        }

        .wiki-label {
            min-width: 100px;
            font-weight: 600;
            color: #4a90e2;
            margin-right: 15px;
            font-size: 14px;
        }

        .wiki-value {
            flex: 1;
            color: #e0e0e0;
            line-height: 1.6;
            word-break: break-word;
        }

        .wiki-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .wiki-tag {
            background: rgba(74, 144, 226, 0.2);
            border: 1px solid rgba(74, 144, 226, 0.4);
            color: #4a90e2;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 30px;
            color: #606060;
            font-size: 0.85em;
            margin-top: 50px;
        }

        .developer-tag {
            margin-top: 8px;
            font-weight: 600;
            color: #4a90e2;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .wiki-field {
                flex-direction: column;
            }

            .wiki-label {
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <div class="header">
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <a href="https://donggukang09.github.io/hiqasc-platform/" class="back-button">← 메인으로</a>
                <a href="wiki-input.html" class="back-button" style="background: linear-gradient(135deg, #27ae60 0%, #229954 100%);">➕ 데이터 입력</a>
            </div>
            <h1>📚 HIQASC 위키 시스템</h1>
            <p>수리 매뉴얼 및 증상별 해결방법 검색</p>
        </div>

        <!-- 에러 메시지 -->
        <div id="errorBox" style="display: none;"></div>

        <!-- 검색창 -->
        <div class="search-box">
            <div class="search-input-wrapper">
                <span class="search-icon">🔍</span>
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput"
                    placeholder="모델명, 증상, 부품명 등을 검색하세요... (예: 추출안됨, 버츄오 플러스)"
                >
                <button class="clear-btn" id="clearBtn" onclick="clearSearch()">지우기</button>
            </div>
        </div>

        <!-- 로딩 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>데이터 로딩 중...</p>
        </div>

        <!-- 결과 없음 -->
        <div class="no-results" id="noResults">
            <div class="no-results-icon">🔍</div>
            <h2 style="color: #808080; margin-bottom: 10px;">검색 결과가 없습니다</h2>
            <p>다른 키워드로 검색해보세요</p>
        </div>

        <!-- 결과 헤더 -->
        <div class="results-header" id="resultsHeader" style="display: none;">
            <div class="results-count" id="resultsCount">검색 결과: 0건</div>
        </div>

        <!-- 결과 목록 -->
        <div id="resultsList"></div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2025 HIQASC Wiki System. All rights reserved.</p>
            <p class="developer-tag">DEVELOPED BY DONGGU KANG</p>
        </div>
    </div>

    <script>
        // Google Sheets 설정
        const WIKI_SHEET_ID = '1yEwC43ULV1baQ7rYJ2He1wgkEEl00FNMgo7gBkD9auM';
        const SHEET_NAME = '위키데이터';
        
        let allData = [];
        let searchTimeout;

        // 페이지 로드 시 데이터 가져오기
        window.addEventListener('load', () => {
            fetchWikiData();
        });

        // 검색 입력 이벤트
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.trim();
            
            if (query) {
                document.getElementById('clearBtn').classList.add('visible');
            } else {
                document.getElementById('clearBtn').classList.remove('visible');
            }

            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                if (query) {
                    searchWiki(query);
                } else {
                    displayAllData();
                }
            }, 300);
        });

        // Enter 키로 검색
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = e.target.value.trim();
                if (query) {
                    searchWiki(query);
                }
            }
        });

        // 검색 지우기
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearBtn').classList.remove('visible');
            displayAllData();
        }

        // 에러 표시
        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.className = 'error-box';
            errorBox.innerHTML = `<strong>⚠️ 오류 발생</strong><br>${message}`;
            errorBox.style.display = 'block';
        }

        // 안전한 값 가져오기
        function safeGetValue(obj, defaultValue = '') {
            try {
                return obj && obj.v !== null && obj.v !== undefined ? String(obj.v) : defaultValue;
            } catch (e) {
                return defaultValue;
            }
        }

        // Google Sheets에서 데이터 가져오기
        async function fetchWikiData() {
            const loading = document.getElementById('loading');
            loading.classList.add('visible');

            try {
                // headers=1 파라미터 추가 - 첫 번째 행을 명시적으로 헤더로 지정
                const timestamp = new Date().getTime();
                const url = `https://docs.google.com/spreadsheets/d/${WIKI_SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(SHEET_NAME)}&t=${timestamp}`;
                
                console.log('데이터 요청 URL:', url);
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP 오류: ${response.status}`);
                }
                
                const text = await response.text();
                console.log('응답 받음, 길이:', text.length);
                
                // JSON 파싱
                const jsonText = text.substring(47).slice(0, -2);
                const json = JSON.parse(jsonText);
                
                console.log('JSON 파싱 성공');
                console.log('전체 행 수:', json.table.rows ? json.table.rows.length : 0);

                if (!json.table || !json.table.rows || json.table.rows.length === 0) {
                    throw new Error('시트에 데이터가 없습니다.');
                }

                // 컬럼 정보 확인 (디버깅용)
                if (json.table.cols) {
                    console.log('컬럼 라벨:', json.table.cols.map(col => col.label || col.id));
                }
                
                const firstRow = json.table.rows[0];
                console.log('첫 번째 행:', firstRow);

                // 하드코딩된 헤더 사용 (gviz API가 이미 헤더를 처리함)
                // 예상 컬럼 순서: 모델, 증상, 해결방법, 사용부품, 비고, 태그
                const HEADERS = ['모델', '증상', '해결방법', '사용부품', '비고', '태그'];
                
                allData = [];
                // i = 0부터 시작 (첫 번째 행이 실제 데이터)
                for (let i = 0; i < json.table.rows.length; i++) {
                    const row = json.table.rows[i];
                    
                    // 각 행의 원시 데이터 출력
                    console.log(`\n=== 행 ${i} 원시 데이터 ===`);
                    console.log('row.c:', row.c);
                    if (row.c) {
                        row.c.forEach((cell, idx) => {
                            console.log(`  [${idx}] ${HEADERS[idx]}:`, cell);
                        });
                    }
                    
                    // 빈 행 건너뛰기
                    if (!row.c || row.c.every(cell => !cell || !cell.v)) {
                        console.log(`행 ${i}: 빈 행 건너뛰기`);
                        continue;
                    }
                    
                    const rowData = {
                        model: safeGetValue(row.c[0]),
                        symptom: safeGetValue(row.c[1]),
                        solution: safeGetValue(row.c[2]),
                        parts: safeGetValue(row.c[3]),
                        note: safeGetValue(row.c[4]),
                        tags: safeGetValue(row.c[5])
                    };
                    
                    console.log(`행 ${i} 데이터:`, rowData);
                    allData.push(rowData);
                }

                console.log('처리된 데이터:', allData);
                console.log('로드된 데이터 개수:', allData.length);

                loading.classList.remove('visible');
                displayAllData();

            } catch (error) {
                console.error('데이터 로드 오류:', error);
                loading.classList.remove('visible');
                showError(`데이터를 불러올 수 없습니다: ${error.message}<br><br>F12를 눌러 콘솔을 확인해주세요.`);
            }
        }

        // 전체 데이터 표시
        function displayAllData() {
            console.log('전체 데이터 표시:', allData.length + '건');
            displayResults(allData);
        }

        // 검색 실행
        function searchWiki(query) {
            console.log('검색어:', query);
            const queryLower = query.toLowerCase();
            
            const filtered = allData.filter(item => {
                try {
                    return (
                        (item.model && item.model.toLowerCase().includes(queryLower)) ||
                        (item.symptom && item.symptom.toLowerCase().includes(queryLower)) ||
                        (item.solution && item.solution.toLowerCase().includes(queryLower)) ||
                        (item.parts && item.parts.toLowerCase().includes(queryLower)) ||
                        (item.note && item.note.toLowerCase().includes(queryLower)) ||
                        (item.tags && item.tags.toLowerCase().includes(queryLower))
                    );
                } catch (e) {
                    console.error('검색 중 오류:', e, item);
                    return false;
                }
            });

            console.log('검색 결과:', filtered.length + '건');
            displayResults(filtered);
        }

        // 결과 표시
        function displayResults(data) {
            console.log('결과 표시:', data.length + '건');
            
            const resultsList = document.getElementById('resultsList');
            const resultsHeader = document.getElementById('resultsHeader');
            const resultsCount = document.getElementById('resultsCount');
            const noResults = document.getElementById('noResults');

            resultsList.innerHTML = '';

            if (data.length === 0) {
                resultsHeader.style.display = 'none';
                noResults.classList.add('visible');
                return;
            }

            noResults.classList.remove('visible');
            resultsHeader.style.display = 'flex';
            resultsCount.textContent = `검색 결과: ${data.length}건`;

            data.forEach((item, index) => {
                try {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'wiki-item';
                    
                    // 해시태그 처리
                    const tags = item.tags ? item.tags.split(' ').filter(tag => tag.trim()) : [];
                    const tagsHtml = tags.length > 0 
                        ? `<div class="wiki-tags">${tags.map(tag => `<span class="wiki-tag">${tag}</span>`).join('')}</div>`
                        : '<span style="color: #808080;">-</span>';

                    itemDiv.innerHTML = `
                        <div class="wiki-field">
                            <div class="wiki-label">모델</div>
                            <div class="wiki-value">${item.model || '-'}</div>
                        </div>
                        <div class="wiki-field">
                            <div class="wiki-label">증상</div>
                            <div class="wiki-value">${item.symptom || '-'}</div>
                        </div>
                        <div class="wiki-field">
                            <div class="wiki-label">해결방법</div>
                            <div class="wiki-value">${item.solution || '-'}</div>
                        </div>
                        <div class="wiki-field">
                            <div class="wiki-label">사용부품</div>
                            <div class="wiki-value">${item.parts || '-'}</div>
                        </div>
                        <div class="wiki-field">
                            <div class="wiki-label">비고</div>
                            <div class="wiki-value">${item.note || '-'}</div>
                        </div>
                        <div class="wiki-field">
                            <div class="wiki-label">태그</div>
                            <div class="wiki-value">${tagsHtml}</div>
                        </div>
                    `;

                    resultsList.appendChild(itemDiv);
                } catch (e) {
                    console.error(`항목 ${index} 표시 오류:`, e, item);
                }
            });
            
            console.log('결과 표시 완료');
        }
    </script>
    <script src="hiq-notification.js?v=2"></script>
</body>
</html>
