<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일일 업무 보고 | HIQASC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: #2a2a2a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: #353535;
            border: 1px solid #4a4a4a;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            text-align: center;
        }

        .header-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
        }

        .header h1 {
            color: #ffffff;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .header p {
            color: #808080;
            font-size: 0.9em;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 15px;
            color: #4a90e2;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-button:hover {
            color: #357abd;
        }

        .form-container {
            background: #353535;
            border: 1px solid #4a4a4a;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .form-section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #4a90e2;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #4a4a4a;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: #e0e0e0;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .required {
            color: #e74c3c;
            margin-left: 3px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #4a4a4a;
            border-radius: 8px;
            background: #2a2a2a;
            color: #e0e0e0;
            font-size: 0.95em;
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        select.form-control {
            cursor: pointer;
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-hint {
            font-size: 0.8em;
            color: #808080;
            margin-top: 5px;
            font-style: italic;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #808080;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 40px;
            background: #353535;
            border: 1px solid #4a4a4a;
            border-radius: 12px;
        }

        .success-message.show {
            display: block;
        }

        .success-icon {
            font-size: 60px;
            color: #27ae60;
            margin-bottom: 20px;
        }

        .success-message h2 {
            color: #27ae60;
            margin-bottom: 10px;
        }

        .success-message p {
            color: #808080;
            margin-bottom: 20px;
        }

        .btn-primary {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.8em;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="https://donggukang09.github.io/hiqasc-platform/" class="back-button">← 메인으로</a>
            <div class="header-logo">R</div>
            <h1>일일 업무 보고</h1>
            <p>Daily Work Report System</p>
        </div>

        <div id="loadingMessage" class="loading">
            시스템 초기화 중...
        </div>

        <div class="form-container" id="formContainer" style="display: none;">
            <form id="dailyReportForm">
                <!-- 기본 정보 -->
                <div class="form-section">
                    <h3 class="section-title">기본 정보</h3>
                    
                    <div class="form-group">
                        <label class="form-label">이름<span class="required">*</span></label>
                        <select class="form-control" id="name" required>
                            <option value="">이름 선택</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">날짜<span class="required">*</span></label>
                        <input type="date" class="form-control" id="date" required>
                    </div>
                </div>

                <!-- 피드백 -->
                <div class="form-section">
                    <h3 class="section-title">업무 피드백</h3>

                    <div class="form-group">
                        <label class="form-label">오늘의 업무 요약<span class="required">*</span></label>
                        <textarea class="form-control" id="work_summary" placeholder="처리 건수, 주요 작업, 특이사항을 간단히 작성해주세요" required></textarea>
                        <div class="form-hint">예: 수리 8건, NTF 2건 / 동파 증가 추세 / 부품 부족 이슈</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">내일 계획 / 필요사항</label>
                        <textarea class="form-control" id="tomorrow_plan" placeholder="예정된 작업, 필요한 물품이나 지원사항을 작성해주세요"></textarea>
                        <div class="form-hint">예: B2B 물량 5건 예정 / 워터펌프 10개 필요</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">기타 메모</label>
                        <textarea class="form-control" id="other_notes" placeholder="컨디션, 배운 점, 팀과 공유하고 싶은 내용을 자유롭게 작성해주세요"></textarea>
                        <div class="form-hint">예: 컨디션 양호 / 새로운 증상 발견 - 위키에 정리 예정</div>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">제출하기</button>
            </form>
        </div>

        <div class="success-message" id="successMessage">
            <div class="success-icon">✓</div>
            <h2>제출 완료</h2>
            <p>일일 업무 보고가 성공적으로 저장되었습니다.</p>
            <a href="https://donggukang09.github.io/hiqasc-platform/" class="btn-primary">메인으로 돌아가기</a>
        </div>

        <div class="footer">
            <p>© 2025 HIQASC Daily Work Report System</p>
            <p>DEVELOPED BY DONGGU KANG</p>
        </div>
    </div>

    <script>
        // Google Apps Script Web App URL (설정 필요)
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby3yVstgMHz9GAxUuYa56DIqm8Lyzy3DweP8OFyXUQvIfdyqiFIhon5o8iRrHIHfi4n/exec';

        // 오늘 날짜를 기본값으로 설정
        document.getElementById('date').valueAsDate = new Date();

        // 페이지 로드 시 테크니션 이름 목록 가져오기
        async function loadTechnicians() {
            try {
                const response = await fetch(SCRIPT_URL + '?action=getTechnicians');
                const data = await response.json();
                
                const select = document.getElementById('name');
                
                if (data.technicians && data.technicians.length > 0) {
                    data.technicians.forEach(name => {
                        if (name && name.trim()) {
                            const option = document.createElement('option');
                            option.value = name.trim();
                            option.text = name.trim();
                            select.add(option);
                        }
                    });
                }
                
                // 로딩 숨기고 폼 표시
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('formContainer').style.display = 'block';
                
            } catch (error) {
                console.error('Error loading technicians:', error);
                document.getElementById('loadingMessage').textContent = '테크니션 목록을 불러오는데 실패했습니다. 페이지를 새로고침 해주세요.';
            }
        }

        // 폼 제출 처리
        document.getElementById('dailyReportForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '제출 중...';

            // 데이터 수집
            const formData = {
                action: 'submitReport',
                timestamp: new Date().toISOString(),
                name: document.getElementById('name').value,
                date: document.getElementById('date').value,
                work_summary: document.getElementById('work_summary').value,
                tomorrow_plan: document.getElementById('tomorrow_plan').value,
                other_notes: document.getElementById('other_notes').value
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                // 성공 메시지 표시
                document.getElementById('formContainer').style.display = 'none';
                document.getElementById('successMessage').classList.add('show');
                
            } catch (error) {
                console.error('Error:', error);
                alert('제출 중 오류가 발생했습니다. 다시 시도해주세요.');
                submitBtn.disabled = false;
                submitBtn.textContent = '제출하기';
            }
        });

        // 페이지 로드 시 테크니션 목록 불러오기
        window.addEventListener('load', () => {
            loadTechnicians();
        });
    </script>
    <script src="hiq-notification.js?v=2"></script>
</body>
</html>
