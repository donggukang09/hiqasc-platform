<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>직원 이슈 관리 | HIQASC</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // 관리자 전용 가드 (렌더 전 차단)
  (function () {
    if (sessionStorage.getItem('hiqasc_authenticated') !== 'true') {
      location.href = 'index.html';
      return;
    }
    if (sessionStorage.getItem('hiqasc_isAdmin') !== 'true') {
      alert('관리자만 접근할 수 있는 페이지입니다.');
      location.href = 'index.html';
    }
  })();
</script>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --line:#e3e6ea; --text:#2c2f33; --muted:#7b8189;
    --accent:#e8853a; --accent-soft:#fdf1e7;
    --danger:#d9534f; --warn:#e0a33e; --ok:#4a9d5f; --info:#4a90e2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:24px;line-height:1.55}
  .wrap{max-width:1240px;margin:0 auto}

  /* 헤더 */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .title h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
  .title p{font-size:13px;color:var(--muted);margin-top:4px}
  .top-actions{display:flex;gap:8px}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 16px;border-radius:8px;
       font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:#d5762c;border-color:#d5762c;color:#fff}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}

  /* 요약 */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .stat .k{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
  .stat .v{font-size:26px;font-weight:800;margin-top:6px}
  .stat.issue .v{color:var(--danger)} .stat.good .v{color:var(--ok)} .stat.open .v{color:var(--warn)}

  /* 카드 공통 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
  .card h2{font-size:15px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .card h2::before{content:'';width:4px;height:15px;background:var(--accent);border-radius:2px}

  /* 폼 */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1/-1}
  label{font-size:12px;font-weight:700;color:var(--muted)}
  input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--text);background:#fff;
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;transition:.15s;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{resize:vertical;min-height:74px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:8px;
    font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .seg.good button.on{background:var(--ok);border-color:var(--ok)}
  .form-foot{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:16px}
  .hint{font-size:12px;color:var(--muted);margin-right:auto}

  /* 필터 */
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}

  /* 목록 */
  .list{display:flex;flex-direction:column;gap:10px}
  .row{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:10px;padding:14px 16px;background:#fff}
  .row.sev-중대{border-left-color:var(--danger)}
  .row.sev-보통{border-left-color:var(--warn)}
  .row.sev-경미{border-left-color:var(--info)}
  .row.kind-우수{border-left-color:var(--ok)}
  .row-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .who{font-size:15px;font-weight:800}
  .tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:#f0f2f4;color:var(--muted)}
  .tag.k{background:var(--accent-soft);color:var(--accent)}
  .tag.k.good{background:#e9f5ec;color:var(--ok)}
  .tag.s-중대{background:#fbeaea;color:var(--danger)}
  .tag.s-보통{background:#fdf4e3;color:#b8811f}
  .tag.st-완료{background:#e9f5ec;color:var(--ok)}
  .tag.st-진행중{background:#fdf4e3;color:#b8811f}
  .tag.st-요청{background:#fbeaea;color:var(--danger)}
  .when{margin-left:auto;font-size:12px;color:var(--muted)}
  .subject{font-weight:700;margin-top:8px;font-size:14px}
  .body{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
  .blk{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .blk .bk{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}
  .blk .bv{font-size:13px;white-space:pre-wrap}
  .row-foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
  .row-foot .btn{padding:5px 10px;font-size:12px}

  /* 개인별 집계 */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
  th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .score-neg{color:var(--danger);font-weight:800}
  .score-pos{color:var(--ok);font-weight:800}

  .empty{text-align:center;color:var(--muted);padding:36px;font-size:14px}

  /* 2차 비밀번호 잠금 */
  #lock{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;
        align-items:center;justify-content:center;padding:20px}
  #lock .box{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:34px 30px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.07)}
  #lock .ico{width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);
        display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px}
  #lock h3{font-size:17px;font-weight:800;margin-bottom:6px}
  #lock p{font-size:13px;color:var(--muted);margin-bottom:20px}
  #lock input{text-align:center;letter-spacing:2px;margin-bottom:10px}
  #lock .err{font-size:12.5px;color:var(--danger);font-weight:700;min-height:18px;margin-bottom:8px}
  #lock .btn-primary{width:100%;padding:11px}
  #lock .back{margin-top:12px;font-size:12.5px;color:var(--muted);cursor:pointer;text-decoration:underline}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:#2c2f33;color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;
    opacity:0;transition:.25s;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:640px){body{padding:14px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- 2차 비밀번호 잠금 -->
<div id="lock">
  <div class="box">
    <div class="ico">🔒</div>
    <h3>2차 인증</h3>
    <p>직원 이슈 관리는 별도 비밀번호가 필요합니다.</p>
    <input type="password" id="lockPw" placeholder="비밀번호" autocomplete="off">
    <div class="err" id="lockErr"></div>
    <button class="btn btn-primary" onclick="unlock()">확인</button>
    <div class="back" onclick="location.href='admin.html'">관리팀 페이지로 돌아가기</div>
  </div>
</div>

<div class="wrap">

  <div class="top">
    <div class="title">
      <h1>직원 이슈 관리</h1>
      <p>평가 근거가 되는 이슈와 우수사례를 기록합니다 · 관리자 전용</p>
    </div>
    <div class="top-actions">
      <button class="btn" onclick="loadRecords()">새로고침</button>
      <button class="btn" onclick="exportCsv()">CSV 내보내기</button>
      <button class="btn" onclick="location.href='admin.html'">관리팀으로</button>
      <button class="btn" onclick="location.href='index.html'">메인</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">전체 기록</div><div class="v" id="sTotal">-</div></div>
    <div class="stat issue"><div class="k">이슈</div><div class="v" id="sIssue">-</div></div>
    <div class="stat good"><div class="k">우수사례</div><div class="v" id="sGood">-</div></div>
    <div class="stat open"><div class="k">미조치</div><div class="v" id="sOpen">-</div></div>
    <div class="stat"><div class="k">대상 인원</div><div class="v" id="sPeople">-</div></div>
  </div>

  <!-- 등록 -->
  <div class="card">
    <h2>새 기록 등록</h2>
    <div class="grid">
      <div class="field">
        <label>구분</label>
        <div class="seg" id="segKind">
          <button type="button" class="on" data-v="이슈" onclick="setKind('이슈')">이슈</button>
          <button type="button" data-v="우수" onclick="setKind('우수')">우수사례</button>
        </div>
      </div>
      <div class="field">
        <label>발생일</label>
        <input type="date" id="fDate">
      </div>
      <div class="field">
        <label>대상 직원</label>
        <select id="fName"><option value="">불러오는 중…</option></select>
      </div>
      <div class="field" id="wrapNameManual" style="display:none">
        <label>이름 직접 입력</label>
        <input type="text" id="fNameManual" placeholder="이름">
      </div>
      <div class="field">
        <label>소속 팀</label>
        <select id="fTeam">
          <option>AS팀</option><option>지원팀</option><option>관리팀</option>
        </select>
      </div>
      <div class="field">
        <label>유형</label>
        <select id="fType">
          <option>수리 품질</option>
          <option>재수리 / 재입고</option>
          <option>부품 · 자재 관리</option>
          <option>전산 입력 오류</option>
          <option>안전 · 설비</option>
          <option>근태</option>
          <option>규정 · 절차 위반</option>
          <option>고객 응대</option>
          <option>협업 · 커뮤니케이션</option>
          <option>기타</option>
        </select>
      </div>
      <div class="field">
        <label>심각도 / 기여도</label>
        <select id="fSeverity">
          <option value="경미">경미 (1점)</option>
          <option value="보통" selected>보통 (3점)</option>
          <option value="중대">중대 (5점)</option>

      </div>
      <div class="field">
        <label>조치 상태</label>
        <select id="fStatus">
          <option>요청</option>
          <option selected>진행중</option>
          <option>완료</option>
        </select>
      </div>
      <div class="field full">
        <label>제목 (한 줄 요약)</label>
        <input type="text" id="fTitle" placeholder="예: 배송 전 최종 검수 누락으로 고객 재입고 발생">
      </div>
      <div class="field full">
        <label>발생 내용</label>
        <textarea id="fDetail" placeholder="언제, 어떤 상황에서, 무엇이 발생했는지 사실 위주로 기록"></textarea>
      </div>
      <div class="field full">
        <label>취한 조치</label>
        <textarea id="fAction" placeholder="이미 처리한 내용 (구두 안내, 재작업, 교육, 고객 사과 등)"></textarea>
      </div>
      <div class="field full">
        <label>필요 조치 / 요청사항</label>
        <textarea id="fRequest" placeholder="앞으로 필요한 조치, 재발 방지 요청, 후속 확인 일정 등"></textarea>
      </div>
    </div>
    <div class="form-foot">
      <span class="hint" id="scorePreview">반영 점수 -3점</span>
      <button class="btn" onclick="resetForm()">지우기</button>
      <button class="btn btn-primary" id="btnSave" onclick="saveRecord()">기록 저장</button>
    </div>
  </div>

  <!-- 필터 -->
  <div class="card">
    <h2>기록 조회</h2>
    <div class="filters">
      <div class="field"><label>직원</label><select id="qName"><option value="">전체</option></select></div>
      <div class="field"><label>구분</label><select id="qKind"><option value="">전체</option><option>이슈</option><option>우수</option></select></div>
      <div class="field"><label>유형</label><select id="qType"><option value="">전체</option></select></div>
      <div class="field"><label>상태</label><select id="qStatus"><option value="">전체</option><option>요청</option><option>진행중</option><option>완료</option></select></div>
      <div class="field"><label>시작일</label><input type="date" id="qFrom"></div>
      <div class="field"><label>종료일</label><input type="date" id="qTo"></div>
      <div class="field"><label>검색어</label><input type="text" id="qText" placeholder="제목·내용"></div>
    </div>
  </div>

  <!-- 개인별 집계 -->
  <div class="card">
    <h2>개인별 집계 (현재 조회 조건 기준)</h2>
    <div style="overflow-x:auto">
      <table id="summaryTable">
        <thead><tr><th>이름</th><th>팀</th><th class="num">이슈</th><th class="num">우수</th><th class="num">미조치</th><th class="num">누적 점수</th><th>최근 기록</th></tr></thead>
        <tbody><tr><td colspan="7" class="empty">데이터 없음</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 목록 -->
  <div class="card">
    <h2>기록 목록 <span id="listCount" style="font-weight:600;color:var(--muted);font-size:13px"></span></h2>
    <div class="list" id="list"><div class="empty">불러오는 중…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===========================================================
   설정
   =========================================================== */
const SHEET_ID   = '1cmMEbIkmEL629RT04hpUUgXddnSVLGo1YwRzBwfyzCY';
const ISSUE_TAB  = '직원이슈';        // gid=1294106480 탭 이름
const EMP_TAB    = '테크니션정보';     // gid=1733251406 탭 이름
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw82q1I41Eh-7tA-trqDXO2eps9ORFq6A71YlRxpma5_3tPe1Zm5q-CUa0nadlaLN6KPg/exec';

/* ▼▼▼ 2차 비밀번호 — 변경하려면 아래 따옴표 안의 값만 수정 ▼▼▼ */
const SECOND_PASSWORD = '$hiqasc$';
/* ▲▲▲ 변경 후 GitHub에 업로드하면 즉시 적용됩니다 ▲▲▲ */

const SEV_SCORE = { '경미':1, '보통':3, '중대':5 };
const RECORDER  = sessionStorage.getItem('userName') || '관리자';

let ALL = [];          // 전체 기록
let EMPLOYEES = [];    // {name, position}
let kind = '이슈';
let isDirty = false;

/* ===========================================================
   gviz 유틸
   =========================================================== */
function gviz(tab, cb) {
  const fn = 'cb_' + Math.random().toString(36).slice(2);
  window[fn] = (res) => {
    try {
      const t = res.table || {};
      const rows = (t.rows || []).map(r => (r.c || []).map(c => {
        if (!c) return '';
        if (c.f !== undefined && c.f !== null && c.f !== '') return String(c.f).trim();
        if (c.v === null || c.v === undefined) return '';
        if (typeof c.v === 'string' && /^Date\(/.test(c.v)) {
          const p = c.v.match(/\d+/g).map(Number);
          return `${p[0]}-${String(p[1]+1).padStart(2,'0')}-${String(p[2]).padStart(2,'0')}`;
        }
        return String(c.v).trim();
      }));
      const labels = (t.cols || []).map(c => (c.label || '').trim());
      cb(rows, labels);
    } catch (e) { console.error(e); cb([], []); }
    delete window[fn];
    document.getElementById(fn)?.remove();
  };
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`
            + `?sheet=${encodeURIComponent(tab)}&headers=1`
            + `&tqx=out:json;responseHandler:${fn}`;
  const s = document.createElement('script');
  s.id = fn; s.src = url;
  s.onerror = () => { cb([], []); delete window[fn]; s.remove(); };
  document.body.appendChild(s);
}

/* ===========================================================
   직원 명단
   =========================================================== */
function loadEmployees() {
  gviz(EMP_TAB, (rows, labels) => {
    // 첫 행 미고정으로 헤더가 label에 흡수된 경우 보정
    const headerAbsorbed = labels[0] && labels[0] !== '이름' && labels.some(l => l === '이름');
    const nameIdx = labels.indexOf('이름') >= 0 ? labels.indexOf('이름') : 0;
    const posIdx  = labels.indexOf('직책') >= 0 ? labels.indexOf('직책') : 1;

    const list = [];
    if (headerAbsorbed && labels[nameIdx] !== '이름') { /* no-op */ }
    rows.forEach(r => {
      const n = (r[nameIdx] || '').trim();
      if (!n || n === '이름') return;
      list.push({ name: n, position: (r[posIdx] || '').trim() });
    });
    EMPLOYEES = list;

    const opts = ['<option value="">선택하세요</option>']
      .concat(list.map(e => `<option value="${esc(e.name)}">${esc(e.name)}${e.position ? ' · ' + esc(e.position) : ''}</option>`))
      .concat(['<option value="__manual__">직접 입력…</option>']).join('');
    document.getElementById('fName').innerHTML = opts;

    document.getElementById('qName').innerHTML = '<option value="">전체</option>'
      + list.map(e => `<option value="${esc(e.name)}">${esc(e.name)}</option>`).join('');
  });
}

/* ===========================================================
   기록 로드
   컬럼: A기록ID B기록일시 C기록자 D발생일 E이름 F팀 G구분 H유형
        I심각도 J제목 K내용 L조치 M요청 N상태 O점수
   =========================================================== */
function loadRecords() {
  document.getElementById('list').innerHTML = '<div class="empty">불러오는 중…</div>';
  gviz(ISSUE_TAB, (rows) => {
    ALL = rows
      .filter(r => (r[0] || '').trim() && (r[0] || '').trim() !== '기록ID')
      .map(r => ({
        id: r[0], logged: r[1], recorder: r[2], date: r[3], name: r[4], team: r[5],
        kind: r[6] || '이슈', type: r[7], severity: r[8] || '보통', title: r[9],
        detail: r[10], action: r[11], request: r[12], status: r[13] || '진행중',
        score: Number(r[14] || 0)
      }))
      .sort((a, b) => String(b.date).localeCompare(String(a.date)));

    const types = [...new Set(ALL.map(r => r.type).filter(Boolean))].sort();
    document.getElementById('qType').innerHTML = '<option value="">전체</option>'
      + types.map(t => `<option>${esc(t)}</option>`).join('');

    render();
  });
}

/* ===========================================================
   렌더
   =========================================================== */
function filtered() {
  const n = v('qName'), k = v('qKind'), t = v('qType'), s = v('qStatus');
  const f = v('qFrom'), to = v('qTo'), q = v('qText').trim().toLowerCase();
  return ALL.filter(r => {
    if (n && r.name !== n) return false;
    if (k && r.kind !== k) return false;
    if (t && r.type !== t) return false;
    if (s && r.status !== s) return false;
    if (f && String(r.date) < f) return false;
    if (to && String(r.date) > to) return false;
    if (q && !((r.title||'') + (r.detail||'') + (r.action||'') + (r.request||'')).toLowerCase().includes(q)) return false;
    return true;
  });
}

function render() {
  const data = filtered();

  // 요약
  document.getElementById('sTotal').textContent  = data.length;
  document.getElementById('sIssue').textContent  = data.filter(r => r.kind === '이슈').length;
  document.getElementById('sGood').textContent   = data.filter(r => r.kind === '우수').length;
  document.getElementById('sOpen').textContent   = data.filter(r => r.status !== '완료').length;
  document.getElementById('sPeople').textContent = new Set(data.map(r => r.name)).size;

  // 개인별 집계
  const map = {};
  data.forEach(r => {
    const m = map[r.name] || (map[r.name] = { team: r.team, issue: 0, good: 0, open: 0, score: 0, last: '' });
    if (r.kind === '우수') m.good++; else m.issue++;
    if (r.status !== '완료') m.open++;
    m.score += r.score || 0;
    if (String(r.date) > String(m.last)) m.last = r.date;
  });
  const names = Object.keys(map).sort((a, b) => map[a].score - map[b].score);
  const tb = document.querySelector('#summaryTable tbody');
  tb.innerHTML = names.length ? names.map(n => {
    const m = map[n];
    return `<tr>
      <td style="font-weight:700">${esc(n)}</td>
      <td>${esc(m.team || '')}</td>
      <td class="num">${m.issue}</td>
      <td class="num">${m.good}</td>
      <td class="num">${m.open}</td>
      <td class="num ${m.score < 0 ? 'score-neg' : m.score > 0 ? 'score-pos' : ''}">${m.score > 0 ? '+' : ''}${m.score}</td>
      <td>${esc(m.last || '')}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="7" class="empty">데이터 없음</td></tr>';

  // 목록
  document.getElementById('listCount').textContent = `(${data.length}건)`;
  const list = document.getElementById('list');
  list.innerHTML = data.length ? data.map(r => `
    <div class="row ${r.kind === '우수' ? 'kind-우수' : 'sev-' + esc(r.severity)}">
      <div class="row-head">
        <span class="who">${esc(r.name)}</span>
        <span class="tag k ${r.kind === '우수' ? 'good' : ''}">${r.kind === '우수' ? '우수사례' : '이슈'}</span>
        <span class="tag">${esc(r.team || '')}</span>
        <span class="tag">${esc(r.type || '')}</span>
        <span class="tag s-${esc(r.severity)}">${esc(r.severity)}</span>
        <span class="tag st-${esc(r.status)}">${esc(r.status)}</span>
        <span class="when">${esc(r.date)}</span>
      </div>
      <div class="subject">${esc(r.title || '(제목 없음)')}</div>
      <div class="body">
        ${blk('발생 내용', r.detail)}
        ${blk('취한 조치', r.action)}
        ${blk('필요 조치 / 요청', r.request)}
      </div>
      <div class="row-foot">
        <span>기록자 ${esc(r.recorder || '')} · ${esc(r.logged || '')} · 점수 ${r.score > 0 ? '+' : ''}${r.score}</span>
        ${r.status !== '완료'
          ? `<button class="btn" style="margin-left:auto" onclick="updateStatus('${esc(r.id)}','완료')">조치 완료로 변경</button>`
          : `<button class="btn" style="margin-left:auto" onclick="updateStatus('${esc(r.id)}','진행중')">진행중으로 되돌리기</button>`}
      </div>
    </div>`).join('') : '<div class="empty">조건에 맞는 기록이 없습니다.</div>';
}

function blk(k, val) {
  if (!val) return '';
  return `<div class="blk"><div class="bk">${k}</div><div class="bv">${esc(val)}</div></div>`;
}

/* ===========================================================
   저장 / 상태 변경
   =========================================================== */
function saveRecord() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
    return toast('Apps Script URL이 설정되지 않았습니다');
  }
  const sel = v('fName');
  const name = sel === '__manual__' ? v('fNameManual').trim() : sel;
  if (!name)        return toast('대상 직원을 선택하세요');
  if (!v('fDate'))  return toast('발생일을 입력하세요');
  if (!v('fTitle').trim()) return toast('제목을 입력하세요');

  const severity = v('fSeverity');
  const score = (kind === '우수' ? 1 : -1) * SEV_SCORE[severity];

  const payload = {
    action: 'add',
    id: 'ISS' + Date.now(),
    recorder: RECORDER,
    date: v('fDate'),
    name, team: v('fTeam'), kind, type: v('fType'), severity,
    title: v('fTitle').trim(),
    detail: v('fDetail').trim(),
    actionTaken: v('fAction').trim(),
    request: v('fRequest').trim(),
    status: v('fStatus'),
    score
  };

  const btn = document.getElementById('btnSave');
  btn.disabled = true; btn.textContent = '저장 중…';

  fetch(APPS_SCRIPT_URL, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(() => {
    toast(`${name}님 기록을 저장했습니다`);
    isDirty = false;
    resetForm();
    setTimeout(loadRecords, 1200);
  }).catch(() => toast('저장에 실패했습니다. 다시 시도하세요'))
    .finally(() => { btn.disabled = false; btn.textContent = '기록 저장'; });
}

function updateStatus(id, status) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
    return toast('Apps Script URL이 설정되지 않았습니다');
  }
  fetch(APPS_SCRIPT_URL, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'status', id, status })
  }).then(() => {
    toast(`상태를 '${status}'로 변경했습니다`);
    const r = ALL.find(x => x.id === id); if (r) r.status = status;
    render();
    setTimeout(loadRecords, 1500);
  }).catch(() => toast('상태 변경에 실패했습니다'));
}

/* ===========================================================
   CSV
   =========================================================== */
function exportCsv() {
  const data = filtered();
  if (!data.length) return toast('내보낼 기록이 없습니다');
  const head = ['발생일','이름','팀','구분','유형','심각도','제목','발생내용','취한조치','필요조치','상태','점수','기록자','기록일시'];
  const lines = [head.join(',')].concat(data.map(r => [
    r.date, r.name, r.team, r.kind, r.type, r.severity, r.title,
    r.detail, r.action, r.request, r.status, r.score, r.recorder, r.logged
  ].map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `직원이슈_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

/* ===========================================================
   보조
   =========================================================== */
function v(id) { return document.getElementById(id).value; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}
function setKind(k) {
  kind = k;
  document.querySelectorAll('#segKind button').forEach(b => b.classList.toggle('on', b.dataset.v === k));
  document.getElementById('segKind').classList.toggle('good', k === '우수');
  updateScorePreview();
}
function updateScorePreview() {
  const s = SEV_SCORE[v('fSeverity')] * (kind === '우수' ? 1 : -1);
  document.getElementById('scorePreview').textContent = `반영 점수 ${s > 0 ? '+' : ''}${s}점`;
}
function resetForm() {
  ['fTitle','fDetail','fAction','fRequest','fNameManual'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fName').value = '';
  document.getElementById('wrapNameManual').style.display = 'none';
  isDirty = false;
}

/* ===========================================================
   2차 비밀번호
   =========================================================== */
let lockTries = 0;

function unlock() {
  const input = document.getElementById('lockPw');
  if (input.value === SECOND_PASSWORD) {
    document.getElementById('lock').style.display = 'none';
    initPage();
    return;
  }
  lockTries++;
  input.value = '';
  if (lockTries >= 3) {
    alert('비밀번호를 3회 잘못 입력했습니다.');
    location.href = 'admin.html';
    return;
  }
  document.getElementById('lockErr').textContent = `비밀번호가 올바르지 않습니다 (${lockTries}/3)`;
  input.focus();
}

/* ===========================================================
   초기화
   =========================================================== */
let inited = false;

function initPage() {
  if (inited) return;
  inited = true;

  document.getElementById('fDate').value = new Date().toISOString().slice(0, 10);
  loadEmployees();
  loadRecords();
  updateScorePreview();

  document.getElementById('fName').addEventListener('change', e => {
    document.getElementById('wrapNameManual').style.display = e.target.value === '__manual__' ? 'flex' : 'none';
  });
  document.getElementById('fSeverity').addEventListener('change', updateScorePreview);

  ['qName','qKind','qType','qStatus','qFrom','qTo'].forEach(id =>
    document.getElementById(id).addEventListener('change', render));
  document.getElementById('qText').addEventListener('input', render);

  ['fTitle','fDetail','fAction','fRequest'].forEach(id =>
    document.getElementById(id).addEventListener('input', () => isDirty = true));
}

window.addEventListener('load', () => {
  // 페이지에 들어올 때마다 항상 2차 인증 요구 (해제 상태를 저장하지 않음)
  const pw = document.getElementById('lockPw');
  pw.value = '';
  pw.focus();
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
});

window.addEventListener('beforeunload', e => {
  if (isDirty) { e.preventDefault(); e.returnValue = ''; }
});
</script>
