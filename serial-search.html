function prodDate(p){
  const yy=parseInt(p.slice(0,2),10), ddd=parseInt(p.slice(2,5),10);

function loadSheet(){
  return new Promise((res,rej)=>{
    const cb="__sn_"+Date.now();
    const t=setTimeout(()=>{cleanup();rej(new Error("timeout"));},9000);
    function cleanup(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb]=r=>{ cleanup(); try{ res(parse(r)); }catch(e){ rej(e); } };
    const s=document.createElement("script");
    s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`

function pad(v,len){
  const s=String(v??"").trim();
  return /^\d+$/.test(s) ? s.padStart(len,"0") : s.toUpperCase();
}
function parse(r){
  if(!r||!r.table||!r.table.rows) throw new Error("empty");
  const cell=(c)=> c==null ? "" : String(c.f ?? c.v ?? "").trim();
  const out=r.table.rows.map(row=>(row.c||[]).map(cell))
    .filter(c=>c[0]&&c[1]&&c[2])
    .map(c=>[pad(c[0],3),pad(c[1],2),c[2],c[3]||"",c[4]||"",c[5]||"",c[6]||"",+c[7]||0,+c[8]||100,c[9]||""]);
  if(!out.length) throw new Error("empty");
  return out;

  document.getElementById("srcTxt").innerHTML = live
    ? `구글 시트 [${esc(TAB)}] 연결됨 · 규칙 ${list.length}건 &nbsp;<a href="${SHEET_URL}" target="_blank" rel="noopener">시트 열기</a> &nbsp;<button type="button" id="rl">다시 읽기</button>`
    : `시트를 못 읽어 내장 백업 사용 중 · 규칙 ${list.length}건 &nbsp;<button type="button" id="rl">다시 시도</button>`;
  document.getElementById("cnt").textContent=`(${list.length}건)`;
  paint(document.getElementById("q").value);
  const sn=document.getElementById("sn").value; if(sn) lookup(sn);
}

function boot(){
  loadSheet().then(l=>apply(l,true)).catch(()=>apply(FALLBACK,false));
}
document.getElementById("src").addEventListener("click",e=>{ if(e.target.id==="rl"){ e.target.textContent="…"; boot(); } });

/* ── 판독 ── */
function strip(sn){
  return `<div class="decode"><div class="strip">`+SEGS.map(([a,b,cap,mk])=>{
    const v = cap.startsWith("생산일자") ? prodDate(sn) : "";
    return `<div class="seg" data-k="${mk||0}"><div class="chars">${esc(sn.slice(a,b))}</div>
      <div class="dim"></div><div class="cap">${esc(cap)}</div>${v?`<div class="val">${esc(v)}</div>`:""}</div>`;
  }).join("")+`</div></div>`;
}
function card(r){
  const pill = r.conf>=90 ? `<span class="pill ok">일치율 ${r.conf}%</span>` : `<span class="pill warn">일치율 ${r.conf}%</span>`;
  return `<div class="result">
    <div class="bar"><span>판독 결과</span><span>${r.n?r.n+"건 표본 기준":"신규 등록"}</span></div>
    <dl class="rows">
      <div class="row"><dt>Model line</dt><dd>${esc(r.line)||"—"}</dd></div>
      <div class="row"><dt>Model</dt><dd>${esc(r.model)||"—"}</dd></div>
      <div class="row big"><dt>Machine ID</dt><dd>${esc(r.id)}${r.n?pill:""}</dd></div>
    </dl>
    ${r.note?`<p class="note">${esc(r.note)}</p>`:""}</div>`;
}
function fail(t,m){ return `<div class="fail"><strong>${esc(t)}</strong>${esc(m)}</div>`; }
function missing(sn){
  const code=sn.slice(5,8).toUpperCase(), col=sn.slice(16,18).toUpperCase();
  return `<div class="result">
    <div class="bar"><span>등록되지 않은 조합</span><span>시트에 행 추가 필요</span></div>
    <dl class="rows">
      <div class="row"><dt>모델코드</dt><dd>${esc(code)}</dd></div>
      <div class="row"><dt>색상코드</dt><dd>${esc(col)}</dd></div>
      <div class="row"><dt>국가코드</dt><dd>${esc(sn.slice(13,16))}</dd></div>
    </dl>
    <p class="note">구글 시트 [${esc(TAB)}] 탭 맨 아래에 아래 값을 붙여넣고 Machine ID·Model line·Model을 채우세요. 저장 후 [다시 읽기]를 누르면 바로 조회됩니다. 시트가 앞자리 0을 지워도 조회기가 자동으로 되돌리니 그대로 두셔도 됩니다.</p>
    <div class="snip"><code id="snip">${esc(code)}\t${esc(col)}\t\t\t\t\t${esc(sn.slice(13,16))}\t0\t100</code>
      <button type="button" id="cp">복사</button></div></div>`;
}
function lookup(raw){
  const sn=raw.trim().replace(/\s+/g,""), out=document.getElementById("out");
  if(!sn){ out.innerHTML=""; return; }
  if(/^\d{5}NFA\d+$/i.test(sn)) return void(out.innerHTML=fail("NF10WH (밀크 프로더)","모델 마스터에 등록되지 않은 품목입니다."));
  if(/^[A-Z]{2,3}[A-Z0-9]{4,5}$/i.test(sn)&&!/^\d/.test(sn))
    return void(out.innerHTML=fail("Breville 시리얼 형식","이 체계에는 모델 정보가 담겨 있지 않습니다. 기기 라벨의 모델번호를 확인하세요."));
  if(sn.length!==19) return void(out.innerHTML=fail("형식이 맞지 않습니다",`19자리가 필요합니다. 현재 ${sn.length}자리 입력됨.`));
  const r=RULES[sn.slice(5,8).toUpperCase()+"|"+sn.slice(16,18).toUpperCase()];
  out.innerHTML = strip(sn) + (r ? card(r) : missing(sn));
}
document.getElementById("sn").addEventListener("input",e=>lookup(e.target.value));
document.getElementById("out").addEventListener("click",e=>{
  if(e.target.id!=="cp") return;
  navigator.clipboard.writeText(document.getElementById("snip").textContent).then(()=>{
    e.target.textContent="복사됨"; setTimeout(()=>e.target.textContent="복사",1600);
  }).catch(()=>e.target.textContent="복사 실패");
});

/* ── 규칙표 ── */
function paint(f){
  const q=(f||"").trim().toUpperCase();
  const list=ROWS.filter(r=>!q||r.join(" ").toUpperCase().includes(q));
  document.getElementById("tb").innerHTML = list.map(r=>
    `<tr><td class="m">${esc(r[0])}</td><td class="m">${esc(r[1])}</td><td class="m">${esc(r[2])}</td>
     <td>${esc(r[3])||"—"}</td><td>${esc(r[4])||"—"}</td><td class="m">${esc(r[5])||"—"}</td>
     <td class="n">${esc(r[6])}</td><td class="n">${r[7]}</td></tr>`).join("")
    || `<tr><td colspan="8" style="color:var(--ink3);padding:18px 12px">검색 결과 없음</td></tr>`;
}
document.getElementById("q").addEventListener("input",e=>paint(e.target.value));

boot();
</script>
</body>
</html>
