<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>직원 제안 게시판 · HIQASC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
// 인증 가드 — 로그인 안 됐으면 즉시 index로
if (sessionStorage.getItem('hiqasc_authenticated') !== 'true') {
    location.replace('index.html');
}
</script>
<style>
:root{
    --bg:#2a2a2a; --card:#353535; --border:#4a4a4a;
    --text:#e0e0e0; --text-sub:#9a9a9a; --accent:#4a90e2;
    --green:#3aa876; --orange:#e0913a; --red:#d9534f; --gold:#e8c46b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:'Manrope','Segoe UI',sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; padding:0 0 60px;
}
body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
        linear-gradient(rgba(74,144,226,.05) 1px,transparent 1px),
        linear-gradient(90deg,rgba(74,144,226,.05) 1px,transparent 1px);
    background-size:40px 40px;
}
.wrap{position:relative; z-index:1; max-width:820px; margin:0 auto; padding:0 18px}

/* 헤더 */
.top{
    display:flex; align-items:center; gap:12px;
    padding:22px 0 18px;
}
.back{
    background:none; border:1px solid var(--border); border-radius:8px;
    color:var(--text-sub); font-size:20px; width:40px; height:40px;
    cursor:pointer; transition:.15s; flex-shrink:0;
}
.back:hover{color:var(--text); border-color:#6a6a6a}
.top h1{font-size:20px; font-weight:700; letter-spacing:-.01em}
.top .who{margin-left:auto; font-size:13px; color:var(--text-sub)}
.top .who b{color:var(--accent); font-weight:600}

/* 탭 전환 */
.tabs{display:flex; gap:8px; margin-bottom:18px}
.tabs button{
    flex:1; background:var(--card); border:1px solid var(--border); border-radius:10px;
    color:var(--text-sub); font-family:inherit; font-size:14px; font-weight:600;
    padding:12px; cursor:pointer; transition:.15s;
}
.tabs button.on{background:var(--accent); border-color:var(--accent); color:#fff}

/* 카드 공통 */
.card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:20px; margin-bottom:14px;
}
.card h2{font-size:15px; font-weight:700; margin-bottom:14px; color:var(--text)}

/* 폼 */
label{display:block; font-size:13px; color:var(--text-sub); margin:0 0 6px 2px; font-weight:500}
.field{margin-bottom:16px}
input[type=text], textarea, select{
    width:100%; background:#2f2f2f; border:1px solid var(--border); border-radius:9px;
    color:var(--text); font-family:inherit; font-size:14px; padding:11px 13px;
    transition:.15s;
}
input[type=text]:focus, textarea:focus, select:focus{
    outline:none; border-color:var(--accent);
}
textarea{resize:vertical; min-height:120px; line-height:1.55}
select{cursor:pointer}

.cats{display:flex; flex-wrap:wrap; gap:8px}
.cats label{
    margin:0; padding:8px 15px; border:1px solid var(--border); border-radius:20px;
    background:#2f2f2f; color:var(--text-sub); font-size:13px; cursor:pointer; transition:.15s;
    user-select:none;
}
.cats input{display:none}
.cats input:checked + span{color:#fff}
.cats label:has(input:checked){background:var(--accent); border-color:var(--accent)}

/* 비밀글 */
.secret-row{
    display:flex; align-items:center; gap:10px; margin-bottom:14px;
    padding:12px 14px; background:#2f2f2f; border:1px solid var(--border); border-radius:9px;
}
.secret-row input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent); cursor:pointer}
.secret-row label{margin:0; font-size:14px; color:var(--text); cursor:pointer; font-weight:500}
.secret-row .hint{margin-left:auto; font-size:12px; color:var(--text-sub)}
#secretPwField{display:none; margin-top:0}

.submit{
    width:100%; background:var(--accent); border:none; border-radius:10px;
    color:#fff; font-family:inherit; font-size:15px; font-weight:700;
    padding:14px; cursor:pointer; transition:.15s;
}
.submit:hover{background:#3a7fd0}
.submit:disabled{opacity:.5; cursor:default}

/* 목록 */
.item{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:16px 18px; margin-bottom:12px; transition:.15s;
}
.item-head{display:flex; align-items:center; gap:9px; margin-bottom:8px; flex-wrap:wrap}
.badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; letter-spacing:.02em}
.b-cat{background:rgba(74,144,226,.15); color:#7fb3ec}
.b-접수{background:rgba(154,154,154,.15); color:#bdbdbd}
.b-검토중{background:rgba(224,145,58,.15); color:var(--orange)}
.b-반영{background:rgba(58,168,118,.18); color:#5fcfa0}
.b-보류{background:rgba(217,83,79,.15); color:#e88a87}
.item-title{font-size:15px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:7px}
.lock{color:var(--gold); font-size:13px}
.item-meta{font-size:12px; color:var(--text-sub); margin-left:auto}
.item-body{
    font-size:14px; color:#cfcfcf; line-height:1.6; margin-top:10px;
    white-space:pre-wrap; word-break:break-word;
}
.secret-locked{
    margin-top:10px; padding:14px; border:1px dashed var(--border); border-radius:9px;
    text-align:center; color:var(--text-sub); font-size:13px;
}
.secret-locked .unlock{
    margin-top:10px; display:flex; gap:8px; justify-content:center;
}
.secret-locked input{max-width:180px; padding:8px 11px}
.secret-locked button{
    background:var(--gold); border:none; border-radius:8px; color:#2a2a2a;
    font-weight:700; font-size:13px; padding:8px 16px; cursor:pointer; font-family:inherit;
}

/* 관리자 상태 변경 */
.admin-status{margin-top:12px; display:flex; align-items:center; gap:8px}
.admin-status select{max-width:140px; padding:7px 10px; font-size:13px}
.admin-status .tag{font-size:11px; color:var(--orange); font-weight:700}

.empty{text-align:center; color:var(--text-sub); padding:50px 0; font-size:14px}
.loading{text-align:center; color:var(--text-sub); padding:50px 0; font-size:14px}

/* 토스트 */
#toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px);
    background:#1e1e1e; border:1px solid var(--border); color:var(--text);
    padding:12px 22px; border-radius:10px; font-size:14px; opacity:0;
    pointer-events:none; transition:.25s; z-index:100;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <button class="back" onclick="location.href='index.html'">←</button>
        <h1>💡 직원 제안 게시판</h1>
        <div class="who"><b id="whoName">-</b> 님</div>
    </div>

    <div class="tabs">
        <button id="tabWrite" class="on" onclick="switchTab('write')">✏️ 제안 작성</button>
        <button id="tabList" onclick="switchTab('list')">📋 제안 목록</button>
    </div>

    <!-- 작성 -->
    <div id="panelWrite">
        <div class="card">
            <h2>새 제안 작성</h2>

            <div class="field">
                <label>카테고리</label>
                <div class="cats" id="cats">
                    <label><input type="radio" name="cat" value="업무개선" checked><span>업무개선</span></label>
                    <label><input type="radio" name="cat" value="복지"><span>복지</span></label>
                    <label><input type="radio" name="cat" value="시설/장비"><span>시설/장비</span></label>
                    <label><input type="radio" name="cat" value="기타"><span>기타</span></label>
                </div>
            </div>

            <div class="field">
                <label>제목</label>
                <input type="text" id="title" maxlength="60" placeholder="제안 제목을 입력하세요">
            </div>

            <div class="field">
                <label>내용</label>
                <textarea id="content" placeholder="제안 내용을 자세히 적어주세요"></textarea>
            </div>

            <div class="secret-row">
                <input type="checkbox" id="secret" onchange="toggleSecret()">
                <label for="secret">🔒 비밀글로 작성</label>
                <span class="hint">작성자 본인 · 관리자 · 비번 아는 사람만 열람</span>
            </div>
            <div class="field" id="secretPwField">
                <label>열람 비밀번호</label>
                <input type="text" id="secretPw" maxlength="20" placeholder="이 글을 열람할 비밀번호">
            </div>

            <button class="submit" id="submitBtn" onclick="submitSuggestion()">제안 등록</button>
        </div>
    </div>

    <!-- 목록 -->
    <div id="panelList" style="display:none">
        <div id="listArea"><div class="loading">불러오는 중…</div></div>
    </div>
</div>

<div id="toast"></div>

<script>
/* ⚠️ 배포 후 아래 URL을 새 Apps Script /exec 주소로 교체하세요 */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz_8DDIPMjbK9YlieHsj9Xxc5yXk55bpPN1RRQ06DOIxQo8GyalxfF9UwM9oMxOicRn/exec';

const ME = {
    name: sessionStorage.getItem('userName') || '',
    id:   sessionStorage.getItem('userId') || '',
    isAdmin: sessionStorage.getItem('hiqasc_isAdmin') === 'true'
};
document.getElementById('whoName').textContent = ME.name || '알 수 없음';

/* ---------- 탭 ---------- */
function switchTab(t){
    const w = t === 'write';
    document.getElementById('panelWrite').style.display = w ? 'block' : 'none';
    document.getElementById('panelList').style.display  = w ? 'none' : 'block';
    document.getElementById('tabWrite').classList.toggle('on', w);
    document.getElementById('tabList').classList.toggle('on', !w);
    if (!w) loadList();
}

/* ---------- 비밀글 토글 ---------- */
function toggleSecret(){
    const on = document.getElementById('secret').checked;
    document.getElementById('secretPwField').style.display = on ? 'block' : 'none';
}

/* ---------- 토스트 ---------- */
let toastTimer;
function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- 등록 ---------- */
function submitSuggestion(){
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE'){
        toast('APPS_SCRIPT_URL이 설정되지 않았습니다'); return;
    }
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    const cat = document.querySelector('input[name=cat]:checked').value;
    const secret = document.getElementById('secret').checked;
    const pw = document.getElementById('secretPw').value.trim();

    if (!title){ toast('제목을 입력하세요'); return; }
    if (!content){ toast('내용을 입력하세요'); return; }
    if (secret && !pw){ toast('비밀글 열람 비밀번호를 입력하세요'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = '등록 중…';

    const body = new URLSearchParams({
        action:'create', author:ME.name, userId:ME.id,
        category:cat, title, content,
        secret: secret ? '1':'0', password: secret ? pw : ''
    });

    fetch(APPS_SCRIPT_URL, {method:'POST', body})
        .then(()=> {
            toast('제안이 등록되었습니다 ✓');
            document.getElementById('title').value='';
            document.getElementById('content').value='';
            document.getElementById('secretPw').value='';
            document.getElementById('secret').checked=false;
            toggleSecret();
            btn.disabled=false; btn.textContent='제안 등록';
            setTimeout(()=>switchTab('list'), 700);
        })
        .catch(()=>{
            // no-cors라 응답을 못 읽어도 대개 성공 — 안내만
            toast('제안이 등록되었습니다 ✓');
            btn.disabled=false; btn.textContent='제안 등록';
            setTimeout(()=>switchTab('list'), 700);
        });
}

/* ---------- 목록 로드 (JSONP) ---------- */
function loadList(){
    document.getElementById('listArea').innerHTML = '<div class="loading">불러오는 중…</div>';
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE'){
        document.getElementById('listArea').innerHTML = '<div class="empty">APPS_SCRIPT_URL이 설정되지 않았습니다</div>';
        return;
    }
    const cb = 'sugcb_' + Date.now();
    window[cb] = function(res){
        delete window[cb]; document.body.removeChild(s);
        renderList(res && res.rows ? res.rows : []);
    };
    const s = document.createElement('script');
    s.src = APPS_SCRIPT_URL + '?callback=' + cb + '&_=' + Date.now();
    s.onerror = function(){
        document.getElementById('listArea').innerHTML = '<div class="empty">목록을 불러오지 못했습니다</div>';
    };
    document.body.appendChild(s);
}

function esc(str){
    return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderList(rows){
    const area = document.getElementById('listArea');
    if (!rows.length){ area.innerHTML = '<div class="empty">아직 등록된 제안이 없습니다</div>'; return; }
    rows.reverse(); // 최신순
    area.innerHTML = rows.map(r=>{
        const canSee = !r.secret || r.author === ME.name || ME.isAdmin;
        let bodyHtml;
        if (canSee){
            bodyHtml = `<div class="item-body">${esc(r.content)}</div>`;
        } else {
            bodyHtml = `
                <div class="secret-locked" id="lock-${r.row}">
                    🔒 비밀글입니다. 비밀번호를 입력하세요.
                    <div class="unlock">
                        <input type="text" id="pw-${r.row}" placeholder="비밀번호">
                        <button onclick="unlock(${r.row})">열람</button>
                    </div>
                </div>`;
        }
        const adminCtrl = ME.isAdmin ? `
            <div class="admin-status">
                <span class="tag">관리자</span>
                <select onchange="setStatus(${r.row}, this.value)">
                    ${['접수','검토중','반영','보류'].map(st=>
                        `<option value="${st}" ${st===r.status?'selected':''}>${st}</option>`).join('')}
                </select>
            </div>` : '';
        return `
        <div class="item">
            <div class="item-head">
                <span class="badge b-cat">${esc(r.category)}</span>
                <span class="badge b-${esc(r.status)}">${esc(r.status)}</span>
                <span class="item-title">${r.secret?'<span class="lock">🔒</span>':''}${esc(r.title)}</span>
                <span class="item-meta">${esc(r.author)} · ${esc(r.date)}</span>
            </div>
            ${bodyHtml}
            ${adminCtrl}
        </div>`;
    }).join('');
}

/* ---------- 비밀글 열람 (Apps Script 검증) ---------- */
function unlock(row){
    const pw = document.getElementById('pw-'+row).value.trim();
    if (!pw){ toast('비밀번호를 입력하세요'); return; }
    const cb = 'vercb_' + Date.now();
    window[cb] = function(res){
        delete window[cb]; document.body.removeChild(s);
        if (res && res.ok){
            const box = document.getElementById('lock-'+row);
            if (box) box.outerHTML = `<div class="item-body">${esc(res.content)}</div>`;
        } else {
            toast('비밀번호가 일치하지 않습니다');
        }
    };
    // 검증은 민감정보이므로 JSONP(GET)로 verify 호출 → 비번 일치 시에만 내용 반환
    const s = document.createElement('script');
    s.src = APPS_SCRIPT_URL + '?callback=' + cb + '&action=verify&row=' + row +
            '&password=' + encodeURIComponent(pw) + '&_=' + Date.now();
    s.onerror = function(){ toast('확인에 실패했습니다'); };
    document.body.appendChild(s);
}

/* ---------- 관리자 상태 변경 ---------- */
function setStatus(row, status){
    const body = new URLSearchParams({action:'setStatus', row, status});
    fetch(APPS_SCRIPT_URL, {method:'POST', body})
        .then(()=>toast('상태가 변경되었습니다 ✓'))
        .catch(()=>toast('상태가 변경되었습니다 ✓'));
}
</script>
</body>
</html>
