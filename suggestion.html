<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>직원 제안 게시판 | HIQASC</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // 로그인 가드 (렌더 전 차단)
  (function () {
    if (sessionStorage.getItem('hiqasc_authenticated') !== 'true') {
      location.href = 'index.html';
    }
  })();
</script>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --line:#e3e6ea; --text:#2c2f33; --muted:#7b8189;
    --accent:#e8853a; --accent-soft:#fdf1e7;
    --danger:#d9534f; --warn:#e0a33e; --ok:#4a9d5f; --info:#4a90e2; --secret:#c79a3a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:24px;line-height:1.55}
  .wrap{max-width:1240px;margin:0 auto}

  /* 헤더 */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .title h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
  .title p{font-size:13px;color:var(--muted);margin-top:4px}
  .title p b{color:var(--accent);font-weight:700}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 16px;border-radius:8px;
       font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:#d5762c;border-color:#d5762c;color:#fff}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}

  /* 요약 */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .stat .k{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
  .stat .v{font-size:26px;font-weight:800;margin-top:6px}
  .stat.wait .v{color:var(--danger)} .stat.prop .v{color:var(--info)}
  .stat.hold .v{color:#8a72b0} .stat.done .v{color:var(--ok)}

  /* 카드 공통 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
  .card h2{font-size:15px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .card h2::before{content:'';width:4px;height:15px;background:var(--accent);border-radius:2px}

  /* 폼 */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1/-1}
  label{font-size:12px;font-weight:700;color:var(--muted)}
  input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--text);background:#fff;
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;transition:.15s;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  input:disabled{background:#f4f5f7;color:var(--muted);cursor:not-allowed}
  textarea{resize:vertical;min-height:100px}
  .form-foot{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:16px}
  .hint{font-size:12px;color:var(--muted);margin-right:auto}

  /* 비밀글 옵션 */
  .secret-opt{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:#fdfaf3;border:1px solid #f0e4cd;border-radius:8px;padding:12px 14px}
  .secret-opt .chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:#9a7420;cursor:pointer;user-select:none}
  .secret-opt input[type=checkbox]{width:17px;height:17px;accent-color:var(--secret);cursor:pointer}
  .secret-opt .pw{display:none;flex:1;min-width:180px}
  .secret-opt.on .pw{display:block}
  .secret-opt .note{font-size:12px;color:var(--muted)}
  .secret-opt.on .note{display:none}

  /* 필터 */
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}

  /* 목록 */
  .list{display:flex;flex-direction:column;gap:12px}
  .item{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:10px;background:#fff;overflow:hidden}
  .item.st-접수{border-left-color:var(--danger)}
  .item.st-검토중{border-left-color:var(--info)}
  .item.st-보류{border-left-color:#8a72b0}
  .item.st-반영{border-left-color:var(--ok)}
  .item-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 16px;cursor:pointer}
  .item-head:hover{background:#fafbfc}
  .subject{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px}
  .subject .lk{color:var(--secret);font-size:13px}
  .tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:#f0f2f4;color:var(--muted)}
  .tag.cat{background:var(--accent-soft);color:var(--accent)}
  .tag.st-접수{background:#fbeaea;color:var(--danger)}
  .tag.st-검토중{background:#e7f0fb;color:var(--info)}
  .tag.st-보류{background:#efeaf6;color:#7a5ca8}
  .tag.st-반영{background:#e9f5ec;color:var(--ok)}
  .tag.secret{background:#faf1da;color:#9a7420}
  .meta{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px}
  .chev{transition:.2s;color:var(--muted);font-size:12px}
  .item.open .chev{transform:rotate(90deg)}

  /* 상세(펼침) */
  .detail{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
  .item.open .detail{display:block}
  .content-box{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:13px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;margin-top:14px}

  /* 비밀글 잠금 (상세 내) */
  .locked{margin-top:14px;background:#fdfaf3;border:1px dashed #e6d3a8;border-radius:8px;padding:16px;text-align:center}
  .locked .lk-ico{font-size:22px}
  .locked .lk-txt{font-size:13px;color:#9a7420;font-weight:600;margin:6px 0 12px}
  .locked .lk-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .locked input{max-width:200px;text-align:center;letter-spacing:1px}
  .locked .btn-primary{background:var(--secret);border-color:var(--secret)}
  .locked .btn-primary:hover{background:#b3872f;border-color:#b3872f}

  /* 관리자 상태 변경 */
  .status-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .status-row .lb{font-size:11px;font-weight:700;color:var(--accent)}
  .status-row select{width:auto;min-width:130px}

  .empty{text-align:center;color:var(--muted);padding:36px;font-size:14px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:#2c2f33;color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:640px){body{padding:14px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">

  <div class="top">
    <div class="title">
      <h1>직원 제안 게시판</h1>
      <p>업무·복지·시설 등 개선 아이디어를 자유롭게 제안하세요 · 작성자 <b id="whoName">-</b></p>
    </div>
    <div class="top-actions">
      <button class="btn" onclick="loadData()">새로고침</button>
      <button class="btn" onclick="location.href='index.html'">메인</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">전체</div><div class="v" id="sTotal">-</div></div>
    <div class="stat wait"><div class="k">접수</div><div class="v" id="sWait">-</div></div>
    <div class="stat prop"><div class="k">검토중</div><div class="v" id="sProp">-</div></div>
    <div class="stat hold"><div class="k">보류</div><div class="v" id="sHold">-</div></div>
    <div class="stat done"><div class="k">반영</div><div class="v" id="sDone">-</div></div>
  </div>

  <!-- 신규 등록 -->
  <div class="card">
    <h2>새 제안 작성</h2>
    <div class="grid">
      <div class="field">
        <label>작성자</label>
        <input type="text" id="fWriter" disabled>
      </div>
      <div class="field">
        <label>분류</label>
        <select id="fCategory">
          <option>업무개선</option>
          <option>복지</option>
          <option>시설 · 장비</option>
          <option>프로세스 · 절차</option>
          <option>기타</option>
        </select>
      </div>
      <div class="field full">
        <label>제목 (한 줄 요약)</label>
        <input type="text" id="fTitle" maxlength="60" placeholder="예: 휴게실 정수기 온수 기능 추가 요청">
      </div>
      <div class="field full">
        <label>제안 내용</label>
        <textarea id="fContent" placeholder="어떤 점을 개선하면 좋을지 구체적으로 작성해주세요"></textarea>
      </div>
      <div class="secret-opt" id="secretOpt">
        <label class="chk"><input type="checkbox" id="fSecret" onchange="toggleSecret()">🔒 비밀글로 작성</label>
        <span class="note">작성자 본인 · 관리자 · 비밀번호를 아는 사람만 내용을 볼 수 있습니다</span>
        <input type="text" id="fSecretPw" class="pw" maxlength="20" placeholder="열람 비밀번호">
      </div>
    </div>
    <div class="form-foot">
      <span class="hint">등록 시 상태는 '접수'로 시작합니다</span>
      <button class="btn" onclick="resetForm()">지우기</button>
      <button class="btn btn-primary" id="btnSave" onclick="saveItem()">등록</button>
    </div>
  </div>

  <!-- 필터 -->
  <div class="card">
    <h2>조회</h2>
    <div class="filters">
      <div class="field"><label>상태</label><select id="qStatus" onchange="render()"><option value="">전체</option><option>접수</option><option>검토중</option><option>보류</option><option>반영</option></select></div>
      <div class="field"><label>분류</label><select id="qCategory" onchange="render()"><option value="">전체</option></select></div>
      <div class="field"><label>검색어</label><input type="text" id="qText" oninput="render()" placeholder="제목·작성자"></div>
    </div>
  </div>

  <!-- 목록 -->
  <div class="card">
    <h2>제안 목록 <span id="listCount" style="font-weight:600;color:var(--muted);font-size:13px"></span></h2>
    <div class="list" id="list"><div class="empty">불러오는 중…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===========================================================
   설정
   =========================================================== */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz_8DDIPMjbK9YlieHsj9Xxc5yXk55bpPN1RRQ06DOIxQo8GyalxfF9UwM9oMxOicRn/exec';

/* 관리자 비밀글 열람 마스터 키 — Apps Script 의 ADMIN_KEY 와 반드시 동일 */
const ADMIN_KEY = 'hiqasc-admin-2026';

const ME = {
  name: sessionStorage.getItem('userName') || '',
  id:   sessionStorage.getItem('userId') || '',
  isAdmin: sessionStorage.getItem('hiqasc_isAdmin') === 'true'
};

let ITEMS = [];
let openRow = null;   // 펼쳐진 항목 유지
let unlocked = {};    // 이번 세션에 비번으로 연 비밀글 내용 캐시 {row: content}

document.getElementById('whoName').textContent = ME.name || '알 수 없음';
document.getElementById('fWriter').value = ME.name || '';

/* ===========================================================
   유틸
   =========================================================== */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}

function toggleSecret(){
  document.getElementById('secretOpt').classList.toggle('on', document.getElementById('fSecret').checked);
}
function resetForm(){
  document.getElementById('fTitle').value='';
  document.getElementById('fContent').value='';
  document.getElementById('fSecretPw').value='';
  document.getElementById('fSecret').checked=false;
  toggleSecret();
}

/* ===========================================================
   로드 (JSONP — 비밀글 내용/비번은 서버에서 마스킹됨)
   =========================================================== */
function loadData(){
  document.getElementById('list').innerHTML='<div class="empty">불러오는 중…</div>';
  const cb='sugcb_'+Date.now();
  window[cb]=function(res){
    delete window[cb]; s.remove();
    ITEMS = (res && res.rows) ? res.rows : [];
    buildCategoryFilter();
    updateStats();
    render();
  };
  const s=document.createElement('script');
  let url=APPS_SCRIPT_URL+'?callback='+cb+'&_='+Date.now();
  if(ME.isAdmin) url+='&adminKey='+encodeURIComponent(ADMIN_KEY);
  if(ME.name)    url+='&viewer='+encodeURIComponent(ME.name);
  s.src=url;
  s.onerror=function(){document.getElementById('list').innerHTML='<div class="empty">목록을 불러오지 못했습니다</div>';};
  document.body.appendChild(s);
}

function updateStats(){
  const c={접수:0,검토중:0,보류:0,반영:0};
  ITEMS.forEach(r=>{if(c[r.status]!==undefined)c[r.status]++;});
  document.getElementById('sTotal').textContent=ITEMS.length;
  document.getElementById('sWait').textContent=c.접수;
  document.getElementById('sProp').textContent=c.검토중;
  document.getElementById('sHold').textContent=c.보류;
  document.getElementById('sDone').textContent=c.반영;
}

function buildCategoryFilter(){
  const sel=document.getElementById('qCategory');
  const cur=sel.value;
  const cats=[...new Set(ITEMS.map(r=>r.category).filter(Boolean))];
  sel.innerHTML='<option value="">전체</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');
  sel.value=cur;
}

/* ===========================================================
   렌더
   =========================================================== */
function render(){
  const qs=document.getElementById('qStatus').value;
  const qc=document.getElementById('qCategory').value;
  const qt=document.getElementById('qText').value.trim().toLowerCase();

  let rows=ITEMS.slice().reverse(); // 최신순
  if(qs) rows=rows.filter(r=>r.status===qs);
  if(qc) rows=rows.filter(r=>r.category===qc);
  if(qt) rows=rows.filter(r=>(r.title+' '+r.author).toLowerCase().includes(qt));

  const listEl=document.getElementById('list');
  document.getElementById('listCount').textContent=`(${rows.length}건)`;
  if(!rows.length){listEl.innerHTML='<div class="empty">해당하는 제안이 없습니다</div>';return;}

  listEl.innerHTML=rows.map(r=>{
    // 서버가 권한에 맞게 content를 내려줌: 비밀글인데 content가 비어있으면 잠금 상태
    const hasContent = (r.content !== '' && r.content != null);
    const unlockedContent = unlocked[r.row];
    const canSee = !r.secret || hasContent || unlockedContent !== undefined;
    const content = hasContent ? r.content : (unlockedContent || '');

    let detailInner;
    if(canSee){
      detailInner=`<div class="content-box">${esc(content)||'<span style="color:var(--muted)">(내용 없음)</span>'}</div>`;
    }else{
      detailInner=`
        <div class="locked">
          <div class="lk-ico">🔒</div>
          <div class="lk-txt">비밀글입니다. 열람하려면 비밀번호를 입력하세요.</div>
          <div class="lk-row">
            <input type="text" id="pw-${r.row}" placeholder="비밀번호" onkeypress="if(event.key==='Enter')unlock(${r.row})">
            <button class="btn btn-primary" onclick="unlock(${r.row})">열람</button>
          </div>
        </div>`;
    }

    const adminCtrl = ME.isAdmin ? `
      <div class="status-row">
        <span class="lb">관리자 · 상태 변경</span>
        <select onchange="setStatus(${r.row}, this.value)" onclick="event.stopPropagation()">
          ${['접수','검토중','보류','반영'].map(st=>`<option ${st===r.status?'selected':''}>${st}</option>`).join('')}
        </select>
      </div>` : '';

    const open = openRow===r.row ? ' open' : '';
    return `
    <div class="item st-${esc(r.status)}${open}" data-row="${r.row}">
      <div class="item-head" onclick="toggleOpen(${r.row})">
        <span class="subject">${r.secret?'<span class="lk">🔒</span>':''}${esc(r.title)}</span>
        <span class="tag cat">${esc(r.category)}</span>
        <span class="tag st-${esc(r.status)}">${esc(r.status)}</span>
        ${r.secret?'<span class="tag secret">비밀글</span>':''}
        <span class="meta">${esc(r.author)} · ${esc(r.date)}<span class="chev">▶</span></span>
      </div>
      <div class="detail">
        ${detailInner}
        ${adminCtrl}
      </div>
    </div>`;
  }).join('');
}

function toggleOpen(row){
  openRow = (openRow===row) ? null : row;
  render();
}

/* ===========================================================
   등록
   =========================================================== */
function saveItem(){
  const title=document.getElementById('fTitle').value.trim();
  const content=document.getElementById('fContent').value.trim();
  const category=document.getElementById('fCategory').value;
  const secret=document.getElementById('fSecret').checked;
  const pw=document.getElementById('fSecretPw').value.trim();

  if(!title){toast('제목을 입력하세요');return;}
  if(!content){toast('내용을 입력하세요');return;}
  if(secret&&!pw){toast('비밀글 열람 비밀번호를 입력하세요');return;}

  const btn=document.getElementById('btnSave');
  btn.disabled=true;btn.textContent='등록 중…';

  const body=new URLSearchParams({
    action:'create',author:ME.name,userId:ME.id,
    category,title,content,
    secret:secret?'1':'0',password:secret?pw:''
  });

  fetch(APPS_SCRIPT_URL,{method:'POST',body})
    .then(finishSave).catch(finishSave);

  function finishSave(){
    toast('제안이 등록되었습니다 ✓');
    resetForm();
    btn.disabled=false;btn.textContent='등록';
    setTimeout(loadData,600);
  }
}

/* ===========================================================
   비밀글 열람 (Apps Script 검증)
   =========================================================== */
function unlock(row){
  const pw=document.getElementById('pw-'+row).value.trim();
  if(!pw){toast('비밀번호를 입력하세요');return;}
  const cb='vercb_'+Date.now();
  window[cb]=function(res){
    delete window[cb]; s.remove();
    if(res&&res.ok){
      unlocked[row]=res.content;
      openRow=row;
      render();
    }else{
      toast('비밀번호가 일치하지 않습니다');
    }
  };
  const s=document.createElement('script');
  s.src=APPS_SCRIPT_URL+'?callback='+cb+'&action=verify&row='+row+'&password='+encodeURIComponent(pw)+'&_='+Date.now();
  s.onerror=function(){toast('확인에 실패했습니다');};
  document.body.appendChild(s);
}

/* ===========================================================
   관리자 상태 변경
   =========================================================== */
function setStatus(row,status){
  const item=ITEMS.find(r=>r.row===row); if(item)item.status=status;
  updateStats();
  const body=new URLSearchParams({action:'setStatus',row,status});
  fetch(APPS_SCRIPT_URL,{method:'POST',body})
    .then(()=>toast('상태가 변경되었습니다 ✓'))
    .catch(()=>toast('상태가 변경되었습니다 ✓'));
}

/* 시작 */
loadData();
</script>
</body>
</html>
