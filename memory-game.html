<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐱 기억력 카드 게임</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Press Start 2P', monospace;
            background: #0a0e1a;
            color: #eaeaea;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .hud {
            width: 100%; max-width: 520px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 16px;
        }
        .hud-item { font-size: 9px; color: #f7b731; display: flex; align-items: center; gap: 5px; }
        .hud-value { font-size: 13px; color: #fff; }

        .level-title {
            font-size: 11px; color: #4a90e2; margin: 8px 0 12px;
            text-align: center; letter-spacing: 2px;
        }

        .card-grid {
            display: grid;
            gap: 8px;
            padding: 0 12px;
            max-width: 520px;
            width: 100%;
        }

        .card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #1a2040, #162030);
            border: 2px solid #2a3a5a;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, border-color 0.3s;
            position: relative;
            overflow: hidden;
        }

        .card:hover:not(.flipped):not(.matched) {
            border-color: #4a90e2;
            transform: scale(1.03);
        }

        .card.flipped {
            border-color: #f7b731;
            background: linear-gradient(135deg, #1a2a3a, #1a3040);
        }

        .card.matched {
            border-color: #27ae60;
            background: linear-gradient(135deg, #0a2a1a, #0a3020);
            opacity: 0.7;
        }

        .card.wrong {
            border-color: #e74c3c;
            animation: cardShake 0.4s ease;
        }

        @keyframes cardShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .card canvas {
            image-rendering: pixelated;
        }

        .card-back {
            font-size: 1.6em;
        }

        /* 오버레이 */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5,8,16,0.92);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; gap: 14px;
        }
        .overlay.hidden { display: none; }
        .overlay-title { font-size: 22px; color: #f7b731; text-shadow: 2px 2px 0 #e94560; text-align: center; line-height: 1.8; }
        .overlay-sub { font-size: 12px; color: #8892a8; text-align: center; line-height: 2.4; max-width: 460px; }
        .overlay-score { font-size: 26px; color: #f7b731; margin: 8px 0; }
        .overlay-btn {
            margin-top: 8px; padding: 14px 32px;
            background: linear-gradient(135deg, #e94560, #c0392b);
            border: none; color: #fff; font-family: 'Press Start 2P', monospace;
            font-size: 10px; border-radius: 8px; cursor: pointer;
        }
        .overlay-btn:hover { transform: scale(1.05); }

        .back-link {
            position: fixed; top: 14px; left: 14px; padding: 6px 14px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; color: #8892a8; text-decoration: none; font-size: 8px; z-index: 200;
        }

        /* 레벨 클리어 이펙트 */
        .level-clear {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            font-size: 20px; color: #f7b731; text-shadow: 2px 2px 0 #e94560;
            z-index: 50; pointer-events: none; opacity: 0;
        }
        .level-clear.show {
            animation: levelClearAnim 1.5s ease forwards;
        }
        @keyframes levelClearAnim {
            0% { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
            30% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%,-50%) scale(1) translateY(-30px); }
        }

        .combo-text {
            position: fixed; top: 40%; left: 50%; transform: translateX(-50%);
            font-size: 14px; z-index: 50; pointer-events: none; opacity: 0;
        }
        .combo-text.show {
            animation: comboAnim 0.8s ease forwards;
        }
        @keyframes comboAnim {
            0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
            30% { opacity: 1; transform: translateX(-50%) scale(1.1); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
    </style>
</head>
<body>

<a href="developer.html" class="back-link">← 돌아가기</a>

<div class="hud">

<div class="level-title" id="levelTitle">LEVEL 1 — 2쌍</div>
<div class="card-grid" id="cardGrid"></div>

<div class="combo-text" id="comboText"></div>

<!-- 시작 -->
<div class="overlay" id="startOverlay">

        레벨이 올라갈수록 카드가 늘어나요<br><br>
        🐱 덴데 · 🐱 부우 · 🐟 츄르 · 🎣 낚싯대<br>
        ⛺ 텐트 · 🔥 모닥불 · 🌙 달 · ⭐ 별<br>
        🌿 캣닢 · ☕ 커피 · 👑 왕관 · 🎀 리본<br><br>
        연속 매칭 시 콤보 보너스!
    </div>
    <button class="overlay-btn" onclick="startGame()">시작!</button>
</div>

<!-- 게임 오버 / 결과 -->
<div class="overlay hidden" id="resultOverlay">

const LEVELS = [
    { pairs: 2, cols: 2, name: '워밍업', time: 30 },
    { pairs: 3, cols: 3, name: '쉬운', time: 40 },
    { pairs: 4, cols: 4, name: '보통', time: 50 },
    { pairs: 6, cols: 4, name: '어려운', time: 60 },
    { pairs: 8, cols: 4, name: '도전', time: 70 },
    { pairs: 10, cols: 5, name: '고수', time: 80 },
    { pairs: 12, cols: 4, name: '달인', time: 90 },
];

// ============================================
// 게임 상태
// ============================================
let level, score, moves, combo, cards, flippedCards, matchedCount, locked, timer, timeLeft;

function startGame() {
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('resultOverlay').classList.add('hidden');
    level = 0; score = 0; moves = 0; combo = 0;
    updateHUD();
    loadLevel();
}

function loadLevel() {
    if (level >= LEVELS.length) {
        // 전부 클리어!
        showResult('🏆 전 레벨 클리어!', score + '점', '모든 레벨을 클리어했습니다! 대단해요!');
        return;
    }

    var lv = LEVELS[level];
    var pairs = lv.pairs;
    matchedCount = 0;
    flippedCards = [];
    locked = false;
    combo = 0;

    document.getElementById('hudLevel').textContent = level + 1;
    document.getElementById('levelTitle').textContent = 'LEVEL ' + (level+1) + ' — ' + lv.name + ' (' + pairs + '쌍)';

    // 사용할 카드 타입 선택 (랜덤)
    var shuffledTypes = CARD_TYPES.slice().sort(function() { return Math.random() - 0.5; });
    var selectedTypes = shuffledTypes.slice(0, pairs);

    // 카드 배열 (짝으로)
    cards = [];
    selectedTypes.forEach(function(type) {
        cards.push({ type: type, flipped: false, matched: false });
        cards.push({ type: type, flipped: false, matched: false });
    });

    // 셔플
    for (var i = cards.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = cards[i]; cards[i] = cards[j]; cards[j] = tmp;
    }

    // 그리드 생성
    var grid = document.getElementById('cardGrid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = 'repeat(' + lv.cols + ', 1fr)';

    cards.forEach(function(card, idx) {
        var div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = '<div class="card-back">🐾</div>';
        div.onclick = function() { flipCard(idx, div); };
        card.el = div;

        // 미리 캔버스 준비 (숨김)
        var cvs = document.createElement('canvas');
        var csize = lv.cols >= 5 ? 40 : lv.cols >= 4 ? 50 : 60;
        cvs.width = csize; cvs.height = csize;
        cvs.style.display = 'none';
        cvs.style.imageRendering = 'pixelated';
        var cctx = cvs.getContext('2d');
        cctx.imageSmoothingEnabled = false;
        var pxSize = Math.floor(csize / 12);
        card.type.draw(cctx, pxSize);
        card.canvas = cvs;
        div.appendChild(cvs);

        grid.appendChild(div);
    });

    // 잠깐 보여주기 (미리보기)
    var previewTime = Math.max(1500, 3000 - level * 300);
    cards.forEach(function(card) {
        card.el.classList.add('flipped');
        card.el.querySelector('.card-back').style.display = 'none';
        card.canvas.style.display = 'block';
    });
    locked = true;
    setTimeout(function() {
        cards.forEach(function(card) {
            card.el.classList.remove('flipped');
            card.el.querySelector('.card-back').style.display = '';
            card.canvas.style.display = 'none';
        });
        locked = false;
    }, previewTime);

    // 타이머
    timeLeft = lv.time;
    if (timer) clearInterval(timer);
    document.getElementById('hudTime').textContent = timeLeft;
    timer = setInterval(function() {
        timeLeft--;
        document.getElementById('hudTime').textContent = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(timer);
            showResult('⏰ 시간 초과!', score + '점', 'LEVEL ' + (level+1) + '에서 시간이 다 됐어요!');
        }
    }, 1000);

    updateHUD();
}

function flipCard(idx, div) {
    if (locked) return;
    var card = cards[idx];
    if (card.flipped || card.matched) return;

    // 뒤집기
    card.flipped = true;
    div.classList.add('flipped');
    div.querySelector('.card-back').style.display = 'none';
    card.canvas.style.display = 'block';

    flippedCards.push(idx);

    if (flippedCards.length === 2) {
        moves++;
        document.getElementById('hudMoves').textContent = moves;
        locked = true;

        var c1 = cards[flippedCards[0]];
        var c2 = cards[flippedCards[1]];

        if (c1.type.id === c2.type.id) {
            // 매칭 성공!
            combo++;
            var comboBonus = Math.min(combo, 5);
            var points = 10 * comboBonus * (level + 1);
            score += points;

            setTimeout(function() {
                c1.matched = true; c2.matched = true;
                c1.el.classList.add('matched');
                c2.el.classList.add('matched');
                matchedCount += 2;
                flippedCards = [];
                locked = false;

                // 콤보 표시
                if (combo >= 2) {
                    showCombo(combo, comboBonus);
                }

                // 레벨 클리어 체크
                if (matchedCount >= cards.length) {
                    clearInterval(timer);
                    var timeBonus = timeLeft * 5;
                    score += timeBonus;
                    updateHUD();

                    var el = document.getElementById('levelClear');
                    el.textContent = '🎉 LEVEL ' + (level+1) + ' CLEAR! +' + timeBonus + ' 시간보너스';
                    el.className = 'level-clear';
                    void el.offsetWidth;
                    el.className = 'level-clear show';

                    setTimeout(function() {
                        level++;
                        loadLevel();
                    }, 2000);
                }
            }, 300);
        } else {
            // 매칭 실패
            combo = 0;
            setTimeout(function() {
                c1.el.classList.add('wrong');
                c2.el.classList.add('wrong');
                setTimeout(function() {
                    c1.flipped = false; c2.flipped = false;
                    c1.el.classList.remove('flipped', 'wrong');
                    c2.el.classList.remove('flipped', 'wrong');
                    c1.el.querySelector('.card-back').style.display = '';
                    c2.el.querySelector('.card-back').style.display = '';
                    c1.canvas.style.display = 'none';
                    c2.canvas.style.display = 'none';
                    flippedCards = [];
                    locked = false;
                }, 500);
            }, 400);
        }
    }

    updateHUD();
}

function showCombo(combo, bonus) {
    var el = document.getElementById('comboText');
    var colors = ['#f7b731', '#e74c3c', '#9b59b6', '#e74c3c', '#f7b731'];
    el.textContent = '🔥 ' + combo + ' COMBO! x' + bonus;
    el.style.color = colors[Math.min(combo-1, 4)];
    el.className = 'combo-text';
    void el.offsetWidth;
    el.className = 'combo-text show';
}

function showResult(title, scoreText, msg) {
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultScore').textContent = scoreText;
    document.getElementById('resultMsg').textContent = msg;
    document.getElementById('resultOverlay').classList.remove('hidden');
    if (timer) clearInterval(timer);
}

function updateHUD() {
    document.getElementById('hudScore').textContent = score;
}
</script>
</body>
</html>
