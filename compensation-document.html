<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보상판매 문서 생성 - HIQASC</title>
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #5dade2 0%, #3498db 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(93, 173, 226, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #ecf0f1;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group label::before {
            content: "▪";
            margin-right: 5px;
            color: #95a5a6;
        }

        .required {
            color: #e74c3c;
            margin-left: 3px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background-color: #fafafa;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #95a5a6;
            box-shadow: 0 0 0 3px rgba(149, 165, 166, 0.1);
            background-color: white;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(44, 62, 80, 0.4);
        }

        .submit-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background-color: #d5f4e6;
            color: #27ae60;
            border: 1px solid #a8e6cf;
        }

        .message.success::before {
            content: "✓ ";
            font-weight: bold;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #ecf0f1;
            border-top: 3px solid #2c3e50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .signature {
            text-align: center;
            margin-top: 30px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #bdc3c7;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://donggukang09.github.io/hiqasc-platform/" class="back-button">← 메인으로</a>
        
        <div class="header">
            <h1>📄 보상판매 문서 생성</h1>
            <p>정보를 입력하면 자동으로 문서가 생성됩니다</p>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #7f8c8d;">문서 생성 중...</p>
        </div>

        <form id="compensationForm">
            <div class="form-group">
                <label>회원번호 <span class="required">*</span></label>
                <input type="text" id="memberNumber" required placeholder="예: 7768395">
            </div>

            <div class="form-group">
                <label>회원명 <span class="required">*</span></label>
                <input type="text" id="memberName" required placeholder="예: 구승주">
            </div>

            <div class="form-group">
                <label>모델명 <span class="required">*</span></label>
                <input type="text" id="model" required placeholder="예: GCV6WH">
            </div>

            <div class="form-group">
                <label>시리얼 번호 <span class="required">*</span></label>
                <input type="text" id="serialNumber" required placeholder="예: 25308CV6g244374207N">
            </div>

            <div class="form-group">
                <label>내용 <span class="required">*</span></label>
                <select id="content" required>
                    <option value="">선택하세요</option>
                    <option value="보상판매">보상판매</option>
                    <option value="환불요청">환불요청</option>
                </select>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                문서 생성 및 다운로드
            </button>
        </form>

        <div id="message" class="message"></div>

        <div class="signature">DEVELOPED BY DONGGU KANG</div>
    </div>

    <script>
        const form = document.getElementById('compensationForm');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const messageDiv = document.getElementById('message');

            // 버튼 비활성화 및 로딩 표시
            submitBtn.disabled = true;
            loading.style.display = 'block';
            messageDiv.style.display = 'none';

            // 폼 데이터 수집
            const memberNumber = document.getElementById('memberNumber').value;
            const memberName = document.getElementById('memberName').value;
            const model = document.getElementById('model').value;
            const serialNumber = document.getElementById('serialNumber').value;
            const content = document.getElementById('content').value;

            try {
                // docx 문서 생성
                const doc = new docx.Document({
                    sections: [{
                        properties: {
                            page: {
                                size: {
                                    width: 12240,   // US Letter width
                                    height: 15840   // US Letter height
                                },
                                margin: {
                                    top: 1440,
                                    right: 1440,
                                    bottom: 1440,
                                    left: 1440
                                }
                            }
                        },
                        children: [
                            // 첫 번째 줄: #회원번호_회원명님
                            new docx.Paragraph({
                                children: [
                                    new docx.TextRun({
                                        text: `#${memberNumber}_${memberName}님 `,
                                        font: "맑은 고딕",
                                        size: 24
                                    })
                                ],
                                spacing: { after: 200 }
                            }),
                            // 두 번째 줄: 모델명
                            new docx.Paragraph({
                                children: [
                                    new docx.TextRun({
                                        text: model,
                                        font: "맑은 고딕",
                                        size: 24
                                    })
                                ],
                                spacing: { after: 200 }
                            }),
                            // 세 번째 줄: 시리얼 번호
                            new docx.Paragraph({
                                children: [
                                    new docx.TextRun({
                                        text: serialNumber,
                                        font: "맑은 고딕",
                                        size: 24
                                    })
                                ],
                                spacing: { after: 200 }
                            }),
                            // 네 번째 줄: 내용
                            new docx.Paragraph({
                                children: [
                                    new docx.TextRun({
                                        text: content,
                                        font: "맑은 고딕",
                                        size: 24
                                    })
                                ],
                                spacing: { after: 400 }
                            }),
                            // 빈 줄
                            new docx.Paragraph({
                                children: [],
                                spacing: { after: 200 }
                            }),
                            // 다섯 번째 줄: 태은물류 출고
                            new docx.Paragraph({
                                children: [
                                    new docx.TextRun({
                                        text: "태은물류 출고",
                                        font: "맑은 고딕",
                                        size: 24
                                    })
                                ]
                            })
                        ]
                    }]
                });

                // 문서를 Blob으로 변환
                const blob = await docx.Packer.toBlob(doc);

                // 파일명 생성
                const fileName = `보상판매_${memberNumber}_${memberName}.docx`;

                // 다운로드
                saveAs(blob, fileName);

                // 성공 메시지
                showMessage('문서가 성공적으로 생성되었습니다!', 'success');

                // 폼 초기화
                setTimeout(() => {
                    form.reset();
                }, 1500);

            } catch (error) {
                console.error('문서 생성 오류:', error);
                alert('문서 생성 중 오류가 발생했습니다: ' + error.message);
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';

            setTimeout(function() {
                messageDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
