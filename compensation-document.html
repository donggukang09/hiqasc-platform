<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보상판매 문서 생성 - HIQASC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #5dade2 0%, #3498db 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(93, 173, 226, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #ecf0f1;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group label::before {
            content: "▪";
            margin-right: 5px;
            color: #95a5a6;
        }

        .required {
            color: #e74c3c;
            margin-left: 3px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background-color: #fafafa;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #95a5a6;
            box-shadow: 0 0 0 3px rgba(149, 165, 166, 0.1);
            background-color: white;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(44, 62, 80, 0.4);
        }

        .signature {
            text-align: center;
            margin-top: 30px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #bdc3c7;
            letter-spacing: 1px;
        }

        /* ============================================ */
        /* 출력 화면 스타일 */
        /* ============================================ */
        .output-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #2a2a2a;
            z-index: 9999;
            overflow: auto;
        }

        .output-screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .output-controls {
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .control-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .print-btn {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
        }

        .print-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        .close-btn {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .close-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
        }

        .output-paper {
            width: 297mm;  /* A4 가로 */
            min-height: 210mm;  /* A4 가로 */
            background: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            padding: 30mm 40mm;
        }

        .output-content {
            font-family: '맑은 고딕', 'Malgun Gothic', sans-serif;
            font-size: 28pt;
            line-height: 2.2;
            color: #000;
            border: 3px solid #000;
            padding: 30px 40px;
            min-height: 150mm;
        }

        .output-content div {
            margin-bottom: 20px;
        }

        .output-content .empty-line {
            margin-bottom: 40px;
        }

        /* 인쇄 스타일 */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            body > * {
                display: none !important;
            }

            .output-screen {
                display: block !important;
                position: static !important;
                background: white;
                padding: 0;
            }

            .output-controls {
                display: none !important;
            }

            .output-paper {
                width: 100%;
                min-height: auto;
                box-shadow: none;
                padding: 20mm 25mm;
                margin: 0;
            }

            .output-content {
                font-size: 28pt;
                line-height: 2.2;
                border: 3px solid #000;
                padding: 30px 40px;
            }

            @page {
                size: A4 landscape;  /* A4 가로 */
                margin: 0;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 22px;
            }

            .output-paper {
                width: 100%;
                padding: 20px;
            }

            .output-content {
                font-size: 20pt;
            }
        }
    </style>
</head>
<body>
    <!-- 입력 폼 화면 -->
    <div class="container" id="inputForm">
        <a href="document-output-main.html" class="back-button">← 문서 출력 시스템으로</a>
        
        <div class="header">
            <h1>📄 보상판매 문서 생성</h1>
            <p>정보를 입력하면 출력 화면이 표시됩니다</p>
        </div>

        <form id="compensationForm">
            <div class="form-group">
                <label>회원번호 <span class="required">*</span></label>
                <input type="text" id="memberNumber" required placeholder="예: 7768395">
            </div>

            <div class="form-group">
                <label>회원명 <span class="required">*</span></label>
                <input type="text" id="memberName" required placeholder="예: 구승주">
            </div>

            <div class="form-group">
                <label>모델명 <span class="required">*</span></label>
                <input type="text" id="model" required placeholder="예: GCV6WH">
            </div>

            <div class="form-group">
                <label>시리얼 번호 <span class="required">*</span></label>
                <input type="text" id="serialNumber" required placeholder="예: 25308CV6g244374207N">
            </div>

            <div class="form-group">
                <label>내용 <span class="required">*</span></label>
                <select id="content" required>
                    <option value="">선택하세요</option>
                    <option value="보상판매">보상판매</option>
                    <option value="환불요청">환불요청</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">
                출력 화면 보기
            </button>
        </form>

        <div class="signature">DEVELOPED BY DONGGU KANG</div>
    </div>

    <!-- 출력 화면 -->
    <div class="output-screen" id="outputScreen">
        <div class="output-controls">
            <button class="control-btn print-btn" onclick="printDocument()">🖨️ 인쇄하기</button>
            <button class="control-btn close-btn" onclick="closeOutput()">← 돌아가기</button>
        </div>
        
        <div class="output-paper">
            <div class="output-content" id="outputContent">
                <!-- 여기에 내용이 동적으로 삽입됩니다 -->
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('compensationForm');
        const outputScreen = document.getElementById('outputScreen');
        const outputContent = document.getElementById('outputContent');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // 폼 데이터 수집
            const memberNumber = document.getElementById('memberNumber').value;
            const memberName = document.getElementById('memberName').value;
            const model = document.getElementById('model').value;
            const serialNumber = document.getElementById('serialNumber').value;
            const content = document.getElementById('content').value;

            // 출력 내용 생성
            outputContent.innerHTML = `
                <div>#${memberNumber}_${memberName}님 </div>
                <div>${model}</div>
                <div>${serialNumber}</div>
                <div>${content}</div>
                <div class="empty-line"></div>
                <div>태은물류 출고</div>
            `;

            // 입력 폼 숨기기
            document.getElementById('inputForm').style.display = 'none';
            
            // 출력 화면 표시
            outputScreen.classList.add('active');
        });

        function printDocument() {
            window.print();
        }

        function closeOutput() {
            outputScreen.classList.remove('active');
            document.getElementById('inputForm').style.display = 'block';
        }

        // ESC 키로 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && outputScreen.classList.contains('active')) {
                closeOutput();
            }
        });
    </script>
    <script src="hiq-notification.js?v=2"></script>
</body>
</html>
