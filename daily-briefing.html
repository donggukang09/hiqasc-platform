<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데일리 브리핑 - HIQASC</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
    --bg:#0c0c14;--card:#16161f;--border:#232333;--border-hover:#2e2e44;
    --text:#e4e4ef;--text-sub:#7a7a95;
    --blue:#4a90e2;--blue-glow:rgba(74,144,226,0.15);
    --green:#34d399;--green-glow:rgba(52,211,153,0.15);
    --orange:#fbbf24;--orange-glow:rgba(251,191,36,0.15);
    --red:#f87171;--red-glow:rgba(248,113,113,0.15);
    --purple:#a78bfa;--purple-glow:rgba(167,139,250,0.15);
    --cyan:#22d3ee;--cyan-glow:rgba(34,211,238,0.15);
    --radius:16px;
}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

.bg-grad{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 30% 0%,rgba(74,144,226,0.06) 0%,transparent 50%),radial-gradient(ellipse at 70% 100%,rgba(167,139,250,0.04) 0%,transparent 50%);pointer-events:none;z-index:0;}

/* HEADER */
.header{position:relative;z-index:10;background:rgba(16,16,25,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;}
.header h1{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:700;color:var(--blue);letter-spacing:3px;}
.header .date-text{color:var(--text-sub);font-size:13px;margin-left:16px;}
.header-left{display:flex;align-items:center;}
.header-actions{display:flex;gap:8px;}
.hdr-btn{background:rgba(255,255,255,0.04);color:var(--text-sub);border:1px solid var(--border);padding:7px 14px;border-radius:8px;font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.25s;text-decoration:none;}
.hdr-btn:hover{background:rgba(255,255,255,0.08);color:var(--text);}

/* PREP */
#prepPhase{position:relative;z-index:10;max-width:620px;margin:50px auto;padding:0 20px;transition:opacity 0.5s,transform 0.5s;}
#prepPhase.hide{opacity:0;transform:translateY(-20px) scale(0.98);pointer-events:none;position:absolute;}
.prep-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:36px;position:relative;overflow:hidden;}
.prep-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--purple),var(--cyan));}
.prep-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--blue);margin-bottom:4px;}
.prep-sub{font-size:12px;color:var(--text-sub);margin-bottom:24px;}
.prep-label{font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:6px;display:block;}
.prep-input,.prep-textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-family:'Manrope',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color 0.3s,box-shadow 0.3s;}
.prep-input:focus,.prep-textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-glow);}
.prep-input::placeholder,.prep-textarea::placeholder{color:#3a3a50;}
.prep-textarea{min-height:70px;resize:vertical;}
.prep-row{display:flex;gap:12px;margin-bottom:16px;}
.prep-col{flex:1;}
.prep-section{margin-bottom:16px;}
.prep-section-title{font-size:11px;font-weight:700;color:var(--purple);letter-spacing:1px;margin-bottom:10px;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
.prep-section-title::before{content:'';flex:1;height:1px;background:var(--border);}
.prep-section-title::after{content:'';flex:1;height:1px;background:var(--border);}
.prep-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;}
.btn-execute{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;padding:12px 32px;background:linear-gradient(135deg,var(--blue),#3574d0);color:#fff;border:none;border-radius:10px;cursor:pointer;transition:transform 0.2s,box-shadow 0.3s;}
.btn-execute:hover{transform:translateY(-1px);box-shadow:0 6px 24px var(--blue-glow);}
.btn-skip{background:transparent;color:var(--text-sub);border:1px solid var(--border);padding:12px 18px;border-radius:10px;font-family:'Manrope',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.btn-skip:hover{background:rgba(255,255,255,0.03);}
.prep-hint{text-align:center;margin-top:20px;font-size:11px;color:var(--text-sub);opacity:0.5;}

/* LOADING */
.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:500;display:none;align-items:center;justify-content:center;flex-direction:column;}
.loading-overlay.active{display:flex;}
.load-ring{width:60px;height:60px;position:relative;margin-bottom:32px;}
.load-ring::before,.load-ring::after{content:'';position:absolute;border-radius:50%;}
.load-ring::before{top:0;left:0;width:100%;height:100%;border:2px solid var(--border);}
.load-ring::after{top:0;left:0;width:100%;height:100%;border:2px solid transparent;border-top-color:var(--blue);border-right-color:var(--blue);animation:ringR 1s cubic-bezier(0.5,0,0.5,1) infinite;}
@keyframes ringR{to{transform:rotate(360deg);}}
.load-ring-inner{position:absolute;top:10px;left:10px;right:10px;bottom:10px;border-radius:50%;border:2px solid transparent;border-bottom-color:var(--purple);border-left-color:var(--purple);animation:ringR 1.5s cubic-bezier(0.5,0,0.5,1) infinite reverse;}
.load-title{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:600;letter-spacing:3px;color:var(--blue);margin-bottom:12px;}
.load-msg{font-size:13px;color:var(--text-sub);min-height:20px;}
.load-dots{display:flex;gap:6px;margin-top:24px;}
.load-dots span{width:5px;height:5px;border-radius:50%;background:var(--blue);opacity:0.2;animation:dotP 1.4s ease-in-out infinite;}
.load-dots span:nth-child(2){animation-delay:0.2s;}
.load-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes dotP{0%,80%,100%{opacity:0.2;transform:scale(1);}40%{opacity:1;transform:scale(1.4);}}

/* DASHBOARD */
#dashPhase{position:relative;z-index:10;display:none;padding:28px;max-width:1320px;margin:0 auto;}
#dashPhase.active{display:block;}

.dash-title-area{text-align:center;margin-bottom:28px;opacity:0;transition:opacity 0.5s;}
.dash-title-area.show{opacity:1;}
.dash-title{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:800;letter-spacing:6px;color:var(--blue);margin-bottom:6px;}
.dash-date{font-size:14px;color:var(--text-sub);letter-spacing:1px;}

/* MOSAIC */
.mosaic{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:320px auto 200px;
    grid-template-areas:
        "intake intake chart chart"
        "remain att    att   att"
        "sched  sched  notice notice";
    gap:16px;
}

.m-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;position:relative;overflow:hidden;transition:all 0.35s ease;cursor:default;}
.m-card:hover{border-color:var(--border-hover);transform:translateY(-3px);}
.m-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity 0.35s;}
.m-card:hover::before{opacity:1;}

.m-card.glow-blue:hover{box-shadow:0 12px 40px var(--blue-glow);}
.m-card.glow-blue::before{background:linear-gradient(90deg,var(--blue),transparent);}
.m-card.glow-green:hover{box-shadow:0 12px 40px var(--green-glow);}
.m-card.glow-green::before{background:linear-gradient(90deg,var(--green),transparent);}
.m-card.glow-orange:hover{box-shadow:0 12px 40px var(--orange-glow);}
.m-card.glow-orange::before{background:linear-gradient(90deg,var(--orange),transparent);}
.m-card.glow-purple:hover{box-shadow:0 12px 40px var(--purple-glow);}
.m-card.glow-purple::before{background:linear-gradient(90deg,var(--purple),transparent);}
.m-card.glow-cyan:hover{box-shadow:0 12px 40px var(--cyan-glow);}
.m-card.glow-cyan::before{background:linear-gradient(90deg,var(--cyan),transparent);}
.m-card.glow-red:hover{box-shadow:0 12px 40px var(--red-glow);}
.m-card.glow-red::before{background:linear-gradient(90deg,var(--red),transparent);}

.area-intake{grid-area:intake;}
.area-chart{grid-area:chart;}
.area-remain{grid-area:remain;}
.area-att{grid-area:att;}
.area-sched{grid-area:sched;}
.area-notice{grid-area:notice;}

.card-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.card-label{font-size:17px;font-weight:800;}
.card-big{font-family:'Orbitron',sans-serif;font-size:42px;font-weight:800;line-height:1;margin-bottom:6px;}
.card-unit{font-size:13px;font-weight:600;color:var(--text-sub);}
.card-detail{font-size:12px;color:var(--text-sub);margin-top:8px;line-height:1.7;}

.icon-blue{background:var(--blue-glow);color:var(--blue);}
.icon-green{background:var(--green-glow);color:var(--green);}
.icon-orange{background:var(--orange-glow);color:var(--orange);}
.icon-red{background:var(--red-glow);color:var(--red);}
.icon-purple{background:var(--purple-glow);color:var(--purple);}
.icon-cyan{background:var(--cyan-glow);color:var(--cyan);}
.label-blue{color:var(--blue);}.label-green{color:var(--green);}.label-orange{color:var(--orange);}
.label-red{color:var(--red);}.label-purple{color:var(--purple);}.label-cyan{color:var(--cyan);}
.val-blue{color:var(--blue);}.val-green{color:var(--green);}.val-orange{color:var(--orange);}
.val-red{color:var(--red);}.val-purple{color:var(--purple);}.val-cyan{color:var(--cyan);}

.trend-badge{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;}
.trend-up{background:rgba(248,113,113,0.12);color:var(--red);}
.trend-down{background:rgba(52,211,153,0.12);color:var(--green);}
.trend-same{background:rgba(251,191,36,0.12);color:var(--orange);}

/* Chart bars */
.chart-area{display:flex;align-items:flex-end;gap:12px;padding:8px 0;height:180px;}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;}
.chart-counts{display:flex;gap:8px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;flex-shrink:0;}
.chart-dual-bar{display:flex;gap:3px;width:100%;flex:1;align-items:flex-end;}
.chart-bar{flex:1;border-radius:4px 4px 0 0;min-height:24px;transition:height 0.8s ease;background:rgba(74,144,226,0.25);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;}
.chart-bar.today{background:var(--blue);box-shadow:0 0 12px var(--blue-glow);}
.chart-bar.bar-complete{background:rgba(52,211,153,0.25);}
.bar-label-inner{font-size:10px;font-weight:700;color:rgba(255,255,255,0.5);writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:1px;}
.chart-bar.today .bar-label-inner{color:rgba(255,255,255,0.8);}
.chart-date{font-size:14px;font-weight:700;color:var(--text-sub);text-align:center;line-height:1.3;flex-shrink:0;}

/* Attendance */
.att-grid{display:flex;gap:20px;margin-top:8px;}
.att-team{flex:1;background:rgba(255,255,255,0.02);border-radius:10px;padding:14px;border:1px solid var(--border);}
.att-team-name{font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:8px;letter-spacing:0.5px;}
.att-count{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:800;margin-bottom:2px;}
.att-count-unit{font-size:11px;color:var(--text-sub);}
.leave-section{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.leave-title{font-size:12px;font-weight:700;color:var(--orange);margin-bottom:8px;}
.leave-person{display:inline-flex;align-items:center;gap:4px;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.15);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--orange);margin:3px 4px 3px 0;}

/* Announce */
.announce-body{font-size:14px;line-height:1.9;color:var(--text);white-space:pre-wrap;}
.announce-empty{color:var(--text-sub);font-size:13px;}

/* SLAM ANIMATION */
.slam-item{opacity:0;transform:scale(1.6);filter:blur(6px);transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);}
.slam-item.slam-in{opacity:1;transform:scale(1);filter:blur(0);}

/* Shake */
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-3px);}75%{transform:translateX(3px);}}
.shake{animation:shake 0.15s ease;}

/* Responsive */
@media(max-width:1000px){
    .mosaic{grid-template-columns:1fr 1fr;grid-template-rows:auto;grid-template-areas:"intake intake" "chart chart" "remain att" "att att" "sched notice";}
}
@media(max-width:600px){
    .mosaic{grid-template-columns:1fr;grid-template-areas:"intake" "chart" "remain" "att" "sched" "notice";}
    .header{padding:14px 16px;flex-wrap:wrap;gap:8px;}
    .header h1{font-size:13px;}
    #dashPhase{padding:16px;}
    .card-big{font-size:32px;}
    .att-grid{flex-direction:column;gap:10px;}
}
</style>
</head>
<body>
<div class="bg-grad"></div>

<div class="header">
    <div class="header-left">
        <h1>DAILY BRIEFING</h1>
        <span class="date-text" id="headerDate"></span>
    </div>
    <div class="header-actions">
        <button class="hdr-btn" id="btnRefresh" style="display:none" onclick="refreshData()">↻ 새로고침</button>
        <a class="hdr-btn" href="index.html">← 홈</a>
    </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="load-ring"><div class="load-ring-inner"></div></div>
    <div class="load-title">BRIEFING</div>
    <div class="load-msg" id="loadMsg">시스템 데이터 수집 중</div>
    <div class="load-dots"><span></span><span></span><span></span></div>
</div>

<!-- PREP -->
<div id="prepPhase">
    <div class="prep-card">
        <div class="prep-title">DAILY BRIEFING</div>
        <div class="prep-sub">입고량 · 근태는 자동 수집됩니다. 아래 항목을 입력 후 실행하세요.</div>

        <div class="prep-section">
            <div class="prep-section-title">수량 입력</div>
            <div class="prep-col">
                <label class="prep-label">전일 잔여 수량 (대)</label>
                <input type="number" class="prep-input" id="inputRemain" placeholder="어제 미수리 잔여 대수" min="0">
            </div>
        </div>

        <div class="prep-section">
            <div class="prep-section-title">공지사항</div>
            <div style="margin-bottom:12px;">
                <label class="prep-label">📅 업무 종료 후 일정</label>
                <textarea class="prep-textarea" id="inputSchedule" placeholder="예: 17:30 전체 회의 / 18:00 회식"></textarea>
            </div>
            <div>
                <label class="prep-label">📌 전달사항</label>
                <textarea class="prep-textarea" id="inputNotice" placeholder="중요 공지사항을 입력하세요"></textarea>
            </div>
        </div>

        <div class="prep-actions">
            <button class="btn-skip" onclick="startBriefing(true)">건너뛰기</button>
            <button class="btn-execute" onclick="startBriefing(false)">LAUNCH</button>
        </div>
    </div>
    <div class="prep-hint">Google Sheets 실시간 연동</div>
</div>

<!-- DASHBOARD -->
<div id="dashPhase">
    <div class="dash-title-area" id="dashTitle">
        <h1 class="dash-title">DAILY BRIEFING</h1>
        <p class="dash-date" id="dashDate"></p>
    </div>
    <div class="mosaic" id="mosaicGrid"></div>
</div>

<script>
const SHEET_IDS = {
    main: '111K9l8gt-14roqvynNFEJrT2aLsTYjU8gQBsKNiyFmI',
    leave: '1cmMEbIkmEL629RT04hpUUgXddnSVLGo1YwRzBwfyzCY',
    team: '1chkSEnFSheStqwSrL0mtR8lgFz1_7bnpYPgVbNQgAfE'
};

const cache = Date.now();
const now = new Date();
const dayNames = ['일','월','화','수','목','금','토'];
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const todayStr = fmtDate(now);
const yesterday = new Date(now);
yesterday.setDate(yesterday.getDate()-1);
while(yesterday.getDay()===0||yesterday.getDay()===6) yesterday.setDate(yesterday.getDate()-1);
const yesterdayStr = fmtDate(yesterday);
document.getElementById('headerDate').textContent = now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0')+' ('+dayNames[now.getDay()]+')';

// GVIZ
let cbIdx=0;
function loadGviz(sheetId,tabName,query,cbName){
    return new Promise(resolve=>{
        const cb=cbName||('gv_'+(cbIdx++));
        const url=`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json;responseHandler:${cb}&sheet=${encodeURIComponent(tabName)}&tq=${encodeURIComponent(query)}&_=${cache}`;
        window[cb]=function(r){
            try{resolve(r.status==='error'?[]:(r.table.rows||[]));}catch(e){resolve([]);}
            delete window[cb];const el=document.getElementById('s_'+cb);if(el)el.remove();
        };
        const s=document.createElement('script');s.id='s_'+cb;s.src=url;s.onerror=()=>resolve([]);
        document.body.appendChild(s);
    });
}
function getCellVal(row,idx){if(!row.c||!row.c[idx])return '';const c=row.c[idx];return c.f||(c.v!=null?String(c.v):'');}
function getRawVal(row,idx){return(row.c&&row.c[idx])?row.c[idx].v:null;}
function parseGvizDate(row,idx){const cell=row.c&&row.c[idx];if(!cell||!cell.v)return '';const v=String(cell.v);const m=v.match(/Date\((\d+),(\d+),(\d+)\)/);if(m)return m[1]+'-'+String(parseInt(m[2])+1).padStart(2,'0')+'-'+String(parseInt(m[3])).padStart(2,'0');return cell.f||v;}
function normalizeDate(s){if(!s)return '';s=String(s);const g=s.match(/Date\((\d+),(\d+),(\d+)\)/);if(g)return g[1]+'-'+String(parseInt(g[2])+1).padStart(2,'0')+'-'+String(parseInt(g[3])).padStart(2,'0');const d=s.match(/(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})/);if(d)return d[1]+'-'+d[2].padStart(2,'0')+'-'+d[3].padStart(2,'0');return s;}

// DATA
let brief={
    todayIntake:0,yesterdayIntake:0,trendDiff:0,
    recentIntake:[],avg5:0,avg5Complete:0,
    remain:0,
    teams:{as:{members:[],count:0},support:{members:[],count:0},admin:{members:[],count:0}},
    leaveNames:[],totalMembers:0,totalPresent:0,
    schedule:'',notice:''
};

const loadMsgs=['시트 데이터 수집 중','입고량 분석 중','근태 현황 확인 중','브리핑 준비 완료'];
let loadMsgTimer=null,loadMsgIdx=0;
function startLoadMsgs(){loadMsgIdx=0;document.getElementById('loadMsg').textContent=loadMsgs[0];loadMsgTimer=setInterval(()=>{if(++loadMsgIdx<loadMsgs.length)document.getElementById('loadMsg').textContent=loadMsgs[loadMsgIdx];},800);}
function stopLoadMsgs(){clearInterval(loadMsgTimer);document.getElementById('loadMsg').textContent=loadMsgs[loadMsgs.length-1];}

// FETCH
async function fetchAllData(){
    startLoadMsgs();
    await Promise.all([fetchIntake(),fetchCompletion(),fetchTeamMembers(),fetchLeave()]);
    mergeCompletionData();
    calcAttendance();
    stopLoadMsgs();
}

async function fetchIntake(){
    const weekAgo=new Date(now);weekAgo.setDate(weekAgo.getDate()-10);
    const rows=await loadGviz(SHEET_IDS.main,'주간입고',`SELECT AW, COUNT(X) WHERE AW >= date '${fmtDate(weekAgo)}' GROUP BY AW ORDER BY AW`);
    const dateMap={};
    rows.forEach(row=>{const d=parseGvizDate(row,0);if(d)dateMap[d]=Number(getRawVal(row,1))||0;});
    brief.todayIntake=dateMap[todayStr]||0;
    brief.yesterdayIntake=dateMap[yesterdayStr]||0;
    brief.trendDiff=brief.todayIntake-brief.yesterdayIntake;
    const bizDays=[],t=new Date(now);
    for(let i=0;i<5;i++){
        while(t.getDay()===0||t.getDay()===6)t.setDate(t.getDate()-1);
        const ds=fmtDate(t);
        const dayLabel=dayNames[t.getDay()];
        bizDays.unshift({date:ds,count:dateMap[ds]||0,complete:0,label:(t.getMonth()+1)+'/'+t.getDate(),day:dayLabel});
        t.setDate(t.getDate()-1);
    }
    brief.recentIntake=bizDays;
    brief.avg5=bizDays.length>0?Math.round(bizDays.reduce((s,d)=>s+d.count,0)/bizDays.length):0;
}

async function fetchCompletion(){
    const weekAgo=new Date(now);weekAgo.setDate(weekAgo.getDate()-10);
    const rows=await loadGviz(SHEET_IDS.main,'주간마감',`SELECT AU, COUNT(AU) WHERE AU >= date '${fmtDate(weekAgo)}' GROUP BY AU ORDER BY AU`);
    brief._completionMap={};
    rows.forEach(row=>{const d=parseGvizDate(row,0);if(d)brief._completionMap[d]=Number(getRawVal(row,1))||0;});
}

function mergeCompletionData(){
    const cm=brief._completionMap||{};
    brief.recentIntake.forEach(day=>{day.complete=cm[day.date]||0;});
    brief.avg5Complete=brief.recentIntake.length>0?Math.round(brief.recentIntake.reduce((s,d)=>s+d.complete,0)/brief.recentIntake.length):0;
}

async function fetchTeamMembers(){
    const [asRows,supRows,admRows]=await Promise.all([
        loadGviz(SHEET_IDS.team,'AS팀_인원','SELECT A','cb_as'),
        loadGviz(SHEET_IDS.team,'지원팀_인원','SELECT A','cb_sup'),
        loadGviz(SHEET_IDS.team,'관리팀_인원','SELECT A','cb_adm')
    ]);
    brief.teams.as.members=[];brief.teams.support.members=[];brief.teams.admin.members=[];
    asRows.forEach(r=>{const n=getCellVal(r,0);if(n)brief.teams.as.members.push(n);});
    supRows.forEach(r=>{const n=getCellVal(r,0);if(n)brief.teams.support.members.push(n);});
    admRows.forEach(r=>{const n=getCellVal(r,0);if(n)brief.teams.admin.members.push(n);});
    brief.teams.as.count=brief.teams.as.members.length;
    brief.teams.support.count=brief.teams.support.members.length;
    brief.teams.admin.count=brief.teams.admin.members.length;
    brief.totalMembers=brief.teams.as.count+brief.teams.support.count+brief.teams.admin.count;
}

async function fetchLeave(){
    const rows=await loadGviz(SHEET_IDS.leave,'연차신청',"SELECT B, E, F, I WHERE I = '승인'",'cb_lv');
    const onLeave=new Set();
    rows.forEach(row=>{
        const name=getCellVal(row,0);
        const s=normalizeDate(row.c&&row.c[1]?(row.c[1].f||getCellVal(row,1)):'');
        const e=normalizeDate(row.c&&row.c[2]?(row.c[2].f||getCellVal(row,2)):'');
        if(name&&s&&e&&s<=todayStr&&e>=todayStr)onLeave.add(name);
    });
    brief.leaveNames=[...onLeave];
}

function calcAttendance(){
    const leave=new Set(brief.leaveNames);
    ['as','support','admin'].forEach(key=>{
        const team=brief.teams[key];
        team.onLeave=team.members.filter(m=>leave.has(m));
        team.present=team.count-team.onLeave.length;
    });
    brief.totalPresent=brief.totalMembers-brief.leaveNames.length;
}

// ANIMATION
function animNum(el,target,dur=900){
    const start=performance.now();
    const update=t=>{const p=Math.min((t-start)/dur,1);el.textContent=Math.round(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(update);};
    requestAnimationFrame(update);
}

// SLAM SEQUENCE
function runSlamSequence(callback){
    const grid=document.getElementById('mosaicGrid');
    const cards=grid.querySelectorAll('.m-card');
    cards.forEach(c=>c.classList.add('slam-item'));

    const dash=document.getElementById('dashPhase');
    dash.classList.add('active');

    // Title first
    const titleArea=document.getElementById('dashTitle');
    setTimeout(()=>titleArea.classList.add('show'),100);

    // Slam cards one by one
    cards.forEach((card,i)=>{
        setTimeout(()=>{
            card.classList.add('slam-in');
            // subtle shake on land
            card.addEventListener('transitionend',function handler(){
                card.classList.add('shake');
                setTimeout(()=>card.classList.remove('shake'),150);
                card.removeEventListener('transitionend',handler);
            },{once:true});
            // animate numbers
            const v=card.querySelector('.card-big[data-count]');
            if(v)animNum(v,parseInt(v.dataset.count),800);
        },400+i*280);
    });

    // done
    setTimeout(callback,400+cards.length*280+400);
}

// START
function startBriefing(skip){
    brief.remain=parseInt(document.getElementById('inputRemain').value)||0;
    brief.schedule=skip?'':document.getElementById('inputSchedule').value;
    brief.notice=skip?'':document.getElementById('inputNotice').value;

    document.getElementById('prepPhase').classList.add('hide');
    document.getElementById('loadingOverlay').classList.add('active');

    fetchAllData().then(()=>{
        setTimeout(()=>{
            document.getElementById('loadingOverlay').classList.remove('active');
            document.getElementById('prepPhase').style.display='none';
            document.getElementById('btnRefresh').style.display='';
            buildDashboard();
            runSlamSequence(()=>{});
        },400);
    });
}

function refreshData(){
    document.getElementById('loadingOverlay').classList.add('active');
    fetchAllData().then(()=>{
        setTimeout(()=>{
            document.getElementById('loadingOverlay').classList.remove('active');
            buildDashboard();
            // instant show on refresh
            document.getElementById('mosaicGrid').querySelectorAll('.m-card').forEach(c=>{c.classList.remove('slam-item');});
        },300);
    });
}

// BUILD
function buildDashboard(){
    const grid=document.getElementById('mosaicGrid');
    const d=brief;

    document.getElementById('dashDate').textContent=now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+dayNames[now.getDay()]+'요일';

    // 브리핑 확인 기록
    localStorage.setItem('hiq_briefing_seen', todayStr);

    let trendBadge='';
    if(d.trendDiff>0)trendBadge=`<span class="trend-badge trend-up">▲ +${d.trendDiff}</span>`;
    else if(d.trendDiff<0)trendBadge=`<span class="trend-badge trend-down">▼ ${d.trendDiff}</span>`;
    else trendBadge=`<span class="trend-badge trend-same">― 동일</span>`;

    const maxI=Math.max(...d.recentIntake.map(r=>r.count),1);
    const maxC=Math.max(...d.recentIntake.map(r=>r.complete||0),1);

    // Leave tags
    const funReactions=['좋겠다! 😎','부럽다~ 🏖️','잘 쉬어! ✌️','꿀휴가 🍯','럭키비키 🍀'];
    const leaveTags=d.leaveNames.map((name,i)=>{
        const react=funReactions[i%funReactions.length];
        return `<span class="leave-person">${name} <span style="opacity:0.7;font-size:11px;">${react}</span></span>`;
    }).join('');

    // Team attendance
    const teams=d.teams;

    grid.innerHTML=`
        <!-- 1. 입고량 -->
        <div class="m-card area-intake glow-blue">
            <div class="card-top">
                <div class="card-icon icon-blue">📦</div>
                <div class="card-label label-blue">오늘 입고량</div>
            </div>
            <div class="card-big val-blue" style="font-size:64px;margin:12px 0;" data-count="${d.todayIntake}">0</div>
            <div class="card-unit" style="font-size:15px;">대 ${trendBadge}</div>
            <div class="card-detail">전일 대비 ${d.trendDiff>0?'+':''}${d.trendDiff}대 · 5일 평균 ${d.avg5}대</div>
        </div>

        <!-- 2. 5일 입고/완료 그래프 -->
        <div class="m-card area-chart glow-cyan">
            <div class="card-top">
                <div class="card-icon icon-cyan">📊</div>
                <div class="card-label label-cyan">최근 5일 입고 / 완료</div>
            </div>
            <div class="chart-area" id="chartArea">
                ${d.recentIntake.map(r=>{
                    const maxVal=Math.max(maxI,maxC,1);
                    const iH=Math.max(24,Math.round((r.count/maxVal)*110));
                    const cH=Math.max(24,Math.round((r.complete/maxVal)*110));
                    const isToday=r.date===todayStr;
                    return `<div class="chart-bar-wrap">
                        <div class="chart-counts">
                            <span style="color:${isToday?'var(--blue)':'var(--text-sub)'};font-weight:${isToday?800:600};">${r.count}</span>
                            <span style="color:var(--green);font-weight:600;">${r.complete}</span>
                        </div>
                        <div class="chart-dual-bar">
                            <div class="chart-bar ${isToday?'today':''}" style="height:${iH}px"><span class="bar-label-inner">입고</span></div>
                            <div class="chart-bar bar-complete" style="height:${cH}px"><span class="bar-label-inner">완료</span></div>
                        </div>
                        <div class="chart-date" ${isToday?'style="color:var(--blue);font-weight:800;"':''}>${r.label} (${r.day})</div>
                    </div>`;
                }).join('')}
            </div>
            <div style="text-align:right;margin-top:6px;">
                <span style="font-size:12px;color:var(--text-sub);">5일 평균 — 입고 ${d.avg5}대 · 완료 ${d.avg5Complete||0}대</span>
            </div>
        </div>

        <!-- 3. 전일 잔여 -->
        <div class="m-card area-remain glow-orange">
            <div class="card-top">
                <div class="card-icon icon-orange">📋</div>
                <div class="card-label label-orange">전일 잔여</div>
            </div>
            <div class="card-big val-orange" style="font-size:52px;margin:12px 0;" data-count="${d.remain}">0</div>
            <div class="card-unit">대 미수리 이월</div>
            <div class="card-detail">오늘 처리 필요: ${d.todayIntake+d.remain}대</div>
        </div>

        <!-- 4. 근태 현황 -->
        <div class="m-card area-att glow-purple">
            <div class="card-top">
                <div class="card-icon icon-purple">👥</div>
                <div class="card-label label-purple">근태 현황</div>
                <div style="margin-left:auto;font-size:13px;color:var(--text-sub);">총원 <strong style="color:var(--text);">${d.totalMembers}</strong>명 · 출근 <strong style="color:var(--green);">${d.totalPresent}</strong>명</div>
            </div>
            <div class="att-grid">
                <div class="att-team">
                    <div class="att-team-name" style="color:var(--blue);">🔧 AS팀</div>
                    <div class="att-count val-blue">${teams.as.present}</div>
                    <div class="att-count-unit">/ ${teams.as.count}명</div>
                </div>
                <div class="att-team">
                    <div class="att-team-name" style="color:var(--green);">📦 지원팀</div>
                    <div class="att-count val-green">${teams.support.present}</div>
                    <div class="att-count-unit">/ ${teams.support.count}명</div>
                </div>
                <div class="att-team">
                    <div class="att-team-name" style="color:var(--orange);">📊 관리팀</div>
                    <div class="att-count val-orange">${teams.admin.present}</div>
                    <div class="att-count-unit">/ ${teams.admin.count}명</div>
                </div>
            </div>
            ${d.leaveNames.length>0?`
            <div class="leave-section">
                <div class="leave-title">🏝️ 오늘의 행운아</div>
                <div>${leaveTags}</div>
            </div>`:'<div class="leave-section" style="border-top:1px solid var(--border);padding-top:12px;margin-top:12px;"><span style="font-size:13px;color:var(--green);font-weight:700;">✨ 전원 출근! 오늘도 화이팅!</span></div>'}
        </div>

        <!-- 5. 종료 후 일정 -->
        <div class="m-card area-sched glow-green">
            <div class="card-top">
                <div class="card-icon icon-green">📅</div>
                <div class="card-label label-green">종료 후 일정</div>
            </div>
            <div class="announce-body">${d.schedule||'<span class="announce-empty">등록된 일정이 없습니다</span>'}</div>
        </div>

        <!-- 6. 전달사항 -->
        <div class="m-card area-notice glow-red">
            <div class="card-top">
                <div class="card-icon icon-red">📌</div>
                <div class="card-label label-red">전달사항</div>
            </div>
            <div class="announce-body">${d.notice||'<span class="announce-empty">등록된 전달사항이 없습니다</span>'}</div>
        </div>
    `;
}

document.getElementById('inputSchedule').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.ctrlKey)startBriefing(false);
});
document.getElementById('inputNotice').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.ctrlKey)startBriefing(false);
});
</script>
