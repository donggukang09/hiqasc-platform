<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소모품 신청 및 재고 | HIQASC</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: #2a2a2a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px 40px;
        }

        /* ============================================ */
        /* 상단 헤더 */
        /* ============================================ */
        .hub-header {
            text-align: center;
            margin-bottom: 36px;
            animation: fadeInDown 0.6s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hub-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .hub-brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #27ae60 0%, #219a52 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.25);
        }

        .hub-brand-text {
            font-size: 1.6em;
            font-weight: 700;
            color: #ffffff;
        }

        .hub-subtitle {
            color: #808080;
            font-size: 0.95em;
        }

        /* ============================================ */
        /* 섹션 라벨 */
        /* ============================================ */
        .workspace-section {
            width: 100%;
            max-width: 900px;
            animation: fadeInUp 0.6s ease 0.15s both;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .section-label-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #4a4a4a, transparent);
        }

        .section-label-text {
            color: #27ae60;
            font-size: 0.85em;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label-text::before {
            content: '◆';
            color: #27ae60;
        }

        /* ============================================ */
        /* 패널 */
        /* ============================================ */
        .workspace-panel {
            background: linear-gradient(135deg, #2e3f35 0%, #353535 60%);
            border: 1px solid #3d6050;
            border-radius: 20px;
            padding: 22px 28px 26px;
            position: relative;
            overflow: hidden;
        }

        .workspace-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #27ae60, #2ecc71, #27ae60);
        }

        .workspace-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .workspace-title-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .workspace-title-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #27ae60 0%, #219a52 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.25);
        }

        .workspace-title h3 {
            color: #ffffff;
            font-size: 1.15em;
            font-weight: 700;
            margin-bottom: 1px;
        }

        .workspace-title p {
            color: #a0a0a0;
            font-size: 0.78em;
        }

        .workspace-tag {
            background: rgba(39, 174, 96, 0.12);
            border: 1px solid rgba(39, 174, 96, 0.35);
            color: #27ae60;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.78em;
            font-weight: 600;
        }

        /* ============================================ */
        /* 메뉴 아이템 */
        /* ============================================ */
        .workspace-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .workspace-item {
            background: #2c2c2c;
            border: 1px solid #4a4a4a;
            border-radius: 12px;
            padding: 26px 22px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .workspace-item:hover {
            transform: translateY(-4px);
            border-color: #27ae60;
            background: #2c3830;
            box-shadow: 0 8px 20px rgba(39, 174, 96, 0.18);
        }

        .workspace-item-icon {
            width: 48px;
            height: 48px;
            background: #3a3a3a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .workspace-item:hover .workspace-item-icon {
            background: linear-gradient(135deg, #27ae60 0%, #219a52 100%);
            transform: scale(1.05);
        }

        .workspace-item-body {
            flex: 1;
            min-width: 0;
        }

        .workspace-item-name {
            color: #ffffff;
            font-size: 1.02em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .workspace-item-desc {
            color: #808080;
            font-size: 0.78em;
            line-height: 1.5;
        }

        .workspace-item-arrow {
            color: #5a5a5a;
            font-size: 1.1em;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .workspace-item:hover .workspace-item-arrow {
            color: #27ae60;
            transform: translateX(3px);
        }

        /* ============================================ */
        /* 하단 */
        /* ============================================ */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 28px;
            padding: 10px 20px;
            background: #2c2c2c;
            border: 1px solid #4a4a4a;
            border-radius: 10px;
            color: #909090;
            text-decoration: none;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease 0.3s both;
        }

        .back-link:hover {
            border-color: #7ba8b8;
            color: #ffffff;
            background: #2c3438;
        }

        @media (max-width: 700px) {
            body { padding: 35px 16px 30px; }
            .workspace-panel { padding: 20px 18px 22px; }
            .workspace-grid { grid-template-columns: 1fr; }
            .hub-brand-text { font-size: 1.35em; }
        }
    </style>
</head>
<body>
    <div class="hub-header">
        <div class="hub-brand">
            <div class="hub-brand-icon">🧰</div>
            <div class="hub-brand-text">소모품 신청 및 재고</div>
        </div>
        <div class="hub-subtitle">소모품 신청과 실시간 재고 현황을 한 곳에서 관리합니다</div>
    </div>

    <div class="workspace-section">
        <div class="section-label">
            <div class="section-label-line"></div>
            <span class="section-label-text">Supplies · 소모품 관리</span>
            <div class="section-label-line"></div>
        </div>

        <div class="workspace-panel">
            <div class="workspace-header">
                <div class="workspace-title-group">
                    <div class="workspace-title-icon">📦</div>
                    <div class="workspace-title">
                        <h3>메뉴 선택</h3>
                        <p>이용하실 기능을 선택하세요</p>
                    </div>
                </div>
                <span class="workspace-tag">SUPPLIES</span>
            </div>

            <div class="workspace-grid">
                <div class="workspace-item" onclick="go('supplies-request.html')">
                    <div class="workspace-item-icon">📝</div>
                    <div class="workspace-item-body">
                        <div class="workspace-item-name">소모품 신청</div>
                        <div class="workspace-item-desc">필요한 품목 선택 후<br>수량 입력하여 신청</div>
                    </div>
                    <div class="workspace-item-arrow">→</div>
                </div>

                <div class="workspace-item" onclick="go('consumables-inventory.html')">
                    <div class="workspace-item-icon">📊</div>
                    <div class="workspace-item-body">
                        <div class="workspace-item-name">소모품 재고 리스트</div>
                        <div class="workspace-item-desc">실시간 재고 현황 및<br>품목별 수량·상태 확인</div>
                    </div>
                    <div class="workspace-item-arrow">→</div>
                </div>
            </div>
        </div>
    </div>

    <a href="https://donggukang09.github.io/hiqasc-platform/" class="back-link">← 메인으로 돌아가기</a>

    <script src="hiq-notification.js?v=2"></script>
    <script>
        function go(url) {
            window.location.href = url;
        }
    </script>
</body>
</html>
