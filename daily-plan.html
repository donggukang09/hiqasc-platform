<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데일리 플랜 - HIQASC</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Manrope', sans-serif;
            background: #f0f4f8;
            color: #1a202c;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8e 50%, #3b7dd8 100%);
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(30, 58, 95, 0.3);
        }

        .header h1 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 span.icon { font-size: 26px; }

        .header-right { display: flex; align-items: center; gap: 10px; }

        .home-btn, .pdf-btn {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 18px;
            border-radius: 8px;
            font-family: 'Manrope', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .home-btn:hover, .pdf-btn:hover { background: rgba(255,255,255,0.25); }

        .pdf-btn { background: rgba(220, 38, 38, 0.7); border-color: rgba(220, 38, 38, 0.5); }
        .pdf-btn:hover { background: rgba(220, 38, 38, 0.9); }

        .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }

        .top-controls { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }

        .date-display {
            background: #fff; border-radius: 12px; padding: 12px 20px;
            font-size: 16px; font-weight: 700; color: #1e3a5f;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex; align-items: center; gap: 8px;
        }

        .input-group {
            background: #fff; border-radius: 12px; padding: 10px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex; align-items: center; gap: 10px;
        }

        .input-group label { font-size: 14px; font-weight: 600; color: #4a5568; white-space: nowrap; }

        .input-group input {
            width: 90px; padding: 8px 12px; border: 2px solid #e2e8f0; border-radius: 8px;
            font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 700;
            color: #1e3a5f; text-align: center; outline: none; transition: border-color 0.2s;
        }

        .input-group input:focus { border-color: #3b7dd8; }
        .input-group .unit { font-size: 14px; font-weight: 600; color: #718096; }

        .apply-btn {
            background: linear-gradient(135deg, #2d5a8e, #3b7dd8); color: #fff; border: none;
            padding: 10px 24px; border-radius: 8px; font-family: 'Manrope', sans-serif;
            font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s;
        }

        .apply-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,125,216,0.4); }

        .reset-btn {
            background: #fee2e2; color: #dc2626; border: none; padding: 10px 16px;
            border-radius: 8px; font-family: 'Manrope', sans-serif; font-size: 13px;
            font-weight: 700; cursor: pointer; transition: all 0.2s;
        }

        .reset-btn:hover { background: #fecaca; }

        .plan-section {
            background: #fff; border-radius: 16px; padding: 24px;
            margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .section-title {
            font-size: 15px; font-weight: 700; color: #4a5568;
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }

        .section-title .badge {
            font-size: 11px; font-weight: 700; padding: 3px 10px;
            border-radius: 20px; color: #fff;
        }

        .badge-blue { background: linear-gradient(135deg, #2d5a8e, #3b7dd8); }
        .badge-green { background: linear-gradient(135deg, #2b8a3e, #38b249); }
        .badge-orange { background: linear-gradient(135deg, #4338ca, #6366f1); }

        .timeline-wrapper { position: relative; margin-top: 8px; }

        .time-axis { display: flex; position: relative; height: 28px; margin-bottom: 4px; }

        .time-label {
            position: absolute; font-size: 11px; font-weight: 700; color: #94a3b8;
            transform: translateX(-50%); top: 0;
        }

        .time-tick {
            position: absolute; width: 1px; height: 10px; background: #cbd5e1;
            top: 18px; transform: translateX(-50%);
        }

        .bar-track {
            position: relative; height: 56px; background: #f1f5f9;
            border-radius: 12px; overflow: hidden; margin-bottom: 6px;
        }

        .bar-segment {
            position: absolute; top: 4px; height: 48px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            color: #fff; font-weight: 700; transition: all 0.4s ease; overflow: hidden;
        }

        .bar-segment .seg-count { font-size: 18px; font-weight: 800; line-height: 1.1; }
        .bar-segment .seg-label { font-size: 10px; font-weight: 600; opacity: 0.85; }

        .seg-morning { background: linear-gradient(135deg, #3b82f6, #60a5fa); }
        .seg-afternoon1 { background: linear-gradient(135deg, #2563eb, #3b82f6); }
        .seg-afternoon2 { background: linear-gradient(135deg, #1d4ed8, #2563eb); }
        .seg-evening { background: linear-gradient(135deg, #1e40af, #1d4ed8); }
        .seg-lunch {
            background: repeating-linear-gradient(45deg, #e2e8f0, #e2e8f0 5px, #f1f5f9 5px, #f1f5f9 10px);
            top: 4px; height: 48px; border-radius: 0;
        }
        .lunch-label { font-size: 11px; font-weight: 700; color: #94a3b8; }

        .bar-segment.predict-bar {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            box-shadow: 0 2px 10px rgba(34,197,94,0.3);
        }
        .predict-bar .seg-count { font-size: 16px; }

        .predict-marker {
            position: absolute; top: -8px; bottom: -8px; width: 3px;
            background: #dc2626; border-radius: 3px; z-index: 10; transition: left 0.4s ease;
        }

        .predict-marker::after {
            content: attr(data-label); position: absolute; top: -22px; left: 50%;
            transform: translateX(-50%); font-size: 11px; font-weight: 800; color: #dc2626;
            white-space: nowrap; background: #fff; padding: 2px 6px; border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        .activity-track {
            position: relative; height: 56px; background: #f1f5f9;
            border-radius: 12px; overflow: visible; display: flex;
        }

        .activity-slot {
            flex: 1; height: 100%; border-right: 1px solid #e2e8f0; position: relative;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; overflow: hidden;
        }

        .activity-slot:first-child { border-radius: 12px 0 0 12px; }
        .activity-slot:last-child { border-radius: 0 12px 12px 0; border-right: none; }
        .activity-slot:hover { background: #e2e8f0; }

        .activity-slot.filled { background: linear-gradient(135deg, #2563eb, #3b82f6); cursor: pointer; }
        .activity-slot.filled:hover { background: linear-gradient(135deg, #1d4ed8, #2563eb); }

        .activity-slot.disabled { background: #dbeafe; cursor: not-allowed; opacity: 0.4; }

        .activity-slot .slot-text {
            font-size: 12px; font-weight: 800; color: #fff;
            text-align: center; padding: 2px 4px; line-height: 1.2; word-break: keep-all;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .activity-slot .slot-placeholder { font-size: 18px; color: #cbd5e1; }
        .activity-slot.disabled .slot-placeholder { display: none; }

        .activity-time-labels { display: flex; margin-top: 4px; }
        .activity-time-labels span { flex: 1; text-align: center; font-size: 10px; font-weight: 600; color: #94a3b8; }

        .summary-row { display: flex; gap: 16px; margin-top: 20px; flex-wrap: wrap; }

        .summary-card {
            flex: 1; min-width: 180px; background: #f8fafc; border: 1px solid #e2e8f0;
            border-radius: 12px; padding: 16px; text-align: center;
        }

        .summary-card .sc-label { font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 4px; }
        .summary-card .sc-value { font-size: 24px; font-weight: 800; color: #1e3a5f; }
        .summary-card .sc-value.green { color: #16a34a; }
        .summary-card .sc-value.blue { color: #2563eb; }
        .summary-card .sc-value.orange { color: #ea580c; }

        .legend-row { display: flex; gap: 20px; margin-top: 8px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #64748b; }
        .legend-dot { width: 12px; height: 12px; border-radius: 4px; }

        /* ═══ 2페이지: 상세 내역 ═══ */
        .page2-section { margin-top: 10px; }

        .detail-cards-title {
            font-size: 13px; font-weight: 700; color: #94a3b8;
            margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
        }

        .detail-cards { display: flex; flex-direction: column; gap: 12px; }

        .detail-card { background: #f8fafc; border: 1px solid #dbeafe; border-radius: 14px; overflow: hidden; transition: box-shadow 0.2s; }
        .detail-card:hover { box-shadow: 0 2px 12px rgba(37,99,235,0.08); }

        .detail-card-header {
            display: flex; align-items: center; gap: 12px; padding: 16px 20px;
            background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff;
        }

        .detail-card-header .dc-time {
            font-size: 12px; font-weight: 800; background: rgba(255,255,255,0.3);
            padding: 4px 12px; border-radius: 6px; white-space: nowrap;
        }

        .detail-card-header .dc-title { font-size: 16px; font-weight: 800; flex: 1; text-shadow: 0 1px 2px rgba(0,0,0,0.15); }

        .detail-card-header .dc-remove-btn {
            background: rgba(255,255,255,0.2); border: none; color: #fff;
            width: 28px; height: 28px; border-radius: 8px; font-size: 16px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }

        .detail-card-header .dc-remove-btn:hover { background: rgba(255,255,255,0.4); }

        .detail-card-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }

        .detail-field { display: flex; flex-direction: column; gap: 6px; }
        .detail-field label { font-size: 13px; font-weight: 700; color: #475569; display: flex; align-items: center; gap: 5px; }

        .detail-field textarea {
            width: 100%; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 10px;
            font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 500; color: #1e293b;
            resize: vertical; min-height: 60px; outline: none; transition: border-color 0.2s; line-height: 1.5;
        }

        .detail-field textarea:focus { border-color: #3b7dd8; }

        .detail-field input[type="text"] {
            width: 100%; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 10px;
            font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 600; color: #1e293b;
            outline: none; transition: border-color 0.2s;
        }

        .detail-field input[type="text"]:focus { border-color: #3b7dd8; }

        .no-activity-msg { text-align: center; padding: 24px; color: #94a3b8; font-size: 14px; font-weight: 600; }

        /* 모달 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }

        .modal-box { background: #fff; border-radius: 16px; padding: 28px; width: 340px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .modal-box h3 { font-size: 16px; font-weight: 700; color: #1e3a5f; margin-bottom: 16px; }
        .modal-box input[type="text"] {
            width: 100%; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 8px;
            font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 600; outline: none; margin-bottom: 16px;
        }
        .modal-box input[type="text"]:focus { border-color: #3b7dd8; }

        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
        .modal-btns button {
            padding: 8px 20px; border-radius: 8px; font-family: 'Manrope', sans-serif;
            font-size: 13px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s;
        }
        .btn-cancel { background: #f1f5f9; color: #64748b; }
        .btn-save { background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff; }
        .btn-delete { background: #fee2e2; color: #dc2626; }
        .btn-save:hover { transform: translateY(-1px); }

        /* PDF 인쇄 전용 - 화면에서 숨김 */
        .print-page-header { display: none; }
        .print-detail-static { display: none; }

        /* ═══════════════════════════════════ */
        /* @media print - PDF 저장 스타일      */
        /* ═══════════════════════════════════ */
        @media print {
            @page { size: A4 landscape; margin: 12mm 15mm; }

            body { background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

            .header, .top-controls, .modal-overlay,
            .no-activity-msg, .dc-remove-btn { display: none !important; }

            .container { max-width: 100%; margin: 0; padding: 0; }

            .plan-section {
                box-shadow: none; border: 1px solid #e2e8f0;
                margin-bottom: 12px; padding: 16px 20px; border-radius: 10px;
            }

            .print-page-header {
                display: block !important;
                text-align: center;
                margin-bottom: 10px;
                padding-top: 4px;
            }

            .print-page-header h2 { font-size: 20px; font-weight: 800; color: #1e3a5f; }
            .print-page-header .print-date { font-size: 13px; color: #64748b; font-weight: 600; margin-top: 2px; }

            /* 2페이지 강제 분리 */
            .page2-section { page-break-before: always; margin-top: 0; }

            /* 입력 필드 숨기고 정적 텍스트 표시 */
            .detail-card-body { display: none !important; }
            .print-detail-static { display: block !important; padding: 12px 18px; }

            .print-detail-static .pds-row { margin-bottom: 8px; }
            .print-detail-static .pds-label { font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 3px; }
            .print-detail-static .pds-value { font-size: 13px; font-weight: 500; color: #1e3a5f; line-height: 1.5; white-space: pre-wrap; min-height: 16px; }
            .print-detail-static .pds-value.empty { color: #cbd5e1; font-style: italic; }

            .detail-card { page-break-inside: avoid; }
            .detail-cards-title { color: #4a5568 !important; font-size: 14px !important; }
            .summary-card { border: 1px solid #e2e8f0; }
        }

        @media (max-width: 768px) {
            .container { padding: 0 12px; }
            .top-controls { gap: 10px; }
            .bar-segment .seg-count { font-size: 14px; }
            .bar-segment .seg-label { font-size: 9px; }
            .summary-card { min-width: 140px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1><span class="icon">📋</span> 데일리 플랜</h1>
    <div class="header-right">
        <button class="pdf-btn" onclick="savePDF()">📄 PDF 저장</button>
        <a href="index.html" class="home-btn">🏠 메인으로</a>
    </div>
</div>

<div class="container">
    <!-- PDF 1페이지 헤더 -->
    <div class="print-page-header" id="printHeader1">
        <h2>📋 HIQASC 데일리 플랜</h2>
        <div class="print-date" id="printDate1"></div>
    </div>

    <div class="top-controls">
        <div class="date-display"><span>📅</span><span id="todayDate"></span></div>
        <div class="input-group">
            <label>금일 입고 수량</label>
            <input type="number" id="inputQty" placeholder="0" min="0" max="500">
            <span class="unit">대</span>
        </div>
        <button class="apply-btn" onclick="applyPlan()">적용</button>
        <button class="reset-btn" onclick="resetAll()">초기화</button>
    </div>

    <!-- 1. 수리 계획 바 -->
    <div class="plan-section">
        <div class="section-title"><span class="badge badge-blue">PLAN</span> 시간대별 수리 계획</div>
        <div class="timeline-wrapper">
            <div class="time-axis" id="timeAxis"></div>
            <div class="bar-track" id="planBar"></div>
            <div class="legend-row">
                <div class="legend-item"><div class="legend-dot" style="background:linear-gradient(135deg,#3b82f6,#60a5fa)"></div>오전 (09~12) : 60대</div>
                <div class="legend-item"><div class="legend-dot" style="background:linear-gradient(135deg,#2563eb,#3b82f6)"></div>오후1 (13~15) : 130대</div>
                <div class="legend-item"><div class="legend-dot" style="background:linear-gradient(135deg,#1d4ed8,#2563eb)"></div>오후2 (15~17) : 170대</div>
                <div class="legend-item"><div class="legend-dot" style="background:linear-gradient(135deg,#1e40af,#1d4ed8)"></div>마감 (17~18) : 200대(DOA)</div>
            </div>
        </div>
    </div>

    <!-- 2. 예측 바 -->
    <div class="plan-section">
        <div class="section-title"><span class="badge badge-green">PREDICT</span> 입고 수량 기반 수리 완료 예측</div>
        <div class="timeline-wrapper">
            <div class="time-axis" id="timeAxis2"></div>
            <div class="bar-track" id="predictBar" style="overflow:visible;">
                <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:14px;font-weight:600;">입고 수량을 입력하세요</div>
            </div>
        </div>
        <div class="summary-row" id="summaryRow" style="display:none;">
            <div class="summary-card"><div class="sc-label">입고 수량</div><div class="sc-value blue" id="sumQty">-</div></div>
            <div class="summary-card"><div class="sc-label">예상 완료 시간</div><div class="sc-value green" id="sumTime">-</div></div>
            <div class="summary-card"><div class="sc-label">잔여 시간</div><div class="sc-value orange" id="sumRemain">-</div></div>
        </div>
    </div>

    <!-- 3. 잔여 시간 활동 -->
    <div class="plan-section">
        <div class="section-title">
            <span class="badge badge-orange">ACTIVITY</span>
            잔여 시간 활동 계획 <span style="font-size:12px;font-weight:500;color:#94a3b8;margin-left:8px;">(클릭하여 입력)</span>
        </div>
        <div class="timeline-wrapper">
            <div class="activity-track" id="activityTrack"></div>
            <div class="activity-time-labels" id="activityLabels"></div>
        </div>
    </div>

    <!-- ═══ 2페이지: 상세 내역 ═══ -->
    <div class="page2-section">
        <div class="print-page-header" id="printHeader2">
            <h2>📝 활동 상세 내역</h2>
            <div class="print-date" id="printDate2"></div>
        </div>
        <div class="plan-section">
            <div class="section-title"><span class="badge badge-orange">DETAIL</span> 활동 상세 내역</div>
            <div class="detail-cards-title" id="detailCardsTitle" style="display:none;">📝 등록된 활동</div>
            <div class="detail-cards" id="detailCards"></div>
        </div>
    </div>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="activityModal">
    <div class="modal-box">
        <h3 id="modalTitle">활동 입력</h3>
        <input type="text" id="modalInput" placeholder="활동 내용을 입력하세요" maxlength="30">
        <div class="modal-btns">
            <button class="btn-delete" id="modalDeleteBtn" onclick="deleteActivity()" style="display:none;">삭제</button>
            <button class="btn-cancel" onclick="closeModal()">취소</button>
            <button class="btn-save" onclick="saveActivity()">저장</button>
        </div>
    </div>
</div>

<script>
    const START_HOUR = 9, END_HOUR = 18, TOTAL_HOURS = 9;

    const PLAN_CHECKPOINTS = [
        { hour: 9,  cumulative: 0 },
        { hour: 12, cumulative: 60 },
        { hour: 13, cumulative: 60 },
        { hour: 15, cumulative: 130 },
        { hour: 17, cumulative: 170 },
        { hour: 18, cumulative: 200 }
    ];

    let currentQty = 0, predictedHour = null, activities = {}, currentSlotHour = null;

    function init() {
        setDate();
        buildTimeAxis('timeAxis');
        buildTimeAxis('timeAxis2');
        buildPlanBar();
        buildActivitySlots();
        renderDetailCards();
    }

    function setDate() {
        const now = new Date();
        const days = ['일','월','화','수','목','금','토'];
        const str = `${now.getFullYear()}. ${now.getMonth()+1}. ${now.getDate()} (${days[now.getDay()]})`;
        document.getElementById('todayDate').textContent = str;
        const fullStr = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]})`;
        document.getElementById('printDate1').textContent = fullStr;
        document.getElementById('printDate2').textContent = fullStr;
    }

    function buildTimeAxis(id) {
        const axis = document.getElementById(id);
        axis.innerHTML = '';
        for (let h = START_HOUR; h <= END_HOUR; h++) {
            const pct = ((h - START_HOUR) / TOTAL_HOURS) * 100;
            const label = document.createElement('span');
            label.className = 'time-label';
            label.style.left = pct + '%';
            label.textContent = String(h).padStart(2,'0') + ':00';
            axis.appendChild(label);
            const tick = document.createElement('div');
            tick.className = 'time-tick';
            tick.style.left = pct + '%';
            axis.appendChild(tick);
        }
    }

    function buildPlanBar() {
        const bar = document.getElementById('planBar');
        bar.innerHTML = '';
        const segments = [
            { startH:9, endH:12, to:60, cls:'seg-morning', label:'오전' },
            { startH:12, endH:13, to:null, cls:'seg-lunch', label:'점심' },
            { startH:13, endH:15, to:130, cls:'seg-afternoon1', label:'오후1' },
            { startH:15, endH:17, to:170, cls:'seg-afternoon2', label:'오후2' },
            { startH:17, endH:18, to:200, cls:'seg-evening', label:'마감' }
        ];
        segments.forEach(seg => {
            const left = ((seg.startH - START_HOUR) / TOTAL_HOURS) * 100;
            const width = ((seg.endH - seg.startH) / TOTAL_HOURS) * 100;
            const div = document.createElement('div');
            div.className = 'bar-segment ' + seg.cls;
            div.style.left = left + '%';
            div.style.width = width + '%';
            div.innerHTML = seg.cls === 'seg-lunch'
                ? '<span class="lunch-label">🍚 점심</span>'
                : `<span class="seg-count">${seg.to}대</span><span class="seg-label">${seg.label} (~${seg.endH}시)</span>`;
            bar.appendChild(div);
        });
    }

    function getHourForQty(qty) {
        if (qty <= 0) return START_HOUR;
        if (qty >= 200) return END_HOUR;
        for (let i = 1; i < PLAN_CHECKPOINTS.length; i++) {
            const prev = PLAN_CHECKPOINTS[i-1], curr = PLAN_CHECKPOINTS[i];
            if (qty <= curr.cumulative) {
                if (curr.cumulative === prev.cumulative) return curr.hour;
                return prev.hour + (qty - prev.cumulative) / (curr.cumulative - prev.cumulative) * (curr.hour - prev.hour);
            }
        }
        return END_HOUR;
    }

    function formatHour(h) {
        return `${String(Math.floor(h)).padStart(2,'0')}:${String(Math.round((h - Math.floor(h)) * 60)).padStart(2,'0')}`;
    }

    function applyPlan() {
        const val = parseInt(document.getElementById('inputQty').value);
        if (isNaN(val) || val < 0) { alert('입고 수량을 올바르게 입력하세요.'); return; }
        currentQty = val;
        predictedHour = getHourForQty(val);
        buildPredictBar();
        updateSummary();
        buildActivitySlots();
        renderDetailCards();
    }

    function buildPredictBar() {
        const bar = document.getElementById('predictBar');
        bar.innerHTML = '';
        if (currentQty <= 0) {
            bar.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:14px;font-weight:600;">입고 수량을 입력하세요</div>';
            return;
        }
        const endPct = ((predictedHour - START_HOUR) / TOTAL_HOURS) * 100;
        const seg = document.createElement('div');
        seg.className = 'bar-segment predict-bar';
        seg.style.left = '0%';
        seg.style.width = Math.min(endPct, 100) + '%';
        seg.innerHTML = `<span class="seg-count">${currentQty}대</span><span class="seg-label">수리 진행 → ${formatHour(predictedHour)} 완료 예상</span>`;
        bar.appendChild(seg);
        if (endPct < 100) {
            const marker = document.createElement('div');
            marker.className = 'predict-marker';
            marker.style.left = endPct + '%';
            marker.setAttribute('data-label', '완료 ' + formatHour(predictedHour));
            bar.appendChild(marker);
        }
    }

    function updateSummary() {
        const row = document.getElementById('summaryRow');
        if (currentQty <= 0) { row.style.display = 'none'; return; }
        row.style.display = 'flex';
        document.getElementById('sumQty').textContent = currentQty + '대';
        document.getElementById('sumTime').textContent = formatHour(predictedHour);
        const remain = END_HOUR - predictedHour;
        if (remain <= 0) {
            document.getElementById('sumRemain').textContent = '없음';
            document.getElementById('sumRemain').style.color = '#dc2626';
        } else {
            const rh = Math.floor(remain), rm = Math.round((remain - rh) * 60);
            document.getElementById('sumRemain').textContent = rh + '시간 ' + (rm > 0 ? rm + '분' : '');
            document.getElementById('sumRemain').style.color = '#ea580c';
        }
    }

    function buildActivitySlots() {
        const track = document.getElementById('activityTrack');
        const labels = document.getElementById('activityLabels');
        track.innerHTML = ''; labels.innerHTML = '';
        for (let h = START_HOUR; h < END_HOUR; h++) {
            const slot = document.createElement('div');
            slot.className = 'activity-slot';
            const isRepairTime = predictedHour && h < Math.ceil(predictedHour);
            if (h === 12) {
                slot.classList.add('disabled');
                slot.innerHTML = '<span class="slot-placeholder" style="display:block;font-size:11px;color:#94a3b8;font-weight:600;">🍚</span>';
            } else if (currentQty > 0 && isRepairTime) {
                slot.classList.add('disabled');
                slot.innerHTML = '<span class="slot-placeholder" style="display:block;font-size:10px;color:#3b82f6;font-weight:700;">수리중</span>';
            } else if (activities[h]) {
                slot.classList.add('filled');
                slot.innerHTML = `<span class="slot-text">${activities[h].title}</span>`;
                slot.onclick = () => openModal(h);
            } else {
                slot.innerHTML = '<span class="slot-placeholder">+</span>';
                slot.onclick = () => openModal(h);
            }
            track.appendChild(slot);
            const lbl = document.createElement('span');
            lbl.textContent = `${String(h).padStart(2,'0')}~${String(h+1).padStart(2,'0')}`;
            labels.appendChild(lbl);
        }
    }

    function openModal(hour) {
        currentSlotHour = hour;
        document.getElementById('modalTitle').textContent = `${String(hour).padStart(2,'0')}:00 ~ ${String(hour+1).padStart(2,'0')}:00 활동`;
        document.getElementById('modalInput').value = activities[hour] ? activities[hour].title : '';
        document.getElementById('modalDeleteBtn').style.display = activities[hour] ? 'inline-block' : 'none';
        document.getElementById('activityModal').classList.add('active');
        setTimeout(() => document.getElementById('modalInput').focus(), 100);
    }

    function closeModal() {
        document.getElementById('activityModal').classList.remove('active');
        currentSlotHour = null;
    }

    function saveActivity() {
        const val = document.getElementById('modalInput').value.trim();
        if (val) {
            if (activities[currentSlotHour]) activities[currentSlotHour].title = val;
            else activities[currentSlotHour] = { title: val, detail: '', participants: '' };
        }
        closeModal();
        buildActivitySlots();
        renderDetailCards();
    }

    function deleteActivity() {
        delete activities[currentSlotHour];
        closeModal();
        buildActivitySlots();
        renderDetailCards();
    }

    function renderDetailCards() {
        const container = document.getElementById('detailCards');
        const title = document.getElementById('detailCardsTitle');
        container.innerHTML = '';
        const sortedHours = Object.keys(activities).map(Number).sort((a,b) => a - b);

        if (sortedHours.length === 0) {
            title.style.display = 'none';
            container.innerHTML = '<div class="no-activity-msg">활동 슬롯을 클릭하여 활동을 추가하면 상세 내역이 여기에 표시됩니다.</div>';
            return;
        }
        title.style.display = 'flex';

        sortedHours.forEach(h => {
            const act = activities[h];
            const card = document.createElement('div');
            card.className = 'detail-card';
            card.innerHTML = `
                <div class="detail-card-header">
                    <span class="dc-time">${String(h).padStart(2,'0')}:00 ~ ${String(h+1).padStart(2,'0')}:00</span>
                    <span class="dc-title">${act.title}</span>
                    <button class="dc-remove-btn" onclick="removeActivityCard(${h})" title="삭제">✕</button>
                </div>
                <div class="detail-card-body">
                    <div class="detail-field">
                        <label>📋 상세 내역</label>
                        <textarea placeholder="활동 상세 내역을 입력하세요..."
                            oninput="updateDetail(${h}, 'detail', this.value)">${act.detail || ''}</textarea>
                    </div>
                    <div class="detail-field">
                        <label>👥 참여자</label>
                        <input type="text" placeholder="참여자를 입력하세요 (예: 홍길동, 김철수)"
                            value="${act.participants || ''}"
                            oninput="updateDetail(${h}, 'participants', this.value)">
                    </div>
                </div>
                <div class="print-detail-static">
                    <div class="pds-row">
                        <div class="pds-label">📋 상세 내역</div>
                        <div class="pds-value ${act.detail ? '' : 'empty'}" data-field="detail-${h}">${act.detail || '(미입력)'}</div>
                    </div>
                    <div class="pds-row">
                        <div class="pds-label">👥 참여자</div>
                        <div class="pds-value ${act.participants ? '' : 'empty'}" data-field="participants-${h}">${act.participants || '(미입력)'}</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function updateDetail(hour, field, value) {
        if (!activities[hour]) return;
        activities[hour][field] = value;
        const el = document.querySelector(`[data-field="${field}-${hour}"]`);
        if (el) {
            el.textContent = value || '(미입력)';
            el.className = 'pds-value' + (value ? '' : ' empty');
        }
    }

    function removeActivityCard(hour) {
        if (!confirm('이 활동을 삭제하시겠습니까?')) return;
        delete activities[hour];
        buildActivitySlots();
        renderDetailCards();
    }

    function savePDF() {
        // 인쇄 전 정적 텍스트 최신화
        Object.keys(activities).forEach(h => {
            const act = activities[h];
            ['detail', 'participants'].forEach(f => {
                const el = document.querySelector(`[data-field="${f}-${h}"]`);
                if (el) {
                    el.textContent = act[f] || '(미입력)';
                    el.className = 'pds-value' + (act[f] ? '' : ' empty');
                }
            });
        });
        window.print();
    }

    function resetAll() {
        if (!confirm('모든 데이터를 초기화하시겠습니까?')) return;
        currentQty = 0; predictedHour = null; activities = {};
        document.getElementById('inputQty').value = '';
        document.getElementById('predictBar').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:14px;font-weight:600;">입고 수량을 입력하세요</div>';
        document.getElementById('summaryRow').style.display = 'none';
        buildActivitySlots();
        renderDetailCards();
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            if (document.getElementById('activityModal').classList.contains('active')) saveActivity();
            else if (document.activeElement === document.getElementById('inputQty')) applyPlan();
        }
        if (e.key === 'Escape') closeModal();
    });

    init();
</script>
</body>
</html>
