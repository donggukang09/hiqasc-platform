<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포장&입출고 데일리 플랜 - HIQASC</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Manrope', sans-serif; background: #f0f4f8; color: #1a202c; min-height: 100vh; }

        .header {
            background: linear-gradient(135deg, #7c2d12 0%, #9a3412 50%, #c2410c 100%);
            padding: 20px 32px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 20px rgba(124,45,18,0.3);
        }
        .header h1 { color: #fff; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .hdr-btn {
            background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 18px; border-radius: 8px; font-family: 'Manrope', sans-serif;
            font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s;
        }
        .hdr-btn:hover { background: rgba(255,255,255,0.25); }
        .hdr-btn.save { background: rgba(34,197,94,0.7); }
        .hdr-btn.pdf { background: rgba(220,38,38,0.7); }

        .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }

        .date-bar {
            background: #fff; border-radius: 16px; padding: 16px 24px; margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
        }
        .date-left { display: flex; align-items: center; gap: 16px; }
        .date-nav button {
            background: #f1f5f9; border: 1px solid #e2e8f0; color: #475569;
            width: 36px; height: 36px; border-radius: 10px; font-size: 16px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .date-nav button:hover { background: #e2e8f0; }
        .date-display { font-size: 18px; font-weight: 800; color: #7c2d12; min-width: 200px; text-align: center; }
        .today-btn {
            background: linear-gradient(135deg, #7c2d12, #c2410c); color: #fff; border: none;
            padding: 8px 16px; border-radius: 8px; font-family: 'Manrope', sans-serif;
            font-size: 13px; font-weight: 700; cursor: pointer;
        }
        .status-badge { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .status-badge.saved { background: #dcfce7; color: #16a34a; }
        .status-badge.unsaved { background: #fef3c7; color: #d97706; }
        .status-badge.new { background: #f1f5f9; color: #64748b; }

        .section { background: #fff; border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .section-title { font-size: 15px; font-weight: 700; color: #4a5568; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; color: #fff; }

        /* 수량 카드 */
        .qty-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .qty-card {
            flex: 1; min-width: 200px; background: #fff7ed; border: 2px solid #fed7aa; border-radius: 14px;
            padding: 18px 20px; display: flex; align-items: center; justify-content: space-between;
        }
        .qty-card .qc-label {
            font-size: 13px; font-weight: 700; color: #9a3412; display: flex; align-items: center; gap: 8px;
        }
        .qty-card .qc-label .qc-icon { font-size: 20px; }
        .qty-card .qc-input-wrap { display: flex; align-items: center; gap: 6px; }
        .qty-card input[type="number"] {
            width: 90px; padding: 8px 12px; border: 2px solid #fed7aa; border-radius: 8px;
            font-family: 'Manrope', sans-serif; font-size: 18px; font-weight: 800;
            color: #9a3412; text-align: center; outline: none; background: #fff;
        }
        .qty-card input:focus { border-color: #c2410c; }
        .qty-card .qc-unit { font-size: 14px; font-weight: 700; color: #9a3412; }

        /* 타임라인 */
        .time-axis { position: relative; height: 28px; margin-bottom: 4px; }
        .time-axis .tl { position: absolute; font-size: 11px; font-weight: 700; color: #94a3b8; transform: translateX(-50%); }
        .time-tick { position: absolute; width: 1px; height: 10px; background: #cbd5e1; top: 18px; transform: translateX(-50%); }

        .slot-track { display: flex; gap: 4px; margin-top: 8px; }
        .slot-cell {
            flex: 1; height: 56px; border-radius: 10px; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            background: #f1f5f9; border: 2px dashed #cbd5e1; overflow: hidden; padding: 4px;
        }
        .slot-cell:hover { background: #e2e8f0; border-color: #c2410c; }
        .slot-cell.filled { border: none; padding: 0; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .slot-cell.filled:hover { transform: translateY(-1px); }
        .slot-cell.lunch {
            background: repeating-linear-gradient(45deg, #e2e8f0, #e2e8f0 4px, #f1f5f9 4px, #f1f5f9 8px);
            border: none; cursor: not-allowed;
        }
        .slot-cell .plus { font-size: 20px; color: #cbd5e1; }
        .slot-cell .slot-label { font-size: 10px; font-weight: 800; text-align: center; padding: 0 4px; line-height: 1.2; text-shadow: 0 1px 1px rgba(0,0,0,0.2); }
        .slot-cell .lunch-label { font-size: 11px; font-weight: 700; color: #94a3b8; }

        .slot-labels { display: flex; gap: 4px; margin-top: 4px; }
        .slot-labels span { flex: 1; text-align: center; font-size: 10px; font-weight: 600; color: #94a3b8; }

        /* 업무별 색상 */
        .task-t1 { background: linear-gradient(135deg, #3b82f6, #60a5fa); }
        .task-t2 { background: linear-gradient(135deg, #ea580c, #f97316); }
        .task-t3 { background: linear-gradient(135deg, #dc2626, #ef4444); }
        .task-t4 { background: linear-gradient(135deg, #0891b2, #06b6d4); }
        .task-t5 { background: linear-gradient(135deg, #64748b, #94a3b8); }

        .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #64748b; }
        .legend-dot { width: 14px; height: 14px; border-radius: 4px; }

        /* 상세 내역 카드 */
        .detail-cards { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .detail-card { background: #f8fafc; border: 1px solid #dbeafe; border-radius: 14px; overflow: hidden; }
        .detail-card-header {
            display: flex; align-items: center; gap: 12px; padding: 14px 18px; color: #fff;
        }
        .detail-card-header .dc-count {
            font-size: 12px; font-weight: 800; background: rgba(255,255,255,0.3);
            padding: 3px 10px; border-radius: 6px;
        }
        .detail-card-header .dc-title { font-size: 15px; font-weight: 800; flex: 1; text-shadow: 0 1px 2px rgba(0,0,0,0.15); }
        .detail-card-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
        .df-label { font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 4px; }
        .df-textarea {
            width: 100%; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 10px;
            font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 500; color: #1e293b;
            resize: vertical; min-height: 50px; outline: none; line-height: 1.5;
        }
        .df-textarea:focus { border-color: #c2410c; }
        .df-input {
            width: 100%; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 10px;
            font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600; color: #1e293b; outline: none;
        }
        .df-input:focus { border-color: #c2410c; }

        .no-activity { text-align: center; padding: 20px; color: #94a3b8; font-size: 13px; font-weight: 600; }

        .memo-textarea {
            width: 100%; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 10px;
            font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 500; color: #1e293b;
            resize: vertical; min-height: 56px; outline: none; line-height: 1.5; margin-top: 6px;
        }

        /* 모달 */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; border-radius: 16px; padding: 28px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .modal-box h3 { font-size: 16px; font-weight: 700; color: #7c2d12; margin-bottom: 16px; }
        .modal-box select {
            width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 10px;
            font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 600; color: #1e293b;
            outline: none; margin-bottom: 16px; cursor: pointer; background: #fff;
        }
        .modal-box select:focus { border-color: #c2410c; }
        .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
        .modal-btns button {
            padding: 8px 20px; border-radius: 8px; font-family: 'Manrope', sans-serif;
            font-size: 13px; font-weight: 700; cursor: pointer; border: none;
        }
        .btn-cancel { background: #f1f5f9; color: #64748b; }
        .btn-save { background: linear-gradient(135deg, #7c2d12, #c2410c); color: #fff; }
        .btn-delete { background: #fee2e2; color: #dc2626; }

        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.7); z-index: 2000; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
        .loading-overlay.active { display: flex; }
        .loading-spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #c2410c; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); padding: 14px 28px; border-radius: 12px; font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 700; color: #fff; z-index: 3000; transition: transform 0.3s; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: #16a34a; }
        .toast.error { background: #dc2626; }

        .print-header { display: none; }
        @media print {
            @page { size: A4 landscape; margin: 12mm 15mm; }
            body { background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .header, .today-btn, .hdr-btn, .loading-overlay, .toast, .modal-overlay { display: none !important; }
            .container { max-width: 100%; margin: 0; padding: 0; }
            .print-header { display: block !important; text-align: center; margin-bottom: 12px; }
            .print-header h2 { font-size: 20px; font-weight: 800; color: #7c2d12; }
            .print-header p { font-size: 13px; color: #64748b; font-weight: 600; }
            .section { box-shadow: none; border: 1px solid #e2e8f0; }
            .df-textarea, .df-input, .memo-textarea, .qty-card input { border: none !important; background: transparent !important; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📦 포장 & 입출고 데일리 플랜</h1>
    <div class="header-right">
        <button class="hdr-btn save" onclick="saveToSheets()">💾 저장</button>
        <button class="hdr-btn pdf" onclick="window.print()">📄 PDF</button>
        <a href="support-team.html" class="hdr-btn">🏠 메인으로</a>
    </div>
</div>

<div class="container">
    <div class="print-header"><h2>📦 HIQASC 포장 & 입출고 데일리 플랜</h2><p id="printDate"></p></div>

    <div class="date-bar">
        <div class="date-left">
            <div class="date-nav" style="display:flex;gap:8px;">
                <button onclick="changeDate(-1)">◀</button>
                <div class="date-display" id="dateDisplay"></div>
                <button onclick="changeDate(1)">▶</button>
            </div>
            <button class="today-btn" onclick="goToday()">오늘</button>
        </div>
        <span class="status-badge new" id="statusBadge">새 플랜</span>
    </div>

    <!-- 입출고 수량 -->
    <div class="section">
        <div class="section-title"><span class="badge" style="background:linear-gradient(135deg,#7c2d12,#c2410c)">수량</span> 오늘의 입출고 현황</div>
        <div class="qty-row">
            <div class="qty-card">
                <div class="qc-label"><span class="qc-icon">📥</span>입고 수량</div>
                <div class="qc-input-wrap">
                    <input type="number" id="inQty" placeholder="0" min="0" oninput="markDirty()">
                    <span class="qc-unit">대</span>
                </div>
            </div>
            <div class="qty-card">
                <div class="qc-label"><span class="qc-icon">📤</span>출고 수량</div>
                <div class="qc-input-wrap">
                    <input type="number" id="outQty" placeholder="0" min="0" oninput="markDirty()">
                    <span class="qc-unit">대</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 타임라인 -->
    <div class="section">
        <div class="section-title"><span class="badge" style="background:linear-gradient(135deg,#7c2d12,#c2410c)">타임라인</span> 시간대별 업무 (클릭하여 선택)</div>
        <div class="time-axis" id="timeAxis"></div>
        <div class="slot-track" id="slotTrack"></div>
        <div class="slot-labels" id="slotLabels"></div>

        <div class="legend">
            <div class="legend-item"><div class="legend-dot task-t1"></div>머신입고</div>
            <div class="legend-item"><div class="legend-dot task-t2"></div>포장 & 송장부착</div>
            <div class="legend-item"><div class="legend-dot task-t3"></div>수리출고</div>
            <div class="legend-item"><div class="legend-dot task-t4"></div>포장기 세척 및 주변청소</div>
            <div class="legend-item"><div class="legend-dot task-t5"></div>기타</div>
        </div>
    </div>

    <!-- 상세 내역 -->
    <div class="section">
        <div class="section-title"><span class="badge" style="background:linear-gradient(135deg,#7c3aed,#a78bfa)">DETAIL</span> 업무 상세 내역</div>
        <div class="detail-cards" id="detailCards">
            <div class="no-activity">타임라인에서 시간대를 클릭하여 업무를 선택하세요.</div>
        </div>
    </div>

    <!-- 메모 -->
    <div class="section">
        <div class="section-title"><span class="badge" style="background:#64748b">메모</span> 특이사항</div>
        <textarea class="memo-textarea" id="dayMemo" placeholder="특이사항이나 메모를 입력하세요..." oninput="markDirty()"></textarea>
    </div>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="taskModal">
    <div class="modal-box">
        <h3 id="modalTitle">업무 선택</h3>
        <select id="modalSelect">
            <option value="">-- 업무를 선택하세요 --</option>
            <option value="1">머신입고</option>
            <option value="2">포장 & 송장부착</option>
            <option value="3">수리출고</option>
            <option value="4">포장기 세척 및 주변청소</option>
            <option value="5">기타</option>
        </select>
        <div class="modal-btns">
            <button class="btn-delete" id="modalDelBtn" onclick="deleteSlot()" style="display:none;">삭제</button>
            <button class="btn-cancel" onclick="closeModal()">취소</button>
            <button class="btn-save" onclick="saveSlot()">저장</button>
        </div>
    </div>
</div>
<div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div><div class="loading-text" style="font-size:14px;font-weight:700;color:#475569;" id="loadingText"></div></div>
<div class="toast" id="toast"></div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxnvHCg02bi-5W1qcZM4loH_ozLl-uO5McOI5SAkbtNqbRx9tsUszIov6yZmYjaScMU/exec';
const S=9, E=18;
const LUNCH_H = 12;

const TASKS = {
    '1': { name: '머신입고', cls: 'task-t1' },
    '2': { name: '포장 & 송장부착', cls: 'task-t2' },
    '3': { name: '수리출고', cls: 'task-t3' },
    '4': { name: '포장기 세척 및 주변청소', cls: 'task-t4' },
    '5': { name: '기타', cls: 'task-t5' }
};

let selectedDate = new Date();
let slots = {};
let taskDetails = {};
let currentModalHour = null;
let isDirty = false, jsonpCnt = 0;

function init(){
    selectedDate.setHours(0,0,0,0);
    buildTimeAxis();
    buildSlots();
    renderDetails();
    updateDateDisplay();
    loadFromSheets();
}

function fmtD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDKR(d){const w=['일','월','화','수','목','금','토'];return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()} (${w[d.getDay()]})`;}

function updateDateDisplay(){
    document.getElementById('dateDisplay').textContent=fmtDKR(selectedDate);
    document.getElementById('printDate').textContent=fmtDKR(selectedDate);
}

function changeDate(d){if(isDirty&&!confirm('저장하지 않은 변경사항이 있습니다.\n이동하시겠습니까?'))return;selectedDate.setDate(selectedDate.getDate()+d);clearAll();updateDateDisplay();loadFromSheets();}
function goToday(){if(isDirty&&!confirm('변경사항이 있습니다.\n이동하시겠습니까?'))return;selectedDate=new Date();selectedDate.setHours(0,0,0,0);clearAll();updateDateDisplay();loadFromSheets();}

function buildTimeAxis(){
    const ax=document.getElementById('timeAxis');ax.innerHTML='';
    const total=E-S;
    for(let h=S;h<=E;h++){
        const pct=((h-S)/total)*100;
        const el=document.createElement('span');el.className='tl';el.style.left=pct+'%';el.textContent=String(h).padStart(2,'0')+':00';ax.appendChild(el);
        const tk=document.createElement('div');tk.className='time-tick';tk.style.left=pct+'%';ax.appendChild(tk);
    }
}

function buildSlots(){
    const track=document.getElementById('slotTrack');
    const labels=document.getElementById('slotLabels');
    track.innerHTML=''; labels.innerHTML='';

    for(let h=S;h<E;h++){
        const cell=document.createElement('div');
        cell.className='slot-cell';

        if(h===LUNCH_H){
            cell.classList.add('lunch');
            cell.innerHTML='<span class="lunch-label">🍚 점심</span>';
        } else if(slots[h]){
            const task=TASKS[slots[h]];
            cell.classList.add('filled', task.cls);
            cell.innerHTML=`<span class="slot-label">${task.name}</span>`;
            cell.onclick=()=>openModal(h);
        } else {
            cell.innerHTML='<span class="plus">+</span>';
            cell.onclick=()=>openModal(h);
        }
        track.appendChild(cell);

        const lbl=document.createElement('span');
        lbl.textContent=`${String(h).padStart(2,'0')}~${String(h+1).padStart(2,'0')}`;
        labels.appendChild(lbl);
    }
}

function openModal(h){
    currentModalHour=h;
    document.getElementById('modalTitle').textContent=`${String(h).padStart(2,'0')}:00 ~ ${String(h+1).padStart(2,'0')}:00 업무 선택`;
    document.getElementById('modalSelect').value=slots[h]||'';
    document.getElementById('modalDelBtn').style.display=slots[h]?'inline-block':'none';
    document.getElementById('taskModal').classList.add('active');
}
function closeModal(){document.getElementById('taskModal').classList.remove('active');currentModalHour=null;}

function saveSlot(){
    const v=document.getElementById('modalSelect').value;
    if(v){
        slots[currentModalHour]=v;
        if(!taskDetails[v]) taskDetails[v]={detail:'', participants:''};
        markDirty();
    }
    closeModal();
    buildSlots();
    renderDetails();
}

function deleteSlot(){
    const taskId=slots[currentModalHour];
    delete slots[currentModalHour];
    const stillUsed=Object.values(slots).includes(taskId);
    if(!stillUsed) delete taskDetails[taskId];
    markDirty();
    closeModal();
    buildSlots();
    renderDetails();
}

function renderDetails(){
    const container=document.getElementById('detailCards');
    container.innerHTML='';

    const usedTaskIds=[];
    for(let h=S;h<E;h++){
        if(slots[h] && !usedTaskIds.includes(slots[h])){
            usedTaskIds.push(slots[h]);
        }
    }

    if(usedTaskIds.length===0){
        container.innerHTML='<div class="no-activity">타임라인에서 시간대를 클릭하여 업무를 선택하세요.</div>';
        return;
    }

    usedTaskIds.forEach(tid=>{
        const task=TASKS[tid];
        const det=taskDetails[tid]||{detail:'', participants:''};
        const count=Object.values(slots).filter(s=>s===tid).length;
        const card=document.createElement('div');
        card.className='detail-card';
        card.innerHTML=`
            <div class="detail-card-header ${task.cls}">
                <span class="dc-count">${count}시간</span>
                <span class="dc-title">${task.name}</span>
            </div>
            <div class="detail-card-body">
                <div>
                    <div class="df-label">📋 상세 내역</div>
                    <textarea class="df-textarea" placeholder="업무 상세 내역을 입력하세요..." oninput="updateDetail('${tid}','detail',this.value)">${det.detail}</textarea>
                </div>
                <div>
                    <div class="df-label">👥 참여자</div>
                    <input type="text" class="df-input" placeholder="참여자 (예: 홍길동, 김철수)" value="${det.participants}" oninput="updateDetail('${tid}','participants',this.value)">
                </div>
            </div>
        `;
        container.appendChild(card);
    });
}

function updateDetail(tid, field, value){
    if(!taskDetails[tid]) taskDetails[tid]={detail:'',participants:''};
    taskDetails[tid][field]=value;
    markDirty();
}

// 데이터
function getFormData(){
    return {
        inQty: parseInt(document.getElementById('inQty').value)||0,
        outQty: parseInt(document.getElementById('outQty').value)||0,
        slots, taskDetails,
        memo:document.getElementById('dayMemo').value
    };
}
function setFormData(d){
    if(!d)return;
    document.getElementById('inQty').value=d.inQty||'';
    document.getElementById('outQty').value=d.outQty||'';
    slots=d.slots||{};
    taskDetails=d.taskDetails||{};
    document.getElementById('dayMemo').value=d.memo||'';
    buildSlots(); renderDetails();
}
function clearAll(){
    slots={}; taskDetails={};
    document.getElementById('inQty').value='';
    document.getElementById('outQty').value='';
    document.getElementById('dayMemo').value='';
    buildSlots(); renderDetails();
    isDirty=false; updateStatus('new');
}
function markDirty(){isDirty=true;updateStatus('unsaved');}
function updateStatus(t){const b=document.getElementById('statusBadge');if(t==='saved'){b.textContent='저장됨';b.className='status-badge saved';}else if(t==='unsaved'){b.textContent='변경사항 있음';b.className='status-badge unsaved';}else{b.textContent='새 플랜';b.className='status-badge new';}}

function loadFromSheets(){
    if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL==='https://script.google.com/macros/s/AKfycbxnvHCg02bi-5W1qcZM4loH_ozLl-uO5McOI5SAkbtNqbRx9tsUszIov6yZmYjaScMU/exec'){updateStatus('new');return;}
    showLoading('불러오는 중...');
    const cb='sCb_'+(++jsonpCnt);
    const to=setTimeout(()=>{hideLoading();delete window[cb];},10000);
    window[cb]=function(r){clearTimeout(to);hideLoading();if(r.success&&r.planData){setFormData(r.planData);isDirty=false;updateStatus('saved');}delete window[cb];const s=document.getElementById('s_'+cb);if(s)s.remove();};
    const s=document.createElement('script');s.id='s_'+cb;
    s.onerror=()=>{clearTimeout(to);hideLoading();delete window[cb];};
    s.src=APPS_SCRIPT_URL+'?action=load&date='+fmtD(selectedDate)+'&callback='+cb+'&t='+Date.now();
    document.body.appendChild(s);
}

function saveToSheets(){
    if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL==='https://script.google.com/macros/s/AKfycbxnvHCg02bi-5W1qcZM4loH_ozLl-uO5McOI5SAkbtNqbRx9tsUszIov6yZmYjaScMU/exec'){showToast('Apps Script URL을 설정하세요.','error');return;}
    showLoading('저장 중...');
    fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',date:fmtD(selectedDate),planData:getFormData()})})
    .then(()=>{hideLoading();isDirty=false;updateStatus('saved');showToast('저장되었습니다!','success');})
    .catch(()=>{hideLoading();showToast('저장 실패','error');});
}

function showLoading(t){document.getElementById('loadingText').textContent=t;document.getElementById('loadingOverlay').classList.add('active');}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('active');}
function showToast(m,t){const el=document.getElementById('toast');el.textContent=m;el.className='toast '+t;setTimeout(()=>el.classList.add('show'),10);setTimeout(()=>el.classList.remove('show'),2500);}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
window.addEventListener('beforeunload',e=>{if(isDirty){e.preventDefault();e.returnValue='';}});

init();
</script>
</body>
</html>
