<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마감 셀프체크</title>
<script>
  if (sessionStorage.getItem('hiqasc_authenticated') !== 'true') { location.replace('index.html'); }
</script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --line:#e3e5e8; --text:#1f2328; --sub:#5c626b; --muted:#9aa0a8;
    --accent:#e8853a; --accent-d:#c96a22; --accent-bg:#fdf1e7;
    --ok:#27ae60; --ok-bg:#e8f6ee; --late:#e67e22; --late-bg:#fdf0e3; --bad:#d64545; --bad-bg:#fbeaea;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope','Pretendard','Malgun Gothic',sans-serif;line-height:1.5}
  .topbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:10px}
  .topbar h1{margin:0;font-size:18px;font-weight:800}
  .topbar h1 span{color:var(--accent)}
  .clock{font-size:13px;color:var(--sub);white-space:nowrap}
  .home-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  .home-btn:hover{border-color:var(--accent);color:var(--accent)}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:16px}
  .card .desc{margin:0 0 14px;color:var(--sub);font-size:13.5px}
  label.fl{display:block;font-size:13px;font-weight:700;margin:0 0 6px}
  select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:#fff}
  .rounds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .rbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 8px;cursor:pointer;font:inherit;text-align:center}
  .rbtn b{display:block;font-size:15px}
  .rbtn small{display:block;font-size:12px;color:var(--sub)}
  .rbtn .chip{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:#eef0f2;color:var(--sub)}
  .rbtn.sel{border-color:var(--accent);background:var(--accent-bg)}
  .rbtn:disabled{cursor:not-allowed;opacity:.55}
  .chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.late{background:var(--late-bg);color:var(--late)}
  .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.now{background:var(--accent-bg);color:var(--accent-d)}

  .notice{border-radius:12px;padding:14px 16px;font-size:14px;margin-bottom:16px}
  .notice.info{background:#eef4fb;color:#2c5d93}
  .notice.done{background:var(--ok-bg);color:#1d7a45;font-weight:700}
  .notice.err{background:var(--bad-bg);color:var(--bad)}

  .step{position:relative;transition:opacity .2s}
  .step.locked{opacity:.45}
  .step.locked .step-body{pointer-events:none}
  .step.confirmed{border-color:var(--ok);background:#fbfefc}
  .step-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
  .step.confirmed .num{background:var(--ok)}
  .step-head h2{margin:0}
  .lock-msg{font-size:12.5px;color:var(--muted);margin:0 0 10px 40px}
  .item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:#fcfcfd;cursor:pointer;transition:all .15s}
  .item:hover{border-color:var(--accent)}
  .item input{flex:0 0 24px;width:24px;height:24px;accent-color:var(--ok);cursor:pointer;margin:0}
  .item-label{font-weight:700;font-size:14.5px}
  .item-hint{font-size:12.5px;color:var(--sub);margin-top:2px}
  .item.checked{border-color:var(--ok);background:var(--ok-bg)}
  .item.checked .item-label{color:#1d7a45}
  select:focus{outline:none;border-color:var(--accent)}
  .remain{font-size:12px;color:var(--muted);margin-top:6px}

  .submit{width:100%;padding:15px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
  .submit:disabled{background:#cfd3d8;cursor:not-allowed}
  .submit:not(:disabled):hover{background:var(--accent-d)}
  .footer{text-align:center;font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:30px}
  .hidden{display:none !important}
  @media (max-width:480px){ .rbtn{padding:8px 4px} .rbtn b{font-size:14px} .card{padding:16px} }
</style>
</head>
<body>
<div class="topbar">
  <button class="home-btn" onclick="location.href='index.html'">🏠 메인으로</button>
  <h1>✅ 마감 <span>셀프체크</span></h1>
  <div class="clock" id="clock">—</div>
</div>

<div class="wrap">
  <div id="globalMsg"></div>

  <div class="card">
    <h2>누구의 몇 차 마감인가요?</h2>
    <p class="desc">이름을 선택하면 오늘의 회차별 체크 상태가 표시됩니다.</p>
    <label class="fl" for="nameSel">테크니션</label>
    <select id="nameSel"><option value="">불러오는 중…</option></select>
    <div class="rounds" id="roundBox"></div>
  </div>

  <div id="roundMsg"></div>
  <div id="steps"></div>

  <button class="submit hidden" id="submitBtn" disabled>마감 셀프체크 제출</button>
  <div class="footer">DEVELOPED BY DONGGU KANG</div>
</div>

<script>
/* ───────── 설정 ───────── */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyH2PVmFBVK-m17gJN5waBhOBHIZSAy0i-d34101gub4hc0PR7gkYQNYFoSsDM_goXX/exec';
const NAME_KEY = 'hiq_closingcheck_lastname';

const STEPS = [
  { key:'parts', icon:'🔩', title:'부품 입력 여부',
    desc:'이번 마감 전 수리한 건의 부품 입력이 정확한지 SVC에서 직접 확인하고 항목별로 체크하세요.',
    items:[
      { label:'실제 사용한 부품', hint:'SVC에 입력한 부품이 실제로 교체·사용한 부품과 일치하는지', ph:'예) 6건 확인 — 입력 부품과 실제 사용 부품 일치' },
      { label:'테크니션 노트 내용', hint:'노트에 수리 내용과 사용 부품이 빠짐없이 맞게 적혀 있는지', ph:'예) 6건 노트 확인, 1건 사용 부품 누락되어 보완' },
      { label:'부품 승인 / 등록', hint:'승인이 필요한 부품의 승인 요청과 부품 등록이 완료되었는지', ph:'예) 승인 필요 1건 승인 완료, 나머지 등록 완료' }
    ]},
  { key:'ship', icon:'📅', title:'출고일',
    desc:'출고일이 정확히 금일인지, 수리 후 익일 출고인지 확인하고 출고일이 정상 입력됐는지 체크하세요.',
    items:[
      { label:'금일 출고 건', hint:'오늘 출고되는 건의 출고일이 오늘 날짜로 정확히 입력되었는지', ph:'예) 금일 출고 4건 — 출고일 오늘 날짜로 정상 입력' },
      { label:'익일 출고 건', hint:'수리 후 다음 날 출고되는 건의 출고일이 익일로 입력되었는지', ph:'예) 익일 출고 2건 — 1건 금일로 잘못 입력되어 수정' }
    ]},
  { key:'call', icon:'📞', title:'통화요청 진행 여부',
    desc:'건별로 통화요청이 필요한지, 정상 진행되었는지 확인하고 체크하세요.',
    items:[
      { label:'수리 후 출고 건', hint:'통화요청 없이 수리 후 바로 출고되는 건이 맞게 처리되었는지', ph:'예) 4건 — 통화요청 불필요, 출고 처리 정상' },
      { label:'수리 후 통화요청 건', hint:'수리 후 고객 통화가 필요한 건이 통화요청으로 정상 등록되었는지', ph:'예) 1건 — 통화요청 등록 확인' },
      { label:'수리 전 통화요청 건', hint:'수리 전 고객 확인이 필요한 건의 통화요청이 정상 진행되었는지', ph:'예) 1건 — 수리 전 통화요청 진행 중 확인' }
    ]}
];

/* ───────── 상태 ───────── */
let DATA = null;
let loadedAt = 0, baseMin = 0;
let selName = '', selRound = 0;
let confirmed = [false, false, false];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toMin = hm => { const [h, m] = String(hm).split(':').map(Number); return h * 60 + m; };
const nowMin = () => baseMin + Math.floor((Date.now() - loadedAt) / 60000);
const fmtMin = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

/* ───────── 데이터 ───────── */
async function load() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
    showGlobal('err', 'APPS_SCRIPT_URL이 설정되지 않았습니다. 배포 URL을 입력해주세요.');
    return false;
  }
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?_cb=' + Date.now(), { cache: 'no-store' });
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || '조회 실패');
    DATA = d; loadedAt = Date.now(); baseMin = toMin(d.now);
    showGlobal('', '');
    return true;
  } catch (e) {
    showGlobal('err', '현황을 불러오지 못했습니다: ' + e.message);
    return false;
  }
}

function recordOf(name, roundNo) {
  return (DATA?.records || []).find(r => r.name === name && r.round === roundNo);
}

/* ───────── 화면 ───────── */
function showGlobal(type, msg) {
  $('globalMsg').innerHTML = msg ? `<div class="notice ${type}">${esc(msg)}</div>` : '';
}

function tickClock() {
  if (!DATA) return;
  const d = new Date(DATA.today + 'T00:00:00');
  const wd = '일월화수목금토'[d.getDay()];
  $('clock').textContent = `${DATA.today.slice(5).replace('-', '/')}(${wd}) ${fmtMin(nowMin())}`;
}

function renderNames() {
  const sel = $('nameSel');
  const names = DATA.names || [];
  sel.innerHTML = '<option value="">이름을 선택하세요</option>' +
    names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  let saved = '';
  try { saved = localStorage.getItem(NAME_KEY) || ''; } catch (_) {}
  if (saved && names.includes(saved)) sel.value = saved;
  selName = sel.value;
}

function roundState(r) {
  const n = nowMin();
  const rec = selName ? recordOf(selName, r.no) : null;
  if (rec) return rec.status === '지연'
    ? { cls:'late', text:`지연 완료 ${rec.time}`, done:true }
    : { cls:'ok', text:`완료 ${rec.time}`, done:true };
  if (n < toMin(r.open)) return { cls:'', text:`${r.open}부터`, open:false };
  if (n <= toMin(r.deadline)) return { cls:'now', text:'진행 중', open:true };
  return { cls:'bad', text:'미완료', open:true };
}

function pickDefaultRound() {
  const rounds = DATA.rounds;
  const opened = rounds.filter(r => nowMin() >= toMin(r.open));
  if (!opened.length) return 0;
  const latest = opened[opened.length - 1];
  if (!recordOf(selName, latest.no)) return latest.no;
  const undone = opened.find(r => !recordOf(selName, r.no));
  return undone ? undone.no : latest.no;
}

function renderRounds() {
  $('roundBox').innerHTML = DATA.rounds.map(r => {
    const st = selName ? roundState(r) : { cls:'', text:'—', open: nowMin() >= toMin(r.open) };
    const disabled = !selName || (!st.open && !st.done);
    return `<button class="rbtn ${selRound === r.no ? 'sel' : ''}" data-r="${r.no}" ${disabled ? 'disabled' : ''}>
      <b>${esc(r.label)} 마감</b><small>${esc(r.deadline)}</small>
      <span class="chip ${st.cls}">${esc(st.text)}</span></button>`;
  }).join('');
  $('roundBox').querySelectorAll('.rbtn').forEach(b => b.onclick = () => {
    selRound = Number(b.dataset.r); resetSteps(); renderAll();
  });
}

function renderAll() {
  tickClock();
  renderRounds();
  const msg = $('roundMsg'), stepsEl = $('steps'), btn = $('submitBtn');
  msg.innerHTML = ''; 

  if (!selName) {
    stepsEl.innerHTML = ''; btn.classList.add('hidden');
    msg.innerHTML = '<div class="notice info">먼저 이름을 선택하세요.</div>';
    return;
  }
  if (!selRound) {
    stepsEl.innerHTML = ''; btn.classList.add('hidden');
    msg.innerHTML = `<div class="notice info">아직 제출 가능한 회차가 없습니다. 1차 마감 체크는 ${esc(DATA.rounds[0].open)}부터 가능합니다.</div>`;
    return;
  }
  const round = DATA.rounds.find(r => r.no === selRound);
  const rec = recordOf(selName, selRound);
  if (rec) {
    stepsEl.innerHTML = ''; btn.classList.add('hidden');
    msg.innerHTML = `<div class="notice done">✅ ${esc(selName)} 님은 오늘 ${esc(round.label)} 마감 셀프체크를 ${esc(rec.time)}에 완료했습니다${rec.status === '지연' ? ' (지연)' : ''}.</div>`;
    return;
  }
  if (nowMin() > toMin(round.deadline)) {
    msg.innerHTML = `<div class="notice err">⚠️ ${esc(round.label)} 마감(${esc(round.deadline)})이 지났습니다. 지금 제출하면 <b>지연</b>으로 기록됩니다.</div>`;
  }
  if (!stepsEl.dataset.built || stepsEl.dataset.built !== selName + '|' + selRound) buildSteps();
  btn.classList.remove('hidden');
  updateSteps();
}

/* ───────── 단계 ───────── */
function resetSteps() {
  confirmed = [false, false, false];
  $('steps').dataset.built = '';
}

function buildSteps() {
  const el = $('steps');
  el.dataset.built = selName + '|' + selRound;
  el.innerHTML = STEPS.map((s, si) => `
    <div class="card step" id="step${si}">
      <div class="step-head"><div class="num">${si + 1}</div><h2>${s.icon} ${esc(s.title)} 체크</h2></div>
      <p class="lock-msg hidden" id="lock${si}">🔒 ${si}단계 확인을 마치면 열립니다.</p>
      <div class="step-body">
        <p class="desc">${esc(s.desc)}</p>
        ${s.items.map((it, ii) => `
          <label class="item" id="item${si}_${ii}">
            <input type="checkbox" class="ick" id="ck${si}_${ii}" data-s="${si}">
            <div><div class="item-label">${esc(it.label)}</div><div class="item-hint">${esc(it.hint)}</div></div>
          </label>`).join('')}
        <div class="remain" id="remain${si}"></div>
      </div>
    </div>`).join('');

  el.querySelectorAll('.ick').forEach(cb => cb.onchange = () => {
    const si = Number(cb.dataset.s);
    updateSteps();
    if (cb.checked && confirmed[si]) {
      const next = $('step' + (si + 1));
      if (next) next.scrollIntoView({ behavior:'smooth', block:'start' });
      else $('submitBtn').scrollIntoView({ behavior:'smooth', block:'center' });
    }
  });
}

function updateSteps() {
  STEPS.forEach((s, si) => {
    const unlocked = si === 0 || confirmed[si - 1];
    const card = $('step' + si);
    card.classList.toggle('locked', !unlocked);
    $('lock' + si).classList.toggle('hidden', unlocked);

    let cnt = 0;
    s.items.forEach((_, ii) => {
      const cb = $(`ck${si}_${ii}`);
      if (!unlocked) cb.checked = false;          // 앞 단계가 풀리면 다시 확인
      cb.disabled = !unlocked;
      if (cb.checked) cnt++;
      $(`item${si}_${ii}`).classList.toggle('checked', cb.checked);
    });
    confirmed[si] = unlocked && cnt === s.items.length;
    card.classList.toggle('confirmed', confirmed[si]);
    $('remain' + si).textContent = confirmed[si] ? '✔ 확인 완료'
      : `확인 ${cnt}/${s.items.length} — 모든 항목을 체크하면 다음 단계가 열립니다.`;
  });
  $('submitBtn').disabled = !confirmed.every(Boolean);
}

function collectAnswers() {
  const out = {};
  STEPS.forEach(s => { out[s.key] = s.items.map(it => `[${it.label}] 확인 완료`).join('\n'); });
  return out;
}

/* ───────── 제출 ───────── */
async function submit() {
  const round = DATA.rounds.find(r => r.no === selRound);
  if (!confirm(`${selName} · ${round.label} 마감 셀프체크를 제출할까요?`)) return;
  const btn = $('submitBtn');
  btn.disabled = true; btn.textContent = '제출 중…';
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'submit', name: selName, round: selRound, answers: collectAnswers() })
    });
    const d = await res.json();
    if (!d.ok && !d.already) throw new Error(d.error || '제출 실패');
    await load();
    resetSteps();
    renderAll();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    alert('제출하지 못했습니다: ' + e.message);
    btn.disabled = false;
  } finally {
    btn.textContent = '마감 셀프체크 제출';
  }
}

/* ───────── 시작 ───────── */
$('nameSel').onchange = e => {
  selName = e.target.value;
  try { if (selName) localStorage.setItem(NAME_KEY, selName); } catch (_) {}
  selRound = selName ? pickDefaultRound() : 0;
  resetSteps(); renderAll();
};
$('submitBtn').onclick = submit;

(async () => {
  if (!(await load())) { $('nameSel').innerHTML = '<option value="">불러오기 실패</option>'; return; }
  renderNames();
  selRound = selName ? pickDefaultRound() : 0;
  renderAll();
  setInterval(() => { tickClock(); renderRounds(); }, 30000);
})();
</script>
</body>
</html>
