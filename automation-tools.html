<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 자동화 TOOL | HIQASC</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f5f3;--card:#fff;--line:#e6e2dc;--text:#2a2a2a;--muted:#8a857e;--accent:#e8853a;--accent-soft:#fdf1e7}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .wrap{max-width:880px;margin:0 auto;padding:28px 16px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
  header h1{font-size:22px;font-weight:800}
  header h1 span{color:var(--accent)}
  .back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
  .back:hover{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  .divider{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.5px}
  .divider::after{content:'';flex:1;height:1px;background:var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .tool{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-decoration:none;color:inherit;transition:.2s}
  .tool:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 24px rgba(232,133,58,.15)}
  .tool .icon{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px}
  .tool h3{font-size:16px;font-weight:800;margin-bottom:6px}
  .tool p{font-size:13px;color:var(--muted);line-height:1.6}
  footer{margin-top:40px;text-align:center;font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🤖 업무 자동화 <span>TOOL</span></h1>
    <a class="back" href="index.html">← 메인으로</a>
  </header>
  <p class="sub">반복 입력·변환 작업을 자동으로 처리하는 도구 모음</p>

  <div class="divider">◆ 자동화 도구</div>
  <div class="grid">
    <a class="tool" href="pickup-extractor.html">
      <div class="icon">📄</div>
      <h3>픽업폼 추출기</h3>
      <p>NesSoft 픽업 PDF를 올리면 픽업폼 15개 항목을 추출하고 항목별로 복사할 수 있습니다.</p>
    </a>
    <a class="tool" href="nessoft.html">
      <div class="icon">🔄</div>
      <h3>Nessoft 임포트 자동화</h3>
      <p>SVC 수리 출고일 엑셀을 정리하고 Nessoft 임포트용 XML을 자동 생성합니다.</p>
    </a>
  </div>

  <footer>DEVELOPED BY DONGGU KANG</footer>
</div>
</body>
</html>
