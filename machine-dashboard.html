<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>머신 수량 현황 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Manrope', 'Malgun Gothic', sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        /* ========== 헤더 ========== */
        .header {
            background: linear-gradient(180deg, #181b24 0%, #13151c 100%);
            border-bottom: 1px solid #2a2d3a;
            padding: 10px 30px;
            height: 56px;
            display: flex;
            align-items: center;
        }

        .header-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }

        .header-info h1 {
            font-size: 1.3em;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .update-info {
            text-align: right;
            font-size: 0.8em;
            color: #666;
        }

        .update-time {
            color: #4a90e2;
            font-weight: 700;
            font-size: 1.05em;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.5); }
            50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(46, 204, 113, 0); }
        }

        .back-link {
            color: #4a90e2;
            text-decoration: none;
            padding: 6px 14px;
            border: 1px solid rgba(74, 144, 226, 0.3);
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 0.85em;
            font-weight: 600;
        }

        .back-link:hover {
            background: #4a90e2;
            color: #fff;
        }

        /* ========== 로딩 ========== */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 56px);
        }

        .loading-inner {
            text-align: center;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 16px;
            border: 4px solid #2a2d3a;
            border-top: 4px solid #4a90e2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #666;
            font-size: 1em;
        }

        /* ========== 대시보드 메인 ========== */
        .dashboard {
            display: none;
            height: calc(100vh - 56px);
            padding: 16px 24px 12px;
        }

        .dashboard.active {
            display: flex;
            flex-direction: column;
        }

        /* 상단: 완료/잔여 패널 */
        .top-area {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            min-height: 0;
        }

        /* ========== 패널 ========== */
        .panel {
            background: #181b24;
            border: 1px solid #2a2d3a;
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel.complete {
            border-left: 4px solid #2ecc71;
        }

        .panel.remaining {
            border-left: 4px solid #e74c3c;
        }

        /* 패널 헤더 + 총 수량 한 줄 */
        .panel-top {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 14px;
        }

        .panel-label {
            font-size: 1.6em;
            font-weight: 800;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .panel.complete .panel-label { color: #2ecc71; }
        .panel.remaining .panel-label { color: #e74c3c; }

        .panel-total {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .panel-total-number {
            font-size: 5.5em;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
        }

        .panel.complete .panel-total-number { color: #2ecc71; }
        .panel.remaining .panel-total-number { color: #e74c3c; }

        .panel-total-unit {
            font-size: 1.6em;
            font-weight: 600;
            color: #666;
        }

        /* 섹션 (ORIGINAL / VERTUO / OTHER) */
        .sections-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
            overflow: hidden;
        }

        .section {
            background: #1e2130;
            border-radius: 10px;
            padding: 10px 14px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .section-title {
            font-size: 1.15em;
            font-weight: 700;
        }

        .section.original .section-title { color: #3498db; }
        .section.vertuo .section-title { color: #9b59b6; }
        .section.other .section-title { color: #e67e22; }

        .section-count {
            font-size: 1.8em;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.02em;
        }

        /* 모델 그리드 */
        .models-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .model-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 6px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .model-name {
            font-size: 0.95em;
            color: #888;
            font-weight: 600;
        }

        .model-count {
            font-size: 1.5em;
            font-weight: 800;
            color: #4a90e2;
        }

        .hidden {
            display: none !important;
        }

        /* ========== 하단: 테크니션 바 ========== */
        .tech-bar {
            margin-top: 14px;
            background: #181b24;
            border: 1px solid #2a2d3a;
            border-radius: 14px;
            padding: 14px 20px;
            flex-shrink: 0;
        }

        .tech-bar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .tech-bar-title {
            font-size: 1.15em;
            font-weight: 700;
            color: #fff;
        }

        .tech-bar-title span {
            color: #666;
            font-weight: 400;
            font-size: 0.85em;
            margin-left: 8px;
        }

        .tech-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tech-chip {
            background: linear-gradient(135deg, #1e2130 0%, #232740 100%);
            border: 1px solid #2a2d3a;
            border-radius: 10px;
            padding: 10px 16px;
            flex: 1;
            min-width: 160px;
            max-width: 240px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: border-color 0.2s;
        }

        .tech-chip:hover {
            border-color: #4a90e2;
        }

        .tech-chip-name {
            font-size: 1.15em;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
        }

        .tech-chip-total {
            font-size: 2.4em;
            font-weight: 800;
            color: #2ecc71;
            line-height: 1;
            letter-spacing: -0.03em;
        }

        .tech-chip-detail {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-left: auto;
        }

        .tech-chip-line {
            font-size: 0.8em;
            font-weight: 600;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .tech-chip-line .label {
            color: #555;
        }

        .tech-chip-line .value {
            font-weight: 800;
        }

        .tech-chip-line.ori .value { color: #3498db; }
        .tech-chip-line.ver .value { color: #9b59b6; }

        /* ========== 자동 새로고침 프로그레스 ========== */
        .refresh-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #4a90e2, #2ecc71);
            transition: width 1s linear;
            opacity: 0.6;
        }
    </style>
    <script src="config.js"></script>
</head>
<body>
    <!-- 헤더 -->
    <div class="header">
        <div class="header-container">
            <div class="header-left">
                <div class="header-icon">M</div>
                <div class="header-info">
                    <h1>머신 수량 현황 대시보드</h1>
                </div>
            </div>
            <div class="header-right">
                <div class="update-info">
                    <span class="live-dot"></span>
                    <span style="color:#888;">갱신</span>
                    <span class="update-time" id="updateTime">-</span>
                </div>
                <a href="https://donggukang09.github.io/hiqasc-platform/" class="back-link">🏠 메인으로</a>
            </div>
        </div>
    </div>

    <!-- 로딩 -->
    <div class="loading" id="loading">
        <div class="loading-inner">
            <div class="loading-spinner"></div>
            <div class="loading-text">데이터 로딩 중...</div>
        </div>
    </div>

    <!-- 대시보드 -->
    <div class="dashboard" id="dashboard">
        <!-- 상단: 완료 / 잔여 -->
        <div class="top-area">
            <!-- 완료 패널 -->
            <div class="panel complete">
                <div class="panel-top">
                    <div class="panel-label">✓ 완료</div>
                    <div class="panel-total">
                        <div class="panel-total-number" id="completeTotalCount">0</div>
                        <div class="panel-total-unit">대</div>
                    </div>
                </div>
                <div class="sections-area">
                    <div class="section original">
                        <div class="section-header">
                            <h3 class="section-title">ORIGINAL</h3>
                            <span class="section-count" id="completeOriginalCount">0</span>
                        </div>
                        <div class="models-grid" id="completeOriginalModels"></div>
                    </div>
                    <div class="section vertuo">
                        <div class="section-header">
                            <h3 class="section-title">VERTUO</h3>
                            <span class="section-count" id="completeVertuoCount">0</span>
                        </div>
                        <div class="models-grid" id="completeVertuoModels"></div>
                    </div>
                    <div class="section other hidden" id="completeOtherSection">
                        <div class="section-header">
                            <h3 class="section-title">OTHER</h3>
                            <span class="section-count" id="completeOtherCount">0</span>
                        </div>
                        <div class="models-grid" id="completeOtherModels"></div>
                    </div>
                </div>
            </div>

            <!-- 잔여 패널 -->
            <div class="panel remaining">
                <div class="panel-top">
                    <div class="panel-label">⏳ 잔여</div>
                    <div class="panel-total">
                        <div class="panel-total-number" id="remainingTotalCount">0</div>
                        <div class="panel-total-unit">대</div>
                    </div>
                </div>
                <div class="sections-area">
                    <div class="section original">
                        <div class="section-header">
                            <h3 class="section-title">ORIGINAL</h3>
                            <span class="section-count" id="remainingOriginalCount">0</span>
                        </div>
                        <div class="models-grid" id="remainingOriginalModels"></div>
                    </div>
                    <div class="section vertuo">
                        <div class="section-header">
                            <h3 class="section-title">VERTUO</h3>
                            <span class="section-count" id="remainingVertuoCount">0</span>
                        </div>
                        <div class="models-grid" id="remainingVertuoModels"></div>
                    </div>
                    <div class="section other hidden" id="remainingOtherSection">
                        <div class="section-header">
                            <h3 class="section-title">OTHER</h3>
                            <span class="section-count" id="remainingOtherCount">0</span>
                        </div>
                        <div class="models-grid" id="remainingOtherModels"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 하단: 테크니션 요약 -->
        <div class="tech-bar">
            <div class="tech-bar-header">
                <div class="tech-bar-title">👨‍🔧 테크니션별 완료<span id="techCount"></span></div>
            </div>
            <div class="tech-grid" id="technicianGrid"></div>
        </div>
    </div>

    <!-- 새로고침 프로그레스 바 -->
    <div class="refresh-bar" id="refreshBar"></div>

    <script>
        // ============================================
        // Google Sheets 설정
        // ============================================
        const SHEET_ID = SHEETS_CONFIG.machineQuantity;
        const COMPLETE_SHEET_NAME = '완료';
        const REMAINING_SHEET_NAME = '잔여';
        const MODEL_SHEET_NAME = 'model';

        let MODEL_DATABASE = [];
        const EXCLUDED_MODELS = ['Vertuo Creatista'];

        // ============================================
        // 새로고침 타이머
        // ============================================
        const REFRESH_INTERVAL = 5 * 60 * 1000; // 5분
        let refreshTimer = null;
        let refreshStart = Date.now();

        function startRefreshBar() {
            refreshStart = Date.now();
            const bar = document.getElementById('refreshBar');
            bar.style.transition = 'none';
            bar.style.width = '0%';
            requestAnimationFrame(() => {
                bar.style.transition = `width ${REFRESH_INTERVAL}ms linear`;
                bar.style.width = '100%';
            });
        }

        // ============================================
        // 데이터 로드 및 처리
        // ============================================
        async function loadData() {
            try {
                const completeUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${COMPLETE_SHEET_NAME}`;
                const remainingUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${REMAINING_SHEET_NAME}`;
                const modelUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${MODEL_SHEET_NAME}`;

                const [completeResponse, remainingResponse, modelResponse] = await Promise.all([
                    fetch(completeUrl),
                    fetch(remainingUrl),
                    fetch(modelUrl)
                ]);

                const completeText = await completeResponse.text();
                const remainingText = await remainingResponse.text();
                const modelText = await modelResponse.text();

                MODEL_DATABASE = parseGoogleSheetsData(modelText, true);
                console.log('✅ 모델 데이터 로드 완료:', MODEL_DATABASE.length, '개');

                const completeData = parseGoogleSheetsData(completeText);
                const remainingData = parseGoogleSheetsData(remainingText);

                processAllData(completeData, remainingData);

                const now = new Date();
                document.getElementById('updateTime').textContent = now.toLocaleString('ko-KR');

                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').classList.add('active');

                startRefreshBar();
            } catch (error) {
                console.error('데이터 로드 오류:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="loading-inner" style="color: #e74c3c;">
                        <h3>데이터 로드 실패</h3>
                        <p>Google Sheets에 접근할 수 없습니다.</p>
                        <p style="font-size: 0.9em; margin-top: 10px; color: #888;">시트가 "링크가 있는 모든 사용자"로 공유되어 있는지 확인하세요.</p>
                    </div>
                `;
            }
        }

        function parseGoogleSheetsData(text, isModelSheet = false) {
            const json = JSON.parse(text.substring(47).slice(0, -2));
            const rows = json.table.rows;

            let cols;
            let dataStartRow = 0;

            if (isModelSheet) {
                cols = ['International Machine ID', 'model line', 'model'];
                dataStartRow = 1;
            } else {
                cols = json.table.cols.map(col => col.label);
                dataStartRow = 0;
            }

            return rows.slice(dataStartRow).map(row => {
                const obj = {};
                row.c.forEach((cell, idx) => {
                    obj[cols[idx]] = cell ? cell.v : null;
                });
                return obj;
            });
        }

        function getModelInfo(machineId) {
            const searchId = String(machineId).trim();
            const modelInfo = MODEL_DATABASE.find(m => String(m['International Machine ID']).trim() === searchId);
            if (modelInfo) {
                const modelName = modelInfo['model'];
                const line = modelInfo['model line'];
                if (EXCLUDED_MODELS.includes(modelName)) {
                    return { line: 'OTHER', model: searchId };
                }
                return { line: line, model: modelName };
            }
            return { line: 'OTHER', model: searchId };
        }

        function processData(data) {
            const stats = { ORIGINAL: {}, VERTUO: {}, OTHER: {} };
            let totalCount = 0;

            data.forEach((row) => {
                const machineId = row['International Machine ID'];
                if (!machineId) {
                    const key = 'ID 없음';
                    stats.OTHER[key] = (stats.OTHER[key] || 0) + 1;
                    return;
                }

                const modelInfo = getModelInfo(machineId);
                const line = modelInfo.line;
                const modelName = modelInfo.model;

                if (line === 'ORIGINAL' || line === 'VERTUO') {
                    stats[line][modelName] = (stats[line][modelName] || 0) + 1;
                    totalCount += 1;
                } else {
                    stats.OTHER[machineId] = (stats.OTHER[machineId] || 0) + 1;
                }
            });

            return { stats, totalCount };
        }

        function processTechnicianData(completeData) {
            const techStats = {};

            completeData.forEach((row) => {
                const techName = row['담당자'];
                const machineId = row['International Machine ID'];

                if (!techName || !machineId) return;

                if (!techStats[techName]) {
                    techStats[techName] = { total: 0, original: 0, vertuo: 0, models: {} };
                }

                const modelInfo = getModelInfo(machineId);
                const line = modelInfo.line;
                const modelName = modelInfo.model;

                techStats[techName].total++;

                if (line === 'ORIGINAL') {
                    techStats[techName].original++;
                } else if (line === 'VERTUO') {
                    techStats[techName].vertuo++;
                }

                if (!techStats[techName].models[modelName]) {
                    techStats[techName].models[modelName] = 0;
                }
                techStats[techName].models[modelName]++;
            });

            return techStats;
        }

        function processAllData(completeData, remainingData) {
            const completeResult = processData(completeData);
            const remainingResult = processData(remainingData);
            const technicianStats = processTechnicianData(completeData);

            displayPanel('complete', completeResult.stats, completeResult.totalCount);
            displayPanel('remaining', remainingResult.stats, remainingResult.totalCount);
            displayTechnicianStats(technicianStats);
        }

        function displayPanel(prefix, stats, totalCount) {
            document.getElementById(`${prefix}TotalCount`).textContent = totalCount.toLocaleString();

            const originalCount = Object.values(stats.ORIGINAL).reduce((a, b) => a + b, 0);
            document.getElementById(`${prefix}OriginalCount`).textContent = originalCount.toLocaleString();
            displayModels(`${prefix}OriginalModels`, stats.ORIGINAL);

            const vertuoCount = Object.values(stats.VERTUO).reduce((a, b) => a + b, 0);
            document.getElementById(`${prefix}VertuoCount`).textContent = vertuoCount.toLocaleString();
            displayModels(`${prefix}VertuoModels`, stats.VERTUO);

            const otherCount = Object.values(stats.OTHER).reduce((a, b) => a + b, 0);
            document.getElementById(`${prefix}OtherCount`).textContent = otherCount.toLocaleString();
            displayModels(`${prefix}OtherModels`, stats.OTHER);

            const otherSection = document.getElementById(`${prefix}OtherSection`);
            if (otherCount === 0) {
                otherSection.classList.add('hidden');
            } else {
                otherSection.classList.remove('hidden');
            }
        }

        function displayModels(containerId, models) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const sortedModels = Object.entries(models).sort((a, b) => a[0].localeCompare(b[0]));

            sortedModels.forEach(([model, count]) => {
                const card = document.createElement('div');
                card.className = 'model-card';
                card.innerHTML = `
                    <span class="model-name">${model}</span>
                    <span class="model-count">${count.toLocaleString()}</span>
                `;
                container.appendChild(card);
            });

            if (sortedModels.length === 0) {
                container.innerHTML = '<div style="padding: 8px; text-align: center; color: #444; font-size: 0.85em;">데이터 없음</div>';
            }
        }

        function displayTechnicianStats(techStats) {
            const container = document.getElementById('technicianGrid');
            container.innerHTML = '';

            const sortedTechs = Object.entries(techStats).sort((a, b) => b[1].total - a[1].total);

            document.getElementById('techCount').textContent = `${sortedTechs.length}명`;

            sortedTechs.forEach(([techName, stats]) => {
                const chip = document.createElement('div');
                chip.className = 'tech-chip';
                chip.innerHTML = `
                    <div>
                        <div class="tech-chip-name">${techName}</div>
                    </div>
                    <div class="tech-chip-total">${stats.total}</div>
                    <div class="tech-chip-detail">
                        <div class="tech-chip-line ori">
                            <span class="label">ORI</span>
                            <span class="value">${stats.original}</span>
                        </div>
                        <div class="tech-chip-line ver">
                            <span class="label">VER</span>
                            <span class="value">${stats.vertuo}</span>
                        </div>
                    </div>
                `;
                container.appendChild(chip);
            });
        }

        // 페이지 로드 시 데이터 로드
        loadData();

        // 5분마다 자동 새로고침
        setInterval(loadData, REFRESH_INTERVAL);
    </script>
</body>
</html>
