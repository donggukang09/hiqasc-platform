<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AS팀 대체업무 트리</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#0a0e1a;
  --bg2:#1a1f2e;
  --card:#1a2040;
  --card2:#1e2547;
  --border:#2a3550;
  --border-light:#3a4565;
  --text:#ffffff;
  --text-dim:#a0aec0;
  --text-muted:#64748b;
  --as:#4a90e2;
  --as-light:#6aa5e8;
  --purple:#6366f1;
  --good:#10d9a3;
  --good-soft:rgba(16,217,163,.15);
  --good-border:rgba(16,217,163,.3);
  --bad:#f87171;
  --bad-soft:rgba(248,113,113,.15);
  --bad-border:rgba(248,113,113,.3);
  --warning:#fbbf24;
  --radius:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.3);
  --shadow:0 4px 20px rgba(0,0,0,.4);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
}

html,body{
  font-family:'Noto Sans KR',sans-serif;
  background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%);
  color:var(--text);min-height:100vh;font-size:15px;line-height:1.5;
}

/* HEADER */
.header{
  background:rgba(15,20,40,.85);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:16px 32px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.hl{display:flex;align-items:center;gap:14px;}
.hlogo{
  width:42px;height:42px;
  background:linear-gradient(135deg,var(--as),var(--purple));
  border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-family:'Outfit';font-weight:800;font-size:16px;color:#fff;
  box-shadow:0 4px 15px rgba(74,144,226,.4);
}
.header h1{font-family:'Outfit';font-size:20px;font-weight:700;}
.header h1 span{color:var(--text-muted);font-weight:400;font-size:13px;margin-left:8px;}
.hac{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

.btn{
  padding:9px 16px;border-radius:9px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:13px;
  font-family:'Noto Sans KR';font-weight:500;cursor:pointer;transition:all .2s;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{background:var(--card2);border-color:var(--as);color:var(--as-light);}
.btn-primary{background:var(--as);border-color:var(--as);color:#fff;}
.btn-primary:hover{background:#357abd;color:#fff;}

.save-status{
  display:inline-flex;align-items:center;gap:5px;padding:6px 12px;
  border-radius:18px;font-size:12px;font-weight:500;
}
.save-status:empty{display:none;}
.save-status.saving{background:rgba(74,144,226,.15);color:var(--as);border:1px solid rgba(74,144,226,.3);}
.save-status.saved{background:var(--good-soft);color:var(--good);border:1px solid var(--good-border);}
.save-status.error{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-border);}

/* MAIN */
.main{padding:28px 32px;max-width:1600px;margin:0 auto;}

/* Summary Bar */
.summary-bar{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:18px 26px;
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:30px;box-shadow:var(--shadow-sm);
}
.summary-left{display:flex;align-items:center;gap:14px;}
.summary-icon{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,var(--as),var(--purple));
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;
}
.summary-text{display:flex;flex-direction:column;}
.summary-title{font-size:14px;font-weight:700;color:#fff;}
.summary-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.summary-stats{display:flex;gap:28px;}
.sum-stat{text-align:center;}
.sum-num{font-family:'Outfit';font-size:28px;font-weight:800;line-height:1;}
.sum-num.total{color:#fff;}
.sum-num.good{color:var(--good);}
.sum-num.bad{color:var(--bad);}
.sum-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-top:4px;}

/* H3 TREE */
.tree-container{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:40px 30px;
  overflow-x:auto;box-shadow:var(--shadow);
}

.h3-tree{
  display:flex;align-items:stretch;gap:0;
  min-width:1100px;position:relative;
}

.h3-leader-col{
  display:flex;align-items:center;flex-shrink:0;
  padding-right:50px;position:relative;
}
.h3-leader-card{
  background:linear-gradient(135deg,var(--as) 0%,var(--purple) 100%);
  border-radius:18px;padding:24px 20px;
  width:210px;text-align:center;
  box-shadow:0 10px 40px rgba(74,144,226,.4);
  position:relative;overflow:hidden;
}
.h3-leader-card::after{
  content:'';position:absolute;top:-50%;right:-30%;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);
  pointer-events:none;
}
.h3-leader-icon{
  width:62px;height:62px;margin:0 auto 14px;
  background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:28px;color:#fff;backdrop-filter:blur(10px);
  position:relative;z-index:1;
}
.h3-leader-name{font-size:22px;font-weight:800;color:#fff;position:relative;z-index:1;}
.h3-leader-role{font-size:12px;color:rgba(255,255,255,.85);margin-top:4px;position:relative;z-index:1;}
.h3-leader-badge{
  margin-top:14px;padding-top:14px;
  border-top:1px solid rgba(255,255,255,.2);
  font-size:11px;color:rgba(255,255,255,.8);
  text-transform:uppercase;letter-spacing:1.5px;font-weight:700;
  position:relative;z-index:1;
}

.h3-leader-col::after{
  content:'';position:absolute;right:0;top:30px;bottom:30px;
  width:2px;background:linear-gradient(180deg,var(--as),var(--purple));
  transform:translateX(-25px);border-radius:2px;
}

.h3-tasks-col{
  flex:1;display:flex;flex-direction:column;gap:14px;
}

.h3-row{
  display:flex;align-items:center;gap:0;position:relative;
}
.h3-row::before{
  content:'';position:absolute;left:-25px;top:50%;
  width:25px;height:2px;
  background:linear-gradient(90deg,var(--as),var(--as-light));
  transform:translateY(-50%);border-radius:2px;
}

.h3-task-card{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:12px;padding:14px 18px;
  width:290px;flex-shrink:0;cursor:pointer;transition:all .25s;
  display:flex;align-items:center;gap:12px;
  position:relative;
}
.h3-task-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  border-radius:12px 0 0 12px;
}
.h3-task-card.ok::before{background:linear-gradient(180deg,var(--good),#047857);}
.h3-task-card.ng::before{background:linear-gradient(180deg,var(--bad),#b91c1c);}
.h3-task-card.ok{border-color:rgba(16,217,163,.35);}
.h3-task-card.ng{border-color:rgba(248,113,113,.35);}
.h3-task-card:hover{
  transform:translateX(4px);
  background:var(--card2);
}
.h3-task-card.ok:hover{box-shadow:0 4px 20px rgba(16,217,163,.2);border-color:var(--good);}
.h3-task-card.ng:hover{box-shadow:0 4px 20px rgba(248,113,113,.2);border-color:var(--bad);}

.h3-num{
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Outfit';font-size:14px;font-weight:800;color:#fff;
  flex-shrink:0;
}
.h3-task-card.ok .h3-num{background:linear-gradient(135deg,var(--good),#047857);box-shadow:0 2px 8px rgba(16,217,163,.3);}
.h3-task-card.ng .h3-num{background:linear-gradient(135deg,var(--bad),#b91c1c);box-shadow:0 2px 8px rgba(248,113,113,.3);}

.h3-task-name{
  font-size:14px;font-weight:700;color:#fff;
  line-height:1.35;flex:1;
}

.h3-edit-icon{
  color:var(--text-muted);font-size:13px;opacity:0;transition:opacity .2s;
}
.h3-task-card:hover .h3-edit-icon{opacity:1;}

.h3-branch{
  flex:1;display:flex;align-items:center;position:relative;
  padding-left:36px;min-height:50px;
}
.h3-branch::before{
  content:'';position:absolute;left:0;top:50%;
  width:36px;height:2px;transform:translateY(-50%);border-radius:2px;
}
.h3-row.ok .h3-branch::before{
  background:linear-gradient(90deg,rgba(16,217,163,.5),rgba(16,217,163,.2));
}
.h3-row.ng .h3-branch::before{
  background:linear-gradient(90deg,rgba(248,113,113,.5),rgba(248,113,113,.2));
}

.h3-bk-list{
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;
}
.h3-bk{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:18px;
  background:var(--good-soft);color:var(--good);
  border:1px solid var(--good-border);
  font-size:13px;font-weight:600;
  transition:all .2s;
}
.h3-bk i{font-size:10px;}
.h3-bk:hover{background:rgba(16,217,163,.25);transform:translateY(-1px);}

.h3-bk-empty{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--bad);font-size:13px;font-weight:600;
  padding:7px 14px;border-radius:18px;
  background:var(--bad-soft);border:1px dashed var(--bad-border);
}

.h3-note{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:10px;
  background:rgba(251,191,36,.12);color:var(--warning);
  border:1px solid rgba(251,191,36,.25);
  font-size:11px;font-weight:500;margin-left:8px;
}

/* 모바일 */
.mobile-view{display:none;}

/* MODAL */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  display:none;align-items:center;justify-content:center;
  z-index:1000;backdrop-filter:blur(6px);
}
.modal-backdrop.show{display:flex;}
.modal{
  background:#1a1f2e;border:1px solid var(--border);
  border-radius:18px;padding:28px;
  width:92%;max-width:540px;
  max-height:88vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);
}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--border);
}
.modal-title{
  font-family:'Outfit';font-size:17px;font-weight:700;
  display:flex;align-items:center;gap:12px;flex:1;min-width:0;
}
.modal-title .num{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--as),var(--purple));color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:'Outfit';font-size:14px;font-weight:800;flex-shrink:0;
}
.modal-title span{overflow:hidden;text-overflow:ellipsis;}
.modal-close{
  width:32px;height:32px;border-radius:8px;border:none;
  background:var(--card);color:var(--text-dim);cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.modal-close:hover{background:var(--bad);color:#fff;}

.modal-section{margin-bottom:20px;}
.modal-label{
  font-size:11px;font-weight:700;color:var(--text-dim);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}

.selected-backups{
  display:flex;flex-wrap:wrap;gap:7px;min-height:48px;
  padding:12px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;
}
.selected-backups:empty::before{
  content:'아직 대체자가 지정되지 않았습니다';
  color:var(--text-muted);font-size:12px;font-style:italic;
}
.selected-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--good-soft);border:1px solid var(--good-border);
  color:var(--good);font-size:13px;font-weight:600;
  padding:5px 12px;border-radius:16px;
}
.selected-chip .rm{
  cursor:pointer;opacity:.6;font-size:12px;
  width:16px;height:16px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.selected-chip .rm:hover{
  opacity:1;color:#fff;background:var(--bad);
}

.add-person{display:flex;gap:8px;margin-top:12px;}
.add-person select{
  flex:1;background:var(--card2);border:1.5px solid var(--border);
  color:var(--text);padding:10px 12px;border-radius:9px;
  font-size:13px;font-family:'Noto Sans KR';outline:none;cursor:pointer;
}
.add-person select:focus{border-color:var(--as);}
.add-person button{
  background:var(--as);border:1px solid var(--as);color:#fff;
  padding:0 18px;border-radius:9px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:'Noto Sans KR';transition:all .2s;
}
.add-person button:hover{background:#357abd;}

.modal-note{
  width:100%;background:var(--card2);border:1.5px solid var(--border);
  color:var(--text);padding:10px 12px;border-radius:9px;
  font-size:13px;font-family:'Noto Sans KR';outline:none;resize:vertical;min-height:70px;
}
.modal-note:focus{border-color:var(--as);}

.modal-actions{
  display:flex;gap:10px;justify-content:flex-end;
  margin-top:24px;padding-top:20px;border-top:1px solid var(--border);
}

/* LOADING */
#loadingOverlay{
  position:fixed;inset:0;background:rgba(10,14,26,.9);
  backdrop-filter:blur(6px);z-index:10000;
  display:flex;align-items:center;justify-content:center;
}
.loading-content{
  background:#1a1f2e;border:1px solid var(--border);border-radius:14px;
  padding:32px 44px;display:flex;align-items:center;gap:16px;
  color:var(--text);font-size:15px;font-weight:500;box-shadow:var(--shadow-lg);
}
.loading-content i{color:var(--as);font-size:24px;}

/* TOAST */
.toast{
  position:fixed;bottom:24px;right:24px;padding:14px 22px;
  background:#1a1f2e;border:1px solid var(--good);border-radius:10px;
  color:var(--good);font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:8px;
  transform:translateY(80px);opacity:0;transition:all .3s;z-index:2000;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{border-color:var(--bad);color:var(--bad);}

/* RESPONSIVE */
@media(max-width:1100px){
  .tree-container{display:none;}
  .mobile-view{display:block;}
  .main{padding:20px;}
  .header{padding:14px 20px;}
  .summary-bar{flex-direction:column;gap:14px;align-items:stretch;padding:16px;}
  .summary-stats{justify-content:space-around;}
}

.mobile-view .m-card{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:12px;padding:14px 16px;margin-bottom:12px;
  cursor:pointer;transition:all .2s;position:relative;
}
.mobile-view .m-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  border-radius:12px 0 0 12px;
}
.mobile-view .m-card.ok::before{background:linear-gradient(180deg,var(--good),#047857);}
.mobile-view .m-card.ng::before{background:linear-gradient(180deg,var(--bad),#b91c1c);}
.mobile-view .m-card.ok{border-color:rgba(16,217,163,.35);}
.mobile-view .m-card.ng{border-color:rgba(248,113,113,.35);}
.mobile-view .m-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.mobile-view .m-num{
  width:32px;height:32px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#fff;font-size:13px;flex-shrink:0;
}
.mobile-view .m-card.ok .m-num{background:linear-gradient(135deg,var(--good),#047857);}
.mobile-view .m-card.ng .m-num{background:linear-gradient(135deg,var(--bad),#b91c1c);}
.mobile-view .m-title{font-size:14px;font-weight:700;color:#fff;flex:1;}
.mobile-view .m-bks{display:flex;flex-wrap:wrap;gap:5px;}
</style>
</head>
<body>

<div class="header">
  <div class="hl">
    <div class="hlogo">AS</div>
    <h1>대체업무 트리<span>팀장 부재 시 대체자 지정</span></h1>
  </div>
  <div class="hac">
    <span id="saveStatus" class="save-status"></span>
    <button class="btn" onclick="reloadData()"><i class="fas fa-arrows-rotate"></i> 새로고침</button>
    <button class="btn" onclick="openSheet()"><i class="fas fa-table"></i> 시트 열기</button>
    <button class="btn" onclick="location.href='as-team.html'"><i class="fas fa-arrow-left"></i> 메인으로</button>
  </div>
</div>

<div class="main">
  <div class="summary-bar">
    <div class="summary-left">
      <div class="summary-icon"><i class="fas fa-sitemap"></i></div>
      <div class="summary-text">
        <div class="summary-title">업무 → 대체자 매핑</div>
        <div class="summary-sub">각 업무 카드를 클릭하면 대체자를 지정할 수 있습니다</div>
      </div>
    </div>
    <div class="summary-stats">
      <div class="sum-stat"><div class="sum-num total" id="sumTotal">0</div><div class="sum-label">전체</div></div>
      <div class="sum-stat"><div class="sum-num good" id="sumGood">0</div><div class="sum-label">지정됨</div></div>
      <div class="sum-stat"><div class="sum-num bad" id="sumBad">0</div><div class="sum-label">미지정</div></div>
    </div>
  </div>

  <div class="tree-container">
    <div class="h3-tree">
      <div class="h3-leader-col">
        <div class="h3-leader-card">
          <div class="h3-leader-icon"><i class="fas fa-user-tie"></i></div>
          <div class="h3-leader-name">강동구</div>
          <div class="h3-leader-role">AS팀 팀장</div>
          <div class="h3-leader-badge">부재 시 대체인력</div>
        </div>
      </div>
      <div class="h3-tasks-col" id="tasksCol"></div>
    </div>
  </div>

  <div class="mobile-view" id="mobileView"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">
        <div class="num" id="modalNum"></div>
        <span id="modalTaskTitle"></span>
      </div>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>

    <div class="modal-section">
      <div class="modal-label"><i class="fas fa-users"></i> 대체자 (여러 명 지정 가능)</div>
      <div class="selected-backups" id="selectedBackups"></div>
      <div class="add-person">
        <select id="personDropdown">
          <option value="">-- 인원 선택 --</option>
        </select>
        <button onclick="addBackup()"><i class="fas fa-plus"></i> 추가</button>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-label"><i class="fas fa-note-sticky"></i> 메모 (선택사항)</div>
      <textarea class="modal-note" id="modalNote" placeholder="특이사항, 인수인계 사항 등..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveModal()"><i class="fas fa-check"></i> 저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

<script>
const SHEET_ID = '1chkSEnFSheStqwSrL0mtR8lgFz1_7bnpYPgVbNQgAfE';
const CSV_TASKS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQOfpxnKJMysPN2t_gNKM0OeqHPHNejziDY_FhE8xgsODfz0F1yfYA0dv6Qs_4nR3e4vp3ULLEekPEy/pub?gid=1339001498&single=true&output=csv';
const CSV_PEOPLE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQOfpxnKJMysPN2t_gNKM0OeqHPHNejziDY_FhE8xgsODfz0F1yfYA0dv6Qs_4nR3e4vp3ULLEekPEy/pub?gid=1323764561&single=true&output=csv';
const APPS_SCRIPT_URL = 'PASTE_NEW_APPS_SCRIPT_URL_HERE';

let TASKS = [];
let PEOPLE = [];
let editingTaskIdx = -1;
let modalBackups = [];

const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.classList.toggle('error', !!isError);
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function updateSaveStatus(status){
  const el = document.getElementById('saveStatus');
  const map = {
    'idle':{text:'',cls:''},
    'saving':{text:'<i class="fas fa-spinner fa-spin"></i> 저장 중...',cls:'saving'},
    'saved':{text:'<i class="fas fa-check-circle"></i> 저장됨 (시트 반영 ~5분)',cls:'saved'},
    'error':{text:'<i class="fas fa-exclamation-circle"></i> 저장 실패',cls:'error'}
  };
  const s = map[status] || map.idle;
  el.innerHTML = s.text;
  el.className = 'save-status ' + s.cls;
}

function parseCSV(csvText){
  const rows=[];let row=[],field='',inQuotes=false,i=0;
  while(i<csvText.length){
    const c=csvText[i];
    if(inQuotes){
      if(c==='"'){if(csvText[i+1]==='"'){field+='"';i+=2;continue;}inQuotes=false;i++;continue;}
      field+=c;i++;continue;
    }
    if(c==='"'){inQuotes=true;i++;continue;}
    if(c===','){row.push(field);field='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue;}
    field+=c;i++;
  }
  if(field!==''||row.length>0){row.push(field);rows.push(row);}
  return rows;
}
function csvToObjects(csvText){
  const rows=parseCSV(csvText);
  if(rows.length<1)return[];
  const headers=rows[0];
  const result=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    if(r.length===1&&r[0]==='')continue;
    if(r.every(c=>c===''))continue;
    const obj={};
    headers.forEach((h,idx)=>{obj[h.trim()]=r[idx]!==undefined?r[idx]:'';});
    result.push(obj);
  }
  return result;
}
async function fetchCSV(url){
  const res = await fetch(url + '&_t=' + Date.now(), {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return csvToObjects(await res.text());
}

async function loadData(){
  showLoading(true);
  try {
    const [taskRows, peopleRows] = await Promise.all([
      fetchCSV(CSV_TASKS),
      fetchCSV(CSV_PEOPLE)
    ]);

    TASKS = taskRows.map(r => {
      const backups = [];
      for(let i=1; i<=5; i++){
        const v = r['대체자'+i];
        if(v && v.trim()) backups.push(v.trim());
      }
      return {
        no: parseInt(r['순번']) || 0,
        task: (r['업무'] || '').trim(),
        backups: backups,
        note: (r['메모'] || '').trim()
      };
    }).filter(t => t.task);

    PEOPLE = peopleRows.map(r => ({
      name: (r['이름'] || '').trim(),
      role: (r['역할'] || '').trim()
    })).filter(p => p.name);

    render();
  } catch(err) {
    console.error('로드 실패:', err);
    showToast('데이터 로드 실패: ' + err.message, true);
  } finally {
    showLoading(false);
  }
}

async function saveTasks(){
  if(APPS_SCRIPT_URL === 'PASTE_NEW_APPS_SCRIPT_URL_HERE'){
    showToast('Apps Script URL 설정 필요', true);
    return;
  }
  updateSaveStatus('saving');
  try {
    await fetch(APPS_SCRIPT_URL, {
      method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'saveBackupTasks',tasks:TASKS})
    });
    updateSaveStatus('saved');
    setTimeout(() => updateSaveStatus('idle'), 4000);
  } catch(err) {
    updateSaveStatus('error');
    showToast('저장 실패: ' + err.message, true);
  }
}

async function reloadData(){
  if(!confirm('시트에서 최신 데이터를 다시 불러옵니다. 저장되지 않은 변경사항은 사라집니다. 계속?')) return;
  await loadData();
  showToast('불러오기 완료');
}

function openSheet(){
  window.open('https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/edit', '_blank');
}

function render(){
  updateSummary();
  renderTree();
  renderMobile();
}

function updateSummary(){
  const total = TASKS.length;
  const good = TASKS.filter(t => t.backups.length > 0).length;
  document.getElementById('sumTotal').textContent = total;
  document.getElementById('sumGood').textContent = good;
  document.getElementById('sumBad').textContent = total - good;
}

function renderTree(){
  const el = document.getElementById('tasksCol');
  el.innerHTML = TASKS.map((t, idx) => {
    const hasBackup = t.backups.length > 0;
    const cls = hasBackup ? 'ok' : 'ng';

    const bksHTML = hasBackup
      ? `<div class="h3-bk-list">${t.backups.map(b => `<span class="h3-bk"><i class="fas fa-user"></i> ${esc(b)}</span>`).join('')}</div>`
      : `<span class="h3-bk-empty"><i class="fas fa-triangle-exclamation"></i> 대체자 지정 필요</span>`;

    const noteHTML = t.note ? `<span class="h3-note"><i class="fas fa-note-sticky"></i> ${esc(t.note)}</span>` : '';

    return `
      <div class="h3-row ${cls}">
        <div class="h3-task-card ${cls}" onclick="openModal(${idx})">
          <div class="h3-num">${t.no}</div>
          <div class="h3-task-name">${esc(t.task)}</div>
          <i class="fas fa-edit h3-edit-icon"></i>
        </div>
        <div class="h3-branch">
          ${bksHTML}
          ${noteHTML}
        </div>
      </div>
    `;
  }).join('');
}

function renderMobile(){
  const el = document.getElementById('mobileView');
  el.innerHTML = TASKS.map((t, idx) => {
    const hasBackup = t.backups.length > 0;
    const cls = hasBackup ? 'ok' : 'ng';
    const bksHTML = hasBackup
      ? t.backups.map(b => `<span class="h3-bk"><i class="fas fa-user"></i> ${esc(b)}</span>`).join('')
      : '<span class="h3-bk-empty"><i class="fas fa-triangle-exclamation"></i> 미지정</span>';
    return `
      <div class="m-card ${cls}" onclick="openModal(${idx})">
        <div class="m-head">
          <div class="m-num">${t.no}</div>
          <div class="m-title">${esc(t.task)}</div>
        </div>
        <div class="m-bks">${bksHTML}</div>
      </div>
    `;
  }).join('');
}

function openModal(idx){
  editingTaskIdx = idx;
  const task = TASKS[idx];
  modalBackups = [...task.backups];
  document.getElementById('modalNum').textContent = task.no;
  document.getElementById('modalTaskTitle').textContent = task.task;
  document.getElementById('modalNote').value = task.note || '';
  renderModalBackups();
  renderPersonDropdown();
  document.getElementById('modalBackdrop').classList.add('show');
}

function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('show');
  editingTaskIdx = -1;
}

function renderModalBackups(){
  const el = document.getElementById('selectedBackups');
  el.innerHTML = modalBackups.map((name,i) => `
    <span class="selected-chip">
      <i class="fas fa-user" style="font-size:10px;"></i>
      ${esc(name)}
      <span class="rm" onclick="removeBackup(${i})"><i class="fas fa-times"></i></span>
    </span>
  `).join('');
}

function renderPersonDropdown(){
  const el = document.getElementById('personDropdown');
  const options = PEOPLE
    .filter(p => !modalBackups.includes(p.name))
    .map(p => `<option value="${esc(p.name)}">${esc(p.name)} (${esc(p.role)})</option>`)
    .join('');
  el.innerHTML = '<option value="">-- 인원 선택 --</option>' + options;
}

function addBackup(){
  const sel = document.getElementById('personDropdown');
  const name = sel.value;
  if(!name){showToast('인원을 선택해주세요', true);return;}
  if(modalBackups.includes(name))return;
  modalBackups.push(name);
  renderModalBackups();
  renderPersonDropdown();
  sel.value = '';
}

function removeBackup(idx){
  modalBackups.splice(idx, 1);
  renderModalBackups();
  renderPersonDropdown();
}

function saveModal(){
  if(editingTaskIdx < 0) return;
  TASKS[editingTaskIdx].backups = [...modalBackups];
  TASKS[editingTaskIdx].note = document.getElementById('modalNote').value.trim();
  render();
  closeModal();
  saveTasks();
}

function showLoading(show){
  let ov = document.getElementById('loadingOverlay');
  if(show){
    if(!ov){
      ov = document.createElement('div');
      ov.id = 'loadingOverlay';
      ov.innerHTML = '<div class="loading-content"><i class="fas fa-spinner fa-spin"></i><span>데이터 불러오는 중...</span></div>';
      document.body.appendChild(ov);
    }
  } else if(ov) {
    ov.remove();
  }
}

loadData();
</script>
